[defaults]
vault_password_file = .vault_pass
inventory = inventory/hosts
host_key_checking = False
retry_files_enabled = False
# Modules on the target syslog their full invocation ("Invoked with env=..." and the
# podman collection's "PODMAN-CONTAINER-DEBUG: podman run ... --env ...") unless the
# task is no_log. /var/log/messages is shipped to Loki, so that leaked vault secrets.
# This sets _ansible_no_log on the TARGET side only: controller output and errors are
# unchanged. Secret-bearing tasks also carry no_log: "{{ secure_logs | default(true) }}"
# for the controller side (-e secure_logs=false to debug one).
no_target_syslog = True
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600
stdout_callback = default
result_format = yaml

# Deprecation warnings - set to False to suppress, True to see them
deprecation_warnings = True

# Inject facts as top-level vars (new behavior for Ansible 2.24+)
inject_facts_as_vars = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
