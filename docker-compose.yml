version: '3.8'

services:
  ansible:
    build:
      context: .
      dockerfile: Dockerfile
    image: ansible-vps:latest
    container_name: ansible-deployment

    # Mount SSH keys and vault password
    volumes:
      # Mount SSH to temp location (entrypoint.sh will copy with correct permissions)
      - /root/.ssh:/tmp/host-ssh:ro

      # Mount current directory for live editing
      - .:/ansible:rw

      # Mount VPS directories for configuration management
      - /workspace:/workspace:rw
      - /opt/podman-data:/opt/podman-data:rw
      - /opt/compose:/opt/compose:rw
      - /opt/backups:/opt/backups:rw

      # Mount Claude configuration
      - /root/.claude:/root/.claude:rw

      # Mount Podman socket for container management
      - /run/podman/podman.sock:/run/podman/podman.sock:rw

    # Network mode
    network_mode: host

    # Keep container running for interactive use
    stdin_open: true
    tty: true

    # Override default CMD to keep container alive
    command: ["/bin/bash", "-c", "sleep infinity"]

    # Environment variables
    environment:
      - ANSIBLE_HOST_KEY_CHECKING=False
      - ANSIBLE_FORCE_COLOR=true

  # Alternative: Run playbook directly on container start
  ansible-deploy:
    build:
      context: .
      dockerfile: Dockerfile
    image: ansible-vps:latest
    container_name: ansible-deploy-once

    volumes:
      # Mount SSH to temp location (entrypoint.sh will copy with correct permissions)
      - /root/.ssh:/tmp/host-ssh:ro

      # Mount current directory for playbooks
      - .:/ansible:rw

      # Mount VPS directories for configuration management
      - /workspace:/workspace:rw
      - /opt/podman-data:/opt/podman-data:rw
      - /opt/compose:/opt/compose:rw

      # Mount Podman socket for container management
      - /run/podman/podman.sock:/run/podman/podman.sock:rw

    network_mode: host

    # Run the full deployment
    command: >
      bash -c "
      echo 'Starting deployment...' &&
      ansible-playbook -i inventory/hosts site.yml --ask-vault-pass
      "

    # Only run when explicitly called
    profiles:
      - deploy
