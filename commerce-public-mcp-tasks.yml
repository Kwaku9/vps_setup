---
# Prepared for explicit approval. Included only with commerce_public_mcp_enabled=true.
- name: Read current shopper listener pod membership
  containers.podman.podman_container_info:
    name: commerce-mcp-dev
  register: commerce_mcp_info
- name: Start shopper-only listener without operator credential
  containers.podman.podman_container:
    name: commerce-mcp-dev
    image: localhost/aicortex-commerce-runtime:0.13.0
    pod: commerce-dev-pod
    state: started
    restart_policy: unless-stopped
    stop_timeout: 90
    recreate: '{{ app_files.changed or (commerce_mcp_info.containers | length > 0 and (commerce_mcp_info.containers[0].Pod | default("")) != (commerce_dev_pod_id.stdout | trim)) or (commerce_force_recreate | default(false) | bool) }}'
    user: '65532:65532'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges']
    memory: 128m
    pids_limit: 64
    env:
      BIND: '0.0.0.0'
      DATABASE: "{{ 'pgfile:/run/secrets/development.json' if commerce_use_postgres else '/data/commerce.db' }}"
      TELEMETRY_DATABASE: /telemetry/events.sqlite3
      PORT: '8789'
      SHOPPER_ONLY: '1'
      PUBLICATION_DATABASE: "{{ ('pgfile:/run/secrets/publications.json' if commerce_use_postgres else '/publications/commerce.db') if (commerce_production_enabled | default(false) | bool) else '' }}"
      PUBLIC_ORIGIN: 'https://commerce-mcp-dev.{{ domain_name }}'
      PYTHONDONTWRITEBYTECODE: '1'
    volumes: "{{ [commerce_root + '/app:/app:ro', '/opt/aicortex-commerce-monitoring/telemetry/mcp:/telemetry:rw'] + (['/opt/aicortex-commerce-postgres/clients/commerce_dev_ro.json:/run/secrets/development.json:ro', '/opt/aicortex-commerce-postgres/clients/commerce_pub_ro.json:/run/secrets/publications.json:ro'] if commerce_use_postgres else [commerce_data_root + ':/data:rw'] + ([commerce_publications_root + ':/publications:ro'] if (commerce_production_enabled | default(false) | bool) else [])) }}"
    command: [python, /app/server.py]
- name: Route only MCP and health on dedicated public host
  ansible.builtin.copy:
    dest: /opt/compose/traefik/dynamic/commerce-mcp-dev.yml
    mode: '0644'
    content: |
      http:
        routers:
          commerce-mcp-dev:
            rule: "Host(`commerce-mcp-dev.{{ domain_name }}`) && (PathPrefix(`/mcp/`) || Path(`/health`))"
            entryPoints: [websecure]
            service: commerce-mcp-dev
            middlewares: [crowdsec, secure-headers, rate-limit]
            tls:
              certResolver: cloudflare
              domains:
                - main: '{{ domain_name }}'
                  sans: ['*.{{ domain_name }}']
        services:
          commerce-mcp-dev:
            loadBalancer:
              servers:
                - url: 'http://{{ netseg_pods["commerce-dev-pod"].host }}:8789'
- name: Query shopper DNS
  ansible.builtin.uri:
    url: 'https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records?name=commerce-mcp-dev.{{ domain_name }}&type=CNAME'
    headers: {Authorization: 'Bearer {{ cloudflare_api_token }}'}
  register: shopper_dns
  no_log: true
- name: Create shopper DNS when absent
  ansible.builtin.uri:
    url: 'https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records'
    method: POST
    headers: {Authorization: 'Bearer {{ cloudflare_api_token }}'}
    body_format: json
    body: {type: CNAME, name: 'commerce-mcp-dev.{{ domain_name }}', content: '{{ domain_name }}', proxied: true, ttl: 1}
  when: shopper_dns.json.result | length == 0
  no_log: true
- name: Read Access applications
  ansible.builtin.uri:
    url: 'https://api.cloudflare.com/client/v4/accounts/{{ cloudflare_account_id }}/access/apps'
    headers: {Authorization: 'Bearer {{ cloudflare_api_token }}'}
  register: shopper_apps
  no_log: true
- name: Create dedicated shopper Access application
  ansible.builtin.uri:
    url: 'https://api.cloudflare.com/client/v4/accounts/{{ cloudflare_account_id }}/access/apps'
    method: POST
    headers: {Authorization: 'Bearer {{ cloudflare_api_token }}'}
    body_format: json
    body: {name: 'Commerce MCP development - application auth', domain: 'commerce-mcp-dev.{{ domain_name }}', type: self_hosted, session_duration: 24h}
    status_code: [200, 201]
  when: shopper_apps.json.result | selectattr('domain','equalto','commerce-mcp-dev.' + domain_name) | list | length == 0
  register: shopper_new_app
  no_log: true
- name: Select dedicated shopper application
  ansible.builtin.set_fact:
    shopper_app_id: "{{ shopper_new_app.json.result.id if shopper_new_app is not skipped else (shopper_apps.json.result | selectattr('domain','equalto','commerce-mcp-dev.' + domain_name) | first).id }}"
  no_log: true
- name: Read dedicated shopper policies
  ansible.builtin.uri:
    url: 'https://api.cloudflare.com/client/v4/accounts/{{ cloudflare_account_id }}/access/apps/{{ shopper_app_id }}/policies'
    headers: {Authorization: 'Bearer {{ cloudflare_api_token }}'}
  register: shopper_policies
  no_log: true
- name: Enable application authentication only on dedicated shopper hostname
  ansible.builtin.uri:
    url: 'https://api.cloudflare.com/client/v4/accounts/{{ cloudflare_account_id }}/access/apps/{{ shopper_app_id }}/policies'
    method: POST
    headers: {Authorization: 'Bearer {{ cloudflare_api_token }}'}
    body_format: json
    body:
      name: Commerce MCP application authentication
      decision: bypass
      include: [{everyone: {}}]
      precedence: 1
    status_code: [200, 201]
  when: shopper_policies.json.result | selectattr('decision','equalto','bypass') | list | length == 0
  no_log: true
