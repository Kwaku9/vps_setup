---
# Create administrative user before SSH hardening
# Usage: ansible-playbook -i inventory/hosts create-user.yml --ask-vault-pass

- name: Create administrative user
  hosts: alpine_servers
  become: true
  gather_facts: true

  vars_files:
    - vault.yml  # Load encrypted credentials

  tasks:
    - name: Create admin user
      user:
        name: "{{ admin_user }}"
        password: "{{ admin_password | password_hash('sha512') }}"
        shell: /bin/bash
        groups: wheel
        append: yes
        state: present
        create_home: yes

    - name: Add admin user to sudoers
      lineinfile:
        path: /etc/sudoers
        regexp: "^{{ admin_user }} ALL="
        line: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL"
        validate: 'visudo -cf %s'

    - name: Create .ssh directory for admin user
      file:
        path: "/home/{{ admin_user }}/.ssh"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0700'

    - name: Copy authorized_keys from root
      copy:
        src: /root/.ssh/authorized_keys
        dest: "/home/{{ admin_user }}/.ssh/authorized_keys"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0600'
        remote_src: yes

    - name: Display user creation summary
      debug:
        msg:
          - "Admin user '{{ admin_user }}' created successfully"
          - "SSH keys copied from root"
          - "User has passwordless sudo access"
          - "Test SSH connection: ssh {{ admin_user }}@{{ ansible_host }}"
          - "Before hardening, verify you can: ssh {{ admin_user }}@{{ ansible_host }} 'sudo whoami'"
