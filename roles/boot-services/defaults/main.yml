# Boot-Services Role Defaults
#
# Generates one OpenRC init script per pod/container so the platform
# auto-starts in dependency order after a reboot. Without this, pods
# stay in Exited state after the kernel boots and require manual
# `podman pod start <name>` for each one.
#
# Each entry produces /etc/init.d/<name> with:
#   - depend()  → after-only ordering against dependencies + `after local`
#                 (so /etc/local.d/firewall.start runs first)
#   - start()   → podman pod start <name>  (or podman start <name>)
#   - stop()    → graceful stop on shutdown
#   - status()  → checks podman state
#
# Setting enabled: false on an entry SKIPS init script generation entirely
# (the service stays manually controllable but doesn't auto-start).

boot_services:
  enabled: true
  # Sleep between each service start. Avoids thundering-herd on disk/CPU
  # when many pods come up at once. 0 disables.
  delay_between_starts: 1

  # Podman pods (state = "pod start" / "pod stop")
  pods:
    - { name: shared-db-pod,            enabled: true,  depends_on: [] }
    - { name: logs-pod,                  enabled: true,  depends_on: [shared-db-pod] }
    - { name: tempo-pod,                 enabled: true,  depends_on: [] }
    - { name: monitoring-pod,            enabled: true,  depends_on: [logs-pod] }
    - { name: authentication-pod,        enabled: true,  depends_on: [shared-db-pod] }
    - { name: authentication-worker-pod, enabled: true,  depends_on: [authentication-pod] }
    # llama-embed-pod (EmbeddingGemma via llama.cpp): OWUI RAG embeddings, dialed
    # cross-pod by LiteLLM. Same reboot gap as the coders/neo4j — deployed
    # 2026-06-04, then reaped after the 2026-06-17 reboot (no boot unit -> Exited
    # -> pruned). Independent store; ai-stack-pod waits on it so embeddings are
    # ready before OWUI/LiteLLM come up.
    # llama-embed-pod DISABLED 2026-07-01: embedding runs only on the Fedora GPU (a resident
    # VPS CPU embedder OOM-thrashed the box). No boot unit; ai-stack-pod no longer waits on it.
    - { name: llama-embed-pod,           enabled: false, depends_on: [] }
    - { name: ai-stack-pod,              enabled: true,  depends_on: [authentication-pod, shared-db-pod] }
    - { name: management-pod,            enabled: true,  depends_on: [authentication-pod] }
    - { name: backend-pod,               enabled: true,  depends_on: [shared-db-pod] }
    - { name: frontend-pod,              enabled: true,  depends_on: [backend-pod] }
    - { name: dev-pod,                    enabled: true,  depends_on: [] }
    - { name: security-pod,              enabled: true,  depends_on: [] }
    # neo4j-pod (neo4j-db + neo4j-mcp-server): sessions + service-map graph;
    # feeds timeline-context-api. Was missing here, so it had no boot init unit
    # and stayed Exited after the 2026-06-17 reboot (every registered pod came
    # back; this one didn't). Independent store — no pod deps.
    - { name: neo4j-pod,                 enabled: true,  depends_on: [] }
    # hermes-pod intentionally not auto-started — disabled in app config and
    # marked as "stopped on purpose" in project memory.
    - { name: hermes-pod,                enabled: false, depends_on: [] }

  # Standalone containers (state = "start" / "stop", not "pod start")
  containers:
    - { name: postgres,         enabled: true, depends_on: [] }
    - { name: redis,            enabled: true, depends_on: [] }
    - { name: crowdsec,         enabled: true, depends_on: [] }
    - { name: traefik,          enabled: true, depends_on: [crowdsec] }
    - { name: cloudflared,      enabled: true, depends_on: [traefik] }
    - { name: telegram-gateway, enabled: true, depends_on: [ai-stack-pod] }
    # telegram-coder + owui-coder are the BOT_MODE=coder / =owui siblings built
    # from the same telegram-gateway image. Without their own OpenRC service they
    # don't auto-start after a reboot, so they sit Exited and the weekly
    # `podman system prune -f` reaps them — which is exactly how they vanished
    # (the owui-coder pipe backend disappeared, breaking the OWUI CC-Sessions
    # pipe). They depend on postgres (gateway schema) like telegram-gateway.
    - { name: telegram-coder,   enabled: true, depends_on: [ai-stack-pod] }
    - { name: owui-coder,       enabled: true, depends_on: [ai-stack-pod] }
    - { name: google-docs-mcp,  enabled: true, depends_on: [] }
    # graph-RAG service for the buildfol.io chat widget; needs neo4j-pod up first.
    - { name: timeline-context-api, enabled: true, depends_on: [neo4j-pod] }
    # decks.aicortex.cloud — static slide-deck gallery; standalone nginx, routed
    # by traefik's file provider. Only reachable once traefik is up, so order it
    # after traefik (same as cloudflared).
    - { name: decks-nginx,      enabled: true, depends_on: [traefik] }
    # session-recall MCP — gemma-512 retrieval over recall.chunks. Needs postgres
    # (recall_ro on shared-db-pod) and ai-stack-pod (litellm embeddings) up first.
    # Without its own OpenRC service it sits Exited after a reboot and the weekly
    # `podman system prune -f` reaps it (same failure mode as telegram/owui-coder).
    - { name: session-recall-mcp, enabled: true, depends_on: [ai-stack-pod, shared-db-pod] }
