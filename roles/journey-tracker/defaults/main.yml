---
journey_tracker:
  enabled: true
  container_name: "journey-tracker"
  image: "docker.io/library/nginx:1.27-alpine"
  data_dir: "/opt/podman-data/journey-tracker"
  domain: "timeline"
  internal_port: 8092

  # timeline-api: graph (Neo4j) + semantic (pgvector recall.chunks) query service
  # behind the journey-tracker nginx at /api/. Runs INSIDE frontend-pod and binds
  # 127.0.0.1 only (owner rule: no 0.0.0.0 anywhere); nginx proxies to it over the
  # pod's shared loopback. Publishes no host port. Source: files/timeline-api/.
  # Secrets from vault: pg_recall_ro_password (read-only PG role, same as
  # session-recall-mcp), neo4j_password, litellm_master_key (query embedding).
  api:
    enabled: true
    container_name: "timeline-api"
    image: "localhost/timeline-api:latest"
    internal_port: 8080
    memory: "192m"
    # backend-pod (svc zone; phase 2 split, owner 2026-10-30). journey-tracker's nginx in frontend-pod reaches it by pod
    # name, so it listens on the pod interface: a recorded EXCEPTION to the no-0.0.0.0 rule (the image itself still
    # defaults to 127.0.0.1); the zone rules limit who may connect (frontend -> svc 8080).
    pod_name: "backend-pod"
    env:
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      PGHOST: "{{ netseg_pods['shared-db-pod'].host }}"
      PGPORT: "5432"
      PGDATABASE: "enterprise"
      PGUSER: "recall_ro"
      PGPASSWORD: "{{ pg_recall_ro_password | default('') }}"
      NEO4J_URI: "{{ neo4j.bolt_uri }}"
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "{{ neo4j_password | default('') }}"
      LITELLM_BASE_URL: "http://ai-stack-pod:4000/v1"
      LITELLM_API_KEY: "{{ litellm_master_key | default('') }}"
      GEMMA_MODEL: "embeddinggemma"
