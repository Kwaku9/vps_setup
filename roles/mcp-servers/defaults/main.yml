---
# MCP Servers Role Defaults
# Configure which MCP servers to deploy and their settings

mcp_servers:
  # Base configuration
  workspace_base: "/workspace"
  config_dir: "/root/.claude"
  data_dir: "/opt/podman-data/mcp"
  network: "{{ podman_network_name | default('enterprise_network') }}"

  # MCP Server Definitions
  servers:
    # n8n MCP - Workflow automation integration
    n8n_mcp:
      enabled: true
      name: "n8n-mcp"
      container_name: "n8n-mcp"
      source_path: "vscode-projects/n8n-mcp"
      transport: "http"
      port: 3002  # Avoid conflict with Grafana on 3000
      internal_port: 3000
      endpoint: "/mcp"  # MCP endpoint path
      image: "n8n-mcp:latest"
      build: true
      health_endpoint: "/health"
      requires_auth: true
      env:
        MCP_MODE: "http"
        PORT: "3000"
        LOG_LEVEL: "info"
        AUTH_TOKEN: "{{ n8n_mcp_auth_token | default('change-me-in-vault') }}"
      volumes: []
      # Note: nodes.db must be copied to data volume after container creation

    # Google Docs/Drive MCP
    google_docs:
      enabled: true
      name: "google-docs-drive"
      container_name: "google-docs-mcp"
      source_path: "vscode-projects/mcp-googledocs-server"
      transport: "http"
      port: 9090
      internal_port: 9090
      image: "google-docs-mcp:latest"
      build: true
      health_endpoint: "/health"
      env:
        MCP_MODE: "http"
        PORT: "9090"
      volumes: []
      credentials_file: "credentials.json"

    # Context7 MCP - Context protocol
    context7:
      enabled: true
      name: "context7"
      container_name: "context7-mcp"
      source_path: "vscode-projects/context7-mcp"
      transport: "http"
      port: 3001
      internal_port: 3001
      image: "context7-mcp:latest"
      build: true
      health_endpoint: "/health"
      env:
        PORT: "3001"
      volumes: []

    # IB MCP - Interactive Brokers Trading (Web API via IBeam)
    ib_mcp:
      enabled: true
      name: "ib-mcp"
      container_name: "ib-mcp-server"
      source_path: "pycharm-projects/IB_MCP"
      transport: "http"
      port: 5002
      internal_port: 5002
      endpoint: "/mcp"
      image: "ib-mcp-server:latest"
      build: true
      requires_auth: true
      env:
        MCP_SERVER_PORT: "5002"
        MCP_TRANSPORT_PROTOCOL: "streamable-http"
        AUTH_TOKEN: "{{ ib_mcp_auth_token | default('change-me-in-vault') }}"
      volumes: []
      # Two-container deployment: IBeam (5055) + mcp_server (5002)
      # IBeam handles automated IBKR authentication (headless Chrome)
      # Requires vault vars: ibkr_username, ibkr_password, ibkr_totp_secret, ib_mcp_auth_token

    # Scrapy Extractor MCP - Web scraping
    scrapy:
      enabled: true
      name: "scrapy"
      container_name: "scrapy-mcp"
      source_path: "pycharm-projects/ScrapyExtractor"
      transport: "http"
      port: 8888
      internal_port: 8888
      image: "scrapy-mcp:latest"
      build: true
      health_endpoint: "/sse"
      env:
        PORT: "8888"
        SCRAPY_PROJECT_PATH: "/workspace"
      volumes:
        - "/var/run/podman/podman.sock:/var/run/docker.sock:ro"
      # Docker-in-Docker pattern

# Build settings
mcp_build:
  force_rebuild: false
  no_cache: false
  pull: true

# Runtime settings
mcp_runtime:
  restart_policy: "unless-stopped"
  memory_limit: "512m"
  cpu_limit: "1.0"
