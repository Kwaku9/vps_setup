---
# MCP Servers Role Defaults
# Configure which MCP servers to deploy and their settings

mcp_servers:
  # Base configuration
  workspace_base: "/workspace"
  config_dir: "/root/.claude"
  data_dir: "/opt/podman-data/mcp"
  network: "{{ podman_network_name | default('enterprise_network') }}"

  # MCP Server Definitions
  # Source code for each MCP server lives at roles/mcp-servers/files/<name>/
  # and is synced to /opt/compose/mcp-<name>/ on the VPS before image build.
  # source_path removed — implicit in the role's files/ directory.
  servers:
    # Telegram Gateway — bidirectional Telegram <-> Claude gateway
    telegram_gateway:
      enabled: true
      name: "telegram-gateway"
      container_name: "telegram-gateway"
      build_name: "telegram-gateway"
      image: "localhost/telegram-gateway:latest"
      build: true
      port: 7555
      internal_port: 7555
      env:
        MCP_SERVER_PORT: "7555"
        AUTH_TOKEN: "{{ telegram_gateway_auth_token | default('') }}"
        TELEGRAM_BOT_TOKEN: "{{ telegram_bot_token | default('') }}"
        TELEGRAM_WEBHOOK_SECRET: "{{ telegram_webhook_secret | default('') }}"
        TELEGRAM_ALLOWED_USER_IDS: "{{ telegram_allowed_user_ids | default('') }}"
        DB_HOST: "shared-db-pod"
        DB_PORT: "5432"
        DB_NAME: "enterprise"
        DB_USER: "telegram_gw"
        DB_PASSWORD: "{{ pg_telegram_gw_password | default('') }}"
        OTEL_EXPORTER_OTLP_ENDPOINT: "http://logs-pod:4318"
        OTEL_SERVICE_NAME: "telegram-gateway"

    # Google Docs/Drive MCP
    google_docs:
      enabled: true
      name: "google-docs-mcp"
      container_name: "google-docs-mcp"
      build_name: "mcp-googledocs-server"  # matches roles/mcp-servers/files/<name>/
      transport: "stdio"
      port: 9091
      internal_port: 9091
      image: "google-docs-mcp:latest"
      build: true
      command: "node ./dist/server.js"
      env:
        MCP_TRANSPORT: "httpStream"
        PORT: "9091"
      stdio_env:
        MCP_TRANSPORT: "stdio"
      volumes: []
      credentials_file: "credentials.json"

    # IB MCP - Interactive Brokers Trading (Web API via IBeam)
    ib_mcp:
      enabled: true
      name: "ib-mcp"
      container_name: "ib-mcp-server"
      build_name: "ib-mcp-server"
      build_subdir: "mcp_server"  # Dockerfile lives at files/ib-mcp-server/mcp_server/
      transport: "http"
      port: 5002
      internal_port: 5002
      endpoint: "/mcp"
      image: "ib-mcp-server:latest"
      build: true
      requires_auth: true
      env:
        MCP_SERVER_PORT: "5002"
        MCP_TRANSPORT_PROTOCOL: "streamable-http"
        AUTH_TOKEN: "{{ ib_mcp_auth_token | default('change-me-in-vault') }}"
      volumes: []
      # Two-container deployment: IBeam (5055) + mcp_server (5002)
      # IBeam handles automated IBKR authentication (headless Chrome)
      # Requires vault vars: ibkr_username, ibkr_password, ibkr_totp_secret, ib_mcp_auth_token

    # Scrapy Extractor MCP - Web scraping
    scrapy:
      enabled: true
      name: "scrapy"
      container_name: "scrapy-mcp"
      build_name: "scrapy-mcp"
      build_subdir: "scrapy-mcp-server"  # nested Dockerfile is the real one
      transport: "http"
      port: 8888
      internal_port: 8888
      image: "scrapy-mcp:latest"
      build: true
      health_endpoint: "/sse"
      env:
        PORT: "8888"
        SCRAPY_PROJECT_PATH: "/workspace"
      volumes:
        - "/var/run/podman/podman.sock:/var/run/docker.sock:ro"
      # Docker-in-Docker pattern

# Build settings
mcp_build:
  force_rebuild: false
  no_cache: false
  pull: true

# Runtime settings
mcp_runtime:
  restart_policy: "unless-stopped"
  memory_limit: "512m"
  cpu_limit: "1.0"
