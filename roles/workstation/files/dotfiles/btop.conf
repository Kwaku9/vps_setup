#? Config file for btop v. 1.4.7
# Written 2026-10-04 to make the two things that actually OOM-kill this laptop
# visible: GPU VRAM, and tmpfs mounts (/tmp is RAM-backed and was holding 3.3GB).

color_theme = "Default"
theme_background = False
truecolor = True

# Memory first: this box dies of RAM, not CPU.
#
# 2026-10-05: the original "cpu mem net proc gpu0" needed a 36-row terminal and
# the real one is 144x28, so btop refused to start with "Terminal size too
# small". Measured in a pty at 144x28: any layout with a separate gpu0 box AND
# the cpu box needs 36 rows; dropping cpu makes gpu0 fit. Note show_gpu_info
# alone does NOT put GPU stats in the cpu box here - it only adds a "gpu-totals"
# toggle label - so a visible GPU needs the gpu0 box.
#
# Default is memory + GPU, which is what actually bites on this machine.
# Press `p` / `shift+p` to cycle presets below for the classic CPU view.
shown_boxes = "mem proc gpu0"

#* Presets, switched with p / shift+p. Boxes within a preset are comma
#* separated; presets are separated by spaces. Preset 0 is always every box,
#* which does NOT fit 28 rows - skip it. Both presets below are verified to fit.
#*   1 = memory + GPU + processes (default use)
#*   2 = classic btop: cpu + mem + net + proc, no GPU
presets = "mem:0:default,proc:0:default,gpu0:0:default cpu:0:default,mem:0:default,net:0:default,proc:0:default"
update_ms = 1500

proc_sorting = "memory"
proc_reversed = False
proc_tree = False
proc_per_core = False
proc_mem_bytes = True

mem_graphs = True
mem_below_net = False
show_swap = True
swap_disk = False

# show_disks + only_physical=False is the important pair: with only_physical
# True (the default) btop HIDES tmpfs, so 3.3GB of RAM sitting in /tmp is
# invisible. False surfaces /tmp, /dev/shm and /run as the RAM they are.
show_disks = True
only_physical = False
disk_free_priv = False
show_io_stat = True

# GPU. btop dlopens libnvidia-ml at runtime (ldd shows nothing; that is normal).
show_gpu_info = "On"
gpu_mirror_graph = True
nvml_measure_pcie_speeds = False

show_uptime = True
check_temp = True
background_update = True
