# Drop-in on the quadlet-generated rerank-gpu.service, added 2026-10-05.
# Applies on top of the generator output in /run/user/1000/systemd/generator/.
[Unit]
# Release 1.35GB RAM and 1184MiB VRAM as soon as the proxy stops on idle.
StopWhenUnneeded=true

[Service]
# Restart=always in the quadlet fights StopWhenUnneeded: a deliberate idle stop
# is a clean exit, and systemd would bring it straight back. on-failure keeps the
# crash-recovery the quadlet wanted while letting an idle stop actually stick.
Restart=on-failure
