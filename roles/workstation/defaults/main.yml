---
# ---- Claude Code reply voice: where owner-v1 renders --------------------------------------------------------
# THE LEVER. `debian`: renders on the Debian GPU (voice-tts, needs Debian voice mode, which pauses Strata) over
# debian-voice-tunnel.service, laptop Voicebox as automatic fallback. Measured 2026-10-30 on one 41-sentence reply:
# first sound 3.6 s vs 10.8 s, 0.3 s waiting vs 48 s. `laptop`: Voicebox on this machine only, tunnel stopped.
# Flip everything (this line, the apply, Debian voice mode) with: tools/ansible-workstation.sh voice debian|laptop
speech_voice_backend: debian
# The ssh target lives in all.yml (git-crypt): this repo is public. Empty here so a run without all.yml fails loudly.
speech_voice_debian_ssh: ""
speech_voice_debian_local_port: 18095

# Workstation role defaults — Fedora laptop, NOT the VPS.
#
# This role manages the *user-level* (systemd --user) side of the laptop: the
# timers that sync VPS data down, the voice/PTT stack, and the rootless podman
# quadlets that back the local GPU services.
#
# STATE IS DESCRIPTIVE, NOT ASPIRATIONAL. Every enabled/state value below was
# read off the running machine on 2026-08-07 and is recorded so a converge run
# is a no-op. Several units are deliberately `disabled` — that is the current,
# intended reality, not a bug to be fixed. Do not flip one to `true` unless you
# actually want it running; see the per-unit notes.

workstation:
  # Absolute paths are resolved from the connecting user's home so this role is
  # not hard-wired to /home/general.
  # NOTE: ansible.cfg sets `inject_facts_as_vars = False`, so facts are only
  # available under ansible_facts.* — a bare `ansible_user_dir` is undefined.
  home: "{{ ansible_facts.user_dir }}"
  systemd_user_dir: "{{ ansible_facts.user_dir }}/.config/systemd/user"
  quadlet_dir: "{{ ansible_facts.user_dir }}/.config/containers/systemd"
  bin_dir: "{{ ansible_facts.user_dir }}/.local/bin"
  scripts_dir: "{{ ansible_facts.user_dir }}/scripts"

  # Executable scripts. `dest_dir` matters: neo4j-sync.sh and pg-sync.sh default
  # SECRETS_ENV to $HOME/scripts/secrets.env and the units invoke them by that
  # absolute path, so they must land in ~/scripts, not ~/.local/bin.
  scripts:
    - { src: bin/vps-backup-pull.sh,          dest_dir: bin }
    - { src: bin/buildfolio-heatmap-update.sh, dest_dir: bin }
    - { src: bin/piper-say.sh,                dest_dir: bin }
    # Admission control in front of Ollama, sharing ARCHIVIST's GPU lease.
    - { src: bin/gpu-lease-gate.py,           dest_dir: bin }
    # Pre-warm / release the socket-activated reranker around a batch job.
    - { src: bin/rerank-ensure,               dest_dir: bin }
    # Daily recycle for llama-embed-gpu's per-request memory leak (~85KB per
    # embedding, no plateau). Invoked by llama-embed-recycle.service.
    - { src: bin/llama-embed-recycle,         dest_dir: bin }
    # Releases Voicebox's GPU models once no Claude Code session has run for 15 min. voicebox-idle-unload.timer.
    - { src: bin/voicebox-idle-unload,        dest_dir: bin }
    - { src: scripts/neo4j-sync.sh,           dest_dir: scripts }
    - { src: scripts/pg-sync.sh,              dest_dir: scripts }
    # Every 5 min: this laptop's sessions -> postgres-local + embeddings, so local recall is minutes behind,
    # not a day. Redaction registry/key fetched from the VPS into RAM per run (fail closed).
    - { src: bin/recall-local-sync.sh,        dest_dir: scripts }

  # Podman quadlets. Files are deployed and the generator is reloaded, but the
  # resulting services are deliberately NOT state-managed — see tasks/main.yml.
  quadlets:
    - whisper-gpu.container
    - llama-embed-gpu.container
    - archivist-app.container
    # Answer model for the Knowledge Hub demo. Loopback-only; the phone reaches
    # it through the existing `tailscale serve` mapping, which is host
    # config and NOT managed here — see the role README.
    - ollama.container
    # Reranker. Deliberately has NO [Install] section: it is started on demand by
    # rerank-proxy.socket and stopped again by StopWhenUnneeded. Measured zero
    # requests 2026-09-09 -> 2026-10-05 while holding 1.35GB RAM + 1184MiB VRAM.
    - rerank-gpu.container

  # Drop-ins applied on top of units we do not own outright, including
  # quadlet-GENERATED units which cannot be edited directly.
  dropins:
    - unit: rerank-gpu.service
      name: on-demand.conf

  # Plain config files that are not systemd and not scripts.
  dotfiles:
    # btop: `only_physical: False` is load-bearing. With the default True, btop
    # HIDES tmpfs, and /tmp on this laptop is RAM-backed, so gigabytes of RAM
    # become invisible in the one tool you would reach for. Layout is capped to
    # fit a 144x28 terminal: cpu + a separate gpu0 box needs 36 rows and btop
    # REFUSES to start below that rather than degrading.
    - { src: dotfiles/btop.conf, dest: .config/btop/btop.conf }

  # Claude Code skills that are part of the machine's toolkit, not a project.
  claude_skills:
    - memwatch
    - flow-map      # AICORTEX narrated architecture maps (files git-crypt encrypted: they name tailnet hosts)

  # The Claude Code reply-voice hook (~/.claude/hooks). speak.py is the Stop/Notification entry point; it calls
  # speech_refine.py, which uses speech_voice.py (render + word/ending checks + yield to live voice calls),
  # speech_cadence.py and litellm_key.py. Deployed file by file with the source's mode (speech_refine.py is
  # executable). The hooks are registered in ~/.claude/settings.json, which this role does not rewrite.
  claude_hooks:
    - speak.py
    - tts_daemon.py
    - speech_refine.py
    - speech_voice.py
    - speech_cadence.py
    - litellm_key.py
    - briefing.py
    - speech_persona.md
    - SPEECH.md

  # systemd --user units.
  #   enabled: true|false   -> `systemctl --user enable/disable`
  #   state:   started|stopped
  #   manage:  false        -> deploy the file only; never enable/start it.
  #                            Required for `static` units (no [Install] section)
  #                            and for template units like marketwatch@.service.
  units:
    # --- Knowledge Hub demo host ------------------------------------------
    # Replaces a transient systemd-run unit that died on every reboot while the
    # tailscale serve mapping survived, leaving a home-screen icon that
    # opened a dead page.
    - name: local-rag-preview.service
      enabled: true
      state: started

    # --- GPU admission control ---------------------------------------------
    # Gates Ollama behind the same flock lease archivist's caption/embed
    # passes take, so a full card refuses an answer instead of silently
    # serving it from the CPU at 0.5 tok/s (measured 2026-09-30).
    - name: gpu-lease-gate.service
      enabled: true
      state: started

    # --- On-demand reranker ------------------------------------------------
    # The socket owns 18092 (loopback + tailnet) and starts rerank-gpu on the
    # first connection; StopWhenUnneeded in the drop-in stops it when the proxy
    # idles out after 15min. Callers are unchanged: the container moved to
    # loopback 18093 behind the proxy. Cold start to answer measured 14-16s.
    - name: rerank-proxy.socket
      enabled: true
      state: started
    # static (no [Install]): started BY the socket, never enabled directly.
    - name: rerank-proxy.service
      manage: false

    # --- llama-embed-gpu leak recycle ---------------------------------------
    # Measured 2026-10-05: ~85KB leaked per embedding, linear, no plateau, on a
    # ~890MB warm baseline. Daily 06:00, after the 05:30 neo4j-sync, the last
    # nightly consumer. Guards: skips while archivist-sync / embed-recall /
    # neo4j-sync run, skips while /run/user/1000/llama-embed-busy.lock is flock'd
    # by ad-hoc work, and skips below a 1500MB threshold.
    - name: llama-embed-recycle.timer
      enabled: true
      state: started
    # static (no [Install]): triggered by the timer only.
    - name: llama-embed-recycle.service
      manage: false

    # --- VPS -> laptop data sync -------------------------------------------
    # DISABLED on purpose since 2026-09-20, pending the owner's decision (VPS backups were aborting on low disk;
    # see memory vps-backup-pull-timer). Recorded as it is, so a converge cannot silently start it again.
    - name: vps-backup-pull.timer
      enabled: false
      state: stopped
    - name: vps-backup-pull.service
      manage: false            # oneshot, fired by the timer

    - name: neo4j-sync.timer
      enabled: true
      state: started
    - name: neo4j-sync.service
      manage: false            # static

    - name: pg-sync.timer
      enabled: true
      state: started
    - name: pg-sync.service
      manage: false            # static

    - name: recall-local-sync.timer
      enabled: true
      state: started
    - name: recall-local-sync.service
      manage: false            # static

    - name: embed-recall.timer
      enabled: true
      state: started
    - name: embed-recall.service
      manage: false            # oneshot, fired by the timer

    # --- MarketWatch --------------------------------------------------------
    - name: marketwatch-preopen.timer
      enabled: true
      state: started
    - name: marketwatch-close.timer
      enabled: true
      state: started
    - name: "marketwatch@.service"
      manage: false            # template unit; instantiated as marketwatch@preopen etc.

    # --- Voice / push-to-talk ----------------------------------------------
    # ydotoold must be up before the PTT hotkey can reach /dev/uinput, and it
    # needs the graphical session running. Both are live; leave them that way.
    - name: ydotool.service
      enabled: true
      state: started
    - name: voice-hotkey.service
      enabled: true
      state: started
    - name: vps-tts-tunnel.service
      enabled: true
      state: started
    # Voicebox: the Claude Code Stop hook speaks replies in the owner's trained voice through it (2026-10-29), and the
    # voice.demo studio's laptop route uses it. It did NOT come back after a reboot (compose, not a quadlet), so the hook
    # silently fell back to Kokoro. Idle it holds no model; the trained voice loads on first use (~2.5 GB VRAM).
    # On only while speech_voice_backend=debian (see the lever at the top of this file).
    - name: debian-voice-tunnel.service
      enabled: "{{ speech_voice_backend == 'debian' }}"
      state: "{{ 'started' if speech_voice_backend == 'debian' else 'stopped' }}"
    - name: voicebox.service
      enabled: true
      state: started
    - name: voicebox-idle-unload.timer
      enabled: true
      state: started
    # static (no [Install]): triggered by the timer only.
    - name: voicebox-idle-unload.service
      manage: false
    # Enabled but not currently running — started on demand, not at boot.
    - name: kokoro-tts.service
      enabled: true
      state: null

    # --- Deliberately dormant ----------------------------------------------
    # Superseded by vps-tts-tunnel.service.
    - name: vps-tts-daemon.service
      enabled: false
      state: stopped
    # Voice-driven computer-use. OFF on purpose: the 6GB GPU cannot host the PTT
    # stack and this at the same time. Do not enable casually.
    - name: ptt-computer-use.service
      enabled: false
      state: stopped
    # Replaced by the tailnet route; the local tunnel is no longer needed.
    - name: neo4j-vps-tunnel.service
      enabled: false
      state: stopped
    # Timeline refresh now runs on demand via the /update-timeline skill.
    - name: sync-claude-timeline.timer
      enabled: false
      state: stopped
    - name: sync-claude-timeline.service
      manage: false
    # Heatmap regeneration is run by hand when the portfolio needs it.
    - name: buildfolio-heatmap.timer
      enabled: false
      state: stopped
    - name: buildfolio-heatmap.service
      manage: false
