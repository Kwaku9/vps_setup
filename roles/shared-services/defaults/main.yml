---
# Shared Services Role Defaults

deploy_shared_services: true

shared_services:
  - name: "postgres"
    enabled: true
    # pgvector image (uid 999) — enterprise DB has the `vector` extension; plain
    # postgres lacks $libdir/vector.so and crash-loops OWUI RAG. all.yml overrides.
    image: "docker.io/pgvector/pgvector:pg16"
    port: 5432
  - name: "redis"
    enabled: true
    image: "docker.io/library/redis:7-alpine"
    port: 6379
  - name: "traefik"
    enabled: true
    image: "docker.io/library/traefik:latest"
    port: 80

# Base domain for all services (subdomains: grafana., chat., auth., etc.)
domain: "{{ domain_name }}"

# Will be overridden by vault
postgres_password: "VAULT_OVERRIDE"
crowdsec_bouncer_api_key: "VAULT_OVERRIDE"

# Sources permitted through the `internal-only` Traefik middleware. Derived from
# five days of access logs, not from assumption — see the comment on the
# middleware in templates/traefik-dynamic.yml.j2.
# Replaced by the net-edge CIDR in step 2 of the network segmentation plan.
traefik_internal_sources:
  - "10.89.0.235/32"   # cloudflared — the tunnel, i.e. all external traffic
  - "10.89.0.1/32"     # bridge gateway — dep-health-check.sh probing from the host
  - "127.0.0.0/8"      # loopback
