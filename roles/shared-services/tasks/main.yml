---
# Shared Services Role - Security Infrastructure, PostgreSQL, Redis
# All containers deployed in pods (K8s-ready)
#
# Pods:
#   security-infra-pod: Traefik + Cloudflared + CrowdSec (ingress + WAF)
#   shared-db-pod: PostgreSQL (shared database)
#   shared-cache-pod: Redis (shared cache)

# ============================================================================
# CLEANUP: Remove old standalone containers (migrating to pods)
# ============================================================================

- name: Remove old standalone containers (migrating to pods)
  containers.podman.podman_container:
    name: "{{ item }}"
    state: absent
  loop:
    - postgres
    - redis
    - traefik
  failed_when: false
  when: deploy_shared_services | default(true)
  tags: ['shared-services', 'cleanup']

- name: Remove old shared services pod (legacy)
  containers.podman.podman_pod:
    name: shared-services-pod
    state: absent
  failed_when: false
  when: deploy_shared_services | default(true)
  tags: ['shared-services', 'cleanup']

# ============================================================================
# SECURITY-INFRA-POD: Traefik + Cloudflared + CrowdSec
# ============================================================================

- name: Create security-infra pod
  containers.podman.podman_pod:
    name: security-infra-pod
    network:
      - "{{ podman_network_name | default('enterprise_network') }}"
    state: started
    ports:
      - "127.0.0.1:80:80"        # HTTP (Cloudflare Tunnel)
      - "127.0.0.1:443:443"      # HTTPS (Cloudflare Tunnel)
      - "127.0.0.1:8082:8080"    # Traefik Dashboard/API
      - "127.0.0.1:2000:2000"    # Cloudflared metrics
  when: deploy_shared_services | default(true)
  tags: ['shared-services', 'security-infra-pod', 'pod']

# ── Traefik (reverse proxy + ingress router) ──

- name: Create Traefik configuration
  template:
    src: traefik.yml.j2
    dest: /opt/compose/traefik.yml
    mode: '0644'
  when:
    - deploy_shared_services | default(true)
    - shared_services | selectattr('name', 'equalto', 'traefik') | selectattr('enabled', 'equalto', true) | list | length > 0
  tags: ['shared-services', 'security-infra-pod', 'traefik']

- name: Create Traefik dynamic config directory
  file:
    path: /opt/compose/traefik/dynamic
    state: directory
    mode: '0755'
  when:
    - deploy_shared_services | default(true)
    - shared_services | selectattr('name', 'equalto', 'traefik') | selectattr('enabled', 'equalto', true) | list | length > 0
  tags: ['shared-services', 'security-infra-pod', 'traefik']

- name: Deploy Traefik dynamic routing configuration
  template:
    src: traefik-dynamic.yml.j2
    dest: /opt/compose/traefik/dynamic/services.yml
    mode: '0644'
  when:
    - deploy_shared_services | default(true)
    - shared_services | selectattr('name', 'equalto', 'traefik') | selectattr('enabled', 'equalto', true) | list | length > 0
  tags: ['shared-services', 'security-infra-pod', 'traefik']

- name: Deploy Traefik container (in security-infra-pod)
  containers.podman.podman_container:
    name: traefik
    image: "{{ (shared_services | selectattr('name', 'equalto', 'traefik') | first).image }}"
    state: started
    pod: security-infra-pod
    memory: "128m"
    env:
      CF_DNS_API_TOKEN: "{{ cloudflare_api_token }}"
      CF_API_EMAIL: "{{ cloudflare_email }}"
    volumes:
      - /run/podman/podman.sock:/var/run/docker.sock:ro
      - /opt/compose/traefik.yml:/etc/traefik/traefik.yml:ro
      - /opt/compose/traefik/dynamic:/etc/traefik/dynamic
      - traefik-plugins:/plugins-local
{% if security.crowdsec.enabled | default(false) %}
      - /opt/podman-data/crowdsec/traefik-logs:/var/log/traefik
{% endif %}
    restart_policy: unless-stopped
  when:
    - deploy_shared_services | default(true)
    - shared_services | selectattr('name', 'equalto', 'traefik') | selectattr('enabled', 'equalto', true) | list | length > 0
  tags: ['shared-services', 'security-infra-pod', 'traefik']

# ── Cloudflared (Cloudflare Tunnel) ──

- name: Create Cloudflare config directory
  file:
    path: "{{ cloudflared.config_dir | default('/opt/compose/cloudflare') }}"
    state: directory
    mode: '0755'
  when:
    - deploy_shared_services | default(true)
    - cloudflared.enabled | default(true)
  tags: ['shared-services', 'security-infra-pod', 'cloudflared']

- name: Deploy Cloudflare Tunnel configuration
  template:
    src: "{{ playbook_dir }}/roles/cloudflared/templates/cloudflared-config.yml.j2"
    dest: "{{ cloudflared.config_dir | default('/opt/compose/cloudflare') }}/config.yml"
    mode: '0644'
  when:
    - deploy_shared_services | default(true)
    - cloudflared.enabled | default(true)
  tags: ['shared-services', 'security-infra-pod', 'cloudflared']

- name: Deploy Cloudflared container (in security-infra-pod)
  containers.podman.podman_container:
    name: "{{ cloudflared.container_name | default('cloudflared') }}"
    image: "{{ cloudflared.image | default('docker.io/cloudflare/cloudflared:latest') }}"
    state: started
    pod: security-infra-pod
    memory: "128m"
    command: "tunnel --no-autoupdate run"
    env:
      TUNNEL_TOKEN: "{{ cloudflared_tunnel_token }}"
      TUNNEL_METRICS: "0.0.0.0:{{ cloudflared.metrics_port | default(2000) }}"
      TUNNEL_TRANSPORT_PROTOCOL: "{{ cloudflared.protocol | default('quic') }}"
    volumes:
      - "{{ cloudflared.config_dir | default('/opt/compose/cloudflare') }}/config.yml:/etc/cloudflared/config.yml:ro"
    restart_policy: "unless-stopped"
  when:
    - deploy_shared_services | default(true)
    - cloudflared.enabled | default(true)
  tags: ['shared-services', 'security-infra-pod', 'cloudflared']

# ── CrowdSec (WAF / IDS) ──

- name: Create CrowdSec directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/podman-data/crowdsec/data
    - /opt/podman-data/crowdsec/config
    - /opt/podman-data/crowdsec/traefik-logs
  when:
    - deploy_shared_services | default(true)
    - security.crowdsec.enabled | default(false)
  tags: ['shared-services', 'security-infra-pod', 'crowdsec']

- name: Deploy CrowdSec acquisition config
  template:
    src: "{{ playbook_dir }}/roles/security/templates/crowdsec-acquis.yaml.j2"
    dest: /opt/podman-data/crowdsec/config/acquis.yaml
    mode: '0644'
  when:
    - deploy_shared_services | default(true)
    - security.crowdsec.enabled | default(false)
  tags: ['shared-services', 'security-infra-pod', 'crowdsec']

- name: Deploy CrowdSec LAPI port override (8180 to avoid Traefik 8080 conflict)
  copy:
    content: |
      api:
        server:
          listen_uri: 0.0.0.0:8180
    dest: /opt/podman-data/crowdsec/config/config.yaml.local
    mode: '0644'
  when:
    - deploy_shared_services | default(true)
    - security.crowdsec.enabled | default(false)
  tags: ['shared-services', 'security-infra-pod', 'crowdsec']

- name: Deploy CrowdSec container (in security-infra-pod, LAPI on 8180 to avoid Traefik 8080 conflict)
  containers.podman.podman_container:
    name: crowdsec
    image: "docker.io/{{ security.crowdsec.image | default('crowdsecurity/crowdsec:v1.6.4') }}"
    state: started
    pod: security-infra-pod
    memory: "128m"
    env:
      COLLECTIONS: "{{ security.crowdsec.collections | join(' ') }}"
      GID: "0"
    volumes:
      - /opt/podman-data/crowdsec/data:/var/lib/crowdsec/data
      - /opt/podman-data/crowdsec/config/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - /opt/podman-data/crowdsec/config/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      - /opt/podman-data/crowdsec/traefik-logs:/var/log/traefik:ro
      - /var/log:/var/log/host:ro
    restart_policy: unless-stopped
  when:
    - deploy_shared_services | default(true)
    - security.crowdsec.enabled | default(false)
  tags: ['shared-services', 'security-infra-pod', 'crowdsec']

- name: Deploy CrowdSec middleware for Traefik
  template:
    src: "{{ playbook_dir }}/roles/security/templates/crowdsec-middleware.yml.j2"
    dest: /opt/compose/traefik/dynamic/crowdsec.yml
    mode: '0644'
  when:
    - deploy_shared_services | default(true)
    - security.crowdsec.enabled | default(false)
    - crowdsec_bouncer_key is defined
    - crowdsec_bouncer_key | length > 0
  tags: ['shared-services', 'security-infra-pod', 'crowdsec']

# ============================================================================
# SHARED-DB-POD: PostgreSQL
# ============================================================================

- name: Create shared-db pod
  containers.podman.podman_pod:
    name: shared-db-pod
    network:
      - "{{ podman_network_name | default('enterprise_network') }}"
    state: started
    ports:
      - "127.0.0.1:5432:5432"    # PostgreSQL
  when: deploy_shared_services | default(true)
  tags: ['shared-services', 'shared-db-pod', 'pod']

- name: Create PostgreSQL data directory
  file:
    path: /opt/podman-data/postgres
    state: directory
    mode: '0755'
  when: deploy_shared_services | default(true)
  tags: ['shared-services', 'shared-db-pod', 'postgres']

- name: Deploy PostgreSQL container (in shared-db-pod)
  containers.podman.podman_container:
    name: postgres
    image: "{{ (shared_services | selectattr('name', 'equalto', 'postgres') | first).image }}"
    state: started
    pod: shared-db-pod
    memory: "256m"
    env:
      POSTGRES_PASSWORD: "{{ postgres_password }}"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "enterprise"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - /opt/podman-data/postgres:/var/lib/postgresql/data:Z
    restart_policy: unless-stopped
  when:
    - deploy_shared_services | default(true)
    - shared_services | selectattr('name', 'equalto', 'postgres') | selectattr('enabled', 'equalto', true) | list | length > 0
  tags: ['shared-services', 'shared-db-pod', 'postgres']

# Redis moved to authentication-pod (Authentik is the sole consumer)

# ============================================================================
# MCP-POD: MCP servers + Telegram Gateway
# ============================================================================

- name: Create mcp pod
  containers.podman.podman_pod:
    name: mcp-pod
    network:
      - "{{ podman_network_name | default('enterprise_network') }}"
    state: started
    ports:
      - "127.0.0.1:7555:7555"    # Telegram Gateway
      - "127.0.0.1:3001:3001"    # Context7 MCP
      - "127.0.0.1:9091:9091"    # Google Docs MCP
      - "127.0.0.1:8888:8888"    # Scrapy MCP (when enabled)
  when: deploy_shared_services | default(true)
  tags: ['shared-services', 'mcp-pod', 'pod']

# ── Telegram Gateway ──

- name: Deploy Telegram Gateway container (in mcp-pod)
  containers.podman.podman_container:
    name: telegram-gateway
    image: "localhost/telegram-gateway:latest"
    state: started
    pod: mcp-pod
    memory: "256m"
    env:
      TELEGRAM_BOT_TOKEN: "{{ telegram_bot_token }}"
      TELEGRAM_WEBHOOK_SECRET: "{{ telegram_webhook_secret }}"
      TELEGRAM_ALLOWED_USER_IDS: "{{ telegram_allowed_user_ids | default('8520366373') }}"
      APPROVER_ALLOW_LIST: "{{ telegram_allowed_user_ids | default('8520366373') }}"
      APPROVAL_TIMEOUT_MINUTES: "10"
      MCP_SERVER_PORT: "7555"
      MCP_TRANSPORT_PROTOCOL: "streamable-http"
      RATE_LIMIT_PER_MINUTE: "20"
      CLAUDE_CLI_TIMEOUT: "900"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "enterprise"
      DB_USER: "postgres"
      DB_PASSWORD: "{{ postgres_password }}"
      LITELLM_BASE_URL: "http://ai-stack-pod:4000"
      LITELLM_API_KEY: "{{ litellm_master_key }}"
      LITELLM_DEFAULT_MODEL: "claude-sonnet-4-20250514"
      GRAFANA_URL: "http://metrics-pod:3000"
      GRAFANA_USER: "admin"
      GRAFANA_PASSWORD: "{{ grafana_password }}"
      AUTH_TOKEN: "{{ telegram_auth_token | default('') }}"
      OTEL_SERVICE_NAME: "telegram-gateway"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://logs-pod:4318"
      PYTHONPATH: "/app"
    volumes:
      - /root/.claude:/root/.claude
      - /root/.claude.json:/root/.claude.json
      - /usr/local/bin/claude:/usr/local/bin/claude
      - /usr/local/lib/node_modules:/usr/local/lib/node_modules
      - /workspace:/workspace
    restart_policy: unless-stopped
  when: deploy_shared_services | default(true)
  tags: ['shared-services', 'mcp-pod', 'telegram-gateway']

# ── Context7 MCP ──

- name: Deploy Context7 MCP container (in mcp-pod)
  containers.podman.podman_container:
    name: context7-mcp
    image: "localhost/context7-mcp:latest"
    state: started
    pod: mcp-pod
    memory: "128m"
    env:
      PORT: "3001"
    volumes:
      - /opt/podman-data/mcp/context7:/app/data
    restart_policy: unless-stopped
  when: deploy_shared_services | default(true)
  tags: ['shared-services', 'mcp-pod', 'context7-mcp']

# ── Google Docs MCP ──

- name: Deploy Google Docs MCP container (in mcp-pod)
  containers.podman.podman_container:
    name: google-docs-mcp
    image: "localhost/google-docs-mcp:latest"
    state: started
    pod: mcp-pod
    memory: "128m"
    env:
      MCP_TRANSPORT: "httpStream"
      PORT: "9091"
    volumes:
      - /opt/podman-data/mcp/google-docs:/app/data
      - /workspace/vscode-projects/mcp-googledocs-server/credentials.json:/app/credentials.json
    restart_policy: unless-stopped
  when: deploy_shared_services | default(true)
  tags: ['shared-services', 'mcp-pod', 'google-docs-mcp']

# ── Scrapy MCP (disabled by default — enable when built) ──

- name: Deploy Scrapy MCP container (in mcp-pod)
  containers.podman.podman_container:
    name: scrapy-mcp
    image: "localhost/scrapy-mcp:latest"
    state: started
    pod: mcp-pod
    memory: "256m"
    env:
      PORT: "8888"
      SCRAPY_PROJECT_PATH: "/workspace"
    volumes:
      - /opt/podman-data/mcp/scrapy:/app/data
    restart_policy: unless-stopped
  when:
    - deploy_shared_services | default(true)
    - mcp_servers.servers.scrapy.enabled | default(false)
  tags: ['shared-services', 'mcp-pod', 'scrapy-mcp']

# ============================================================================
# STATUS
# ============================================================================

- name: Display shared services status
  debug:
    msg:
      - "Shared services deployed in pods (K8s-ready)"
      - "  security-infra-pod: Traefik, Cloudflared, CrowdSec"
      - "  shared-db-pod: PostgreSQL"
      - "  mcp-pod: Telegram Gateway, Context7 MCP, Google Docs MCP"
  when: deploy_shared_services | default(true)
  tags: ['shared-services']
