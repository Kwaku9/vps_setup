# lab.aicortex.cloud nginx vhost — sane caching for a client-review SPA.
# index.html must always revalidate (it references hash-named bundles);
# hashed bundles cache forever; media revalidates hourly so video swaps
# reach clients without hard refreshes (app also versions media URLs ?v=).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(mp4|jpg|jpeg|png|webp|svg)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Commerce API — proxied to the AWS API Gateway that larougebrows.com uses.
    # Mirrors the CloudFront /api/* behaviour in production, so the SPA calls
    # the same same-origin path here and needs no build-time base-URL switch.
    #
    # MUST come before `location /`, or try_files swallows it and POSTs get 405.
    location /api/ {
        proxy_pass https://01mzqjyea6.execute-api.us-east-1.amazonaws.com;
        proxy_http_version 1.1;

        # API Gateway routes on Host + needs SNI; without both it 403s.
        proxy_set_header Host 01mzqjyea6.execute-api.us-east-1.amazonaws.com;
        proxy_ssl_server_name on;

        # Origin is read by the checkout Lambda (against an allowlist) to decide
        # where Stripe returns the buyer — so a lab checkout comes back to lab.
        # Hardcoded https: nginx listens on :80 behind Traefik, so $scheme is
        # "http" here and would never match the https allowlist entry.
        proxy_set_header Origin https://$http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stripe signs the RAW body; buffering/altering it breaks verification.
        proxy_request_buffering off;
        proxy_buffering off;

        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
