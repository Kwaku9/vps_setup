---
# Tasks for app_deployment

- name: Find docker-compose files in vscode projects
  find:
    paths: "{{ vscode_projects_dest }}"
    patterns:
      - "docker-compose.yml"
      - "docker-compose.yaml"
    recurse: yes
    excludes:
      - "*/scripts/docker/*"          # Exclude nested dev/test compose files
      - "*/.devcontainer/*"           # Exclude devcontainer configs
  register: vscode_compose_files
  tags: ['containers']

- name: Find docker-compose files in pycharm projects
  find:
    paths: "{{ pycharm_projects_dest }}"
    patterns:
      - "docker-compose.yml"
      - "docker-compose.yaml"
    recurse: yes
    excludes:
      - "*/scripts/docker/*"
      - "*/.devcontainer/*"
  register: pycharm_compose_files
  tags: ['containers']

- name: Combine all found compose files
  set_fact:
    all_compose_files: "{{ vscode_compose_files.files + pycharm_compose_files.files }}"
  tags: ['containers']

- name: Replace Windows VScdeProjects paths in compose files
  replace:
    path: "{{ item.path }}"
    regexp: 'C:(\/|\\)+Users(\/|\\)+swirl(\/|\\)+VScdeProjects'
    replace: "{{ vscode_projects_dest }}"
  loop: "{{ all_compose_files }}"
  when: all_compose_files is defined and all_compose_files | length > 0
  tags: ['containers', 'path-fix']

- name: Replace Windows PycharmProjects paths in compose files
  replace:
    path: "{{ item.path }}"
    regexp: 'C:(\/|\\)+Users(\/|\\)+swirl(\/|\\)+PycharmProjects'
    replace: "{{ pycharm_projects_dest }}"
  loop: "{{ all_compose_files }}"
  when: all_compose_files is defined and all_compose_files | length > 0
  tags: ['containers', 'path-fix']

- name: Replace /mnt/c/ Docker Desktop style paths for .claude
  replace:
    path: "{{ item.path }}"
    regexp: '/mnt/c/Users/swirl/\.claude'
    replace: "/root/.claude"
  loop: "{{ all_compose_files }}"
  when: all_compose_files is defined and all_compose_files | length > 0
  tags: ['containers', 'path-fix']

- name: Replace C:/ Windows style paths for .claude
  replace:
    path: "{{ item.path }}"
    regexp: 'C:(\/|\\)+Users(\/|\\)+swirl(\/|\\)+\.claude'
    replace: "/root/.claude"
  loop: "{{ all_compose_files }}"
  when: all_compose_files is defined and all_compose_files | length > 0
  tags: ['containers', 'path-fix']

- name: Extract networks from compose files
  shell: |
    cd "{{ item.path | dirname }}"
    podman-compose config 2>/dev/null | grep -A 5 '^networks:' | grep -v '^--$' || echo "default"
  loop: "{{ all_compose_files }}"
  when: all_compose_files is defined and all_compose_files | length > 0
  register: compose_networks
  ignore_errors: yes
  changed_when: false
  tags: ['containers', 'networks']

- name: Display compose file readiness summary
  debug:
    msg:
      - "✓ Found {{ all_compose_files | length }} docker-compose file(s)"
      - "✓ Windows paths replaced with Linux paths"
      - "✓ Files ready for manual container deployment"
      - ""
      - "Compose files prepared:"
      - "{{ all_compose_files | map(attribute='path') | list }}"
  when: all_compose_files is defined and all_compose_files | length > 0
  tags: ['containers']
