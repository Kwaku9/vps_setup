# Tailscale Role Defaults
# Provides Tailscale VPN client on Alpine + tailnet-only socat forwarders
# for development services (currently: Expo Metro for the mobile dev build).

tailscale:
  enabled: true
  # Hostname this node registers under in the tailnet
  hostname: "alpine-vps"
  # Stable tailnet IP for this node — codified after first enrollment so
  # downstream services (socat, expo packager env) can target it.
  ip: "100.121.252.38"
  # Auth key from vault.yml; used only on first enrollment
  authkey: "{{ vault_tailscale_authkey | default('') }}"
  # OpenRC service name created by Alpine's tailscale package
  service: "tailscale"

# Tailnet-only socat forwarders.
# Each entry exposes a container port on the tailnet IP via socat.
# Used for development services that have to be HTTP (no TLS) — iOS
# dev clients accept HTTP only via NSAppTransportSecurity exceptions
# bound to the specific tailnet IP.
tailscale_forwarders:
  - name: expo-tailnet
    listen_port: 19000
    target_host: "10.89.0.30"  # dev-pod infra IP on enterprise_network
    target_port: 8082          # Metro listens here inside the pod
    description: "Expo Metro bundler for aicortex-chat iOS dev build"
  - name: litellm-spend-db
    listen_port: 5433
    target_host: "127.0.0.1"   # ai-stack-postgres is published on the host loopback at 5433
    target_port: 5433
    description: "Stack B gateway's path to the shared LiteLLM spend ledger (reached via the Mail Kit router's VPC relay); tailnet-only bind"

# ── Unbound: DNS-over-TLS resolver for tailnet clients ──────────────────────
# Codified 2026-09-09 (was hand-configured and had been crashed since June).
# Binds loopback + the tailnet address only; forwards over TLS so exit-node
# clients do not leak plaintext DNS to the upstream network.
unbound:
  enabled: true
  # The box's tailnet IPv6. The IPv4 side reuses tailscale.ip above.
  tailnet_ip6: "fd7a:115c:a1e0::bb3b:fc26"
  logfile: "/var/log/unbound.log"
  # Every lookup is logged once, as its reply (rcode, latency, cache hit).
  # Query lines would only duplicate it. logrotate keeps the file bounded.
  log_queries: false
  log_replies: true
  control_socket: "/run/unbound.ctl"
  # unbound-stats writes unbound.prom here for node-exporter (monitoring role).
  textfile_dir: "/opt/compose/textfile-collector"

  # Ad/tracker blocking (RPZ), owner decision 2026-10-21: block obvious ad and
  # tracker names for TAILNET DEVICES ONLY. The VPS's own services (loopback)
  # are never filtered: they legitimately call analytics/telemetry endpoints.
  # Blocked names get NXDOMAIN; each block is logged ("rpz: applied") to Loki.
  adblock:
    enabled: true
    clients: ["100.64.0.0/10", "fd7a:115c::/48"]   # must match access-control lines
    # HaGeZi Multi NORMAL (~341k entries); stepped up from Light by owner
    # decision 2026-10-22 (Light: ~136k, blocked ~4% of device lookups, no
    # breakage). unbound downloads it itself and refreshes on the zone's SOA
    # (8h); the zonefile keeps the last copy so a restart works with GitHub
    # unreachable. Memory: Light took unbound from 21M to 105M RSS.
    list_name: "hagezi-normal"
    list_url: "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/multi.txt"
    zone_dir: "/var/lib/unbound/rpz"
    # Obvious ad/tracker names that HaGeZi deliberately leaves out (even Normal)
    # because blocking them breaks sponsored-result clicks or site tag loaders.
    # Each also blocks every subdomain. Remove a line to unblock.
    extra_block:
      - ad.doubleclick.net
      - googleadservices.com
      - adservice.google.com
      - googletagmanager.com
      - adobedtm.com
    # Never blocked, overrides both lists (and their subdomains).
    allow: []
  msg_cache_size: "16m"
  rrset_cache_size: "32m"
  num_threads: 2
  upstreams:
    - "1.1.1.1@853#cloudflare-dns.com"
    - "1.0.0.1@853#cloudflare-dns.com"
    - "9.9.9.9@853#dns.quad9.net"
    - "2606:4700:4700::1111@853#cloudflare-dns.com"
    - "2620:fe::fe@853#dns.quad9.net"

# ── Host resolver: unbound primary, dnscrypt-proxy encrypted fallback ───────
# /etc/resolv.conf points at both. musl asks every nameserver at once and takes
# the first answer, so a plaintext fallback (the provider's 153.92.2.6, which
# offers no DoT/DoH) would see EVERY lookup in the clear, not just when unbound
# is down. dnscrypt-proxy keeps the fallback path encrypted (DoH). Servers are
# pinned by IP stamp, so it never needs DNS to find its own upstreams.
host_dns:
  enabled: true
  fallback_listen: "127.0.0.2:53"
  fallback_query_log: "/var/log/dnscrypt-proxy/query.log"
  # sdns:// DoH stamps: props (1=DNSSEC 2=no-log 4=no-filter), IP, host, path.
  fallback_servers:
    - name: "cloudflare-doh"
      stamp: "sdns://AgcAAAAAAAAABzEuMS4xLjEAEmNsb3VkZmxhcmUtZG5zLmNvbQovZG5zLXF1ZXJ5"
    - name: "cloudflare-doh-2"
      stamp: "sdns://AgcAAAAAAAAABzEuMC4wLjEAEmNsb3VkZmxhcmUtZG5zLmNvbQovZG5zLXF1ZXJ5"
    - name: "quad9-doh"
      stamp: "sdns://AgMAAAAAAAAABzkuOS45LjkADWRucy5xdWFkOS5uZXQKL2Rucy1xdWVyeQ"
