---
# Tailscale role handlers

- name: restart unbound
  # Handlers are suppressed entirely by --skip-tags always (measured 2026-09-09
  # on ansible-core 2.20 and 2.18), which is the house-standard flag. After such
  # a run, restart unbound by hand: `rc-service unbound restart`.
  service:
    name: unbound
    state: restarted

- name: reload unbound
  # Re-reads the config (incl. zone-names.conf) and flushes the cache without a restart.
  command: unbound-control reload
  changed_when: true

- name: restart dnscrypt-proxy
  service:
    name: dnscrypt-proxy
    state: restarted
