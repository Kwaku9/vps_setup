[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ops-dashboard"
version = "0.2.0"
description = "Operational profiles dashboard for VPS and Azure service management"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0.0",
    "pyyaml>=6.0",
    "paramiko>=3.4.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
azure = ["azure-mgmt-machinelearningservices", "azure-identity"]
api = ["fastapi", "uvicorn[standard]", "websockets", "httpx", "pydantic>=2.0"]
dev = ["pytest", "ruff"]

[project.scripts]
ops-dashboard = "ops_dashboard.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_dashboard"]
