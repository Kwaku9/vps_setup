---
grafana_reports:
  enabled: true
  pod_name: "reports-pod"
  network: "{{ podman_network_name | default('enterprise_network') }}"
  container_name: "grafana-reports"
  image: "localhost/grafana-reports:latest"
  build: true
  memory: "384m"
  port: 8765
  data_dir: "/opt/podman-data/grafana-reports"
  grafana_url: "http://metrics-pod:3000"
  s3_bucket: "{{ grafana_reports_s3_bucket | default('') }}"
  s3_prefix: "grafana-reports"
  s3_region: "us-east-1"
  presign_ttl: 3600
  render_timeout: 60   # this VPS renders slowly (~38s observed); 15s default times out
  litellm_url: "http://ai-stack-pod:4000/v1"
  litellm_model: "gpt-4o-mini"
  refresh_interval: 900
  domain: "reports.{{ domain_name }}"
