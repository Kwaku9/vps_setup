[project]
name = "grafana-reports"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.13.0,<3.0.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "httpx>=0.28.0",
    "pydantic>=2.7.0",
    "rapidfuzz>=3.9.0",
    "boto3>=1.34.0",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "moto>=5.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
