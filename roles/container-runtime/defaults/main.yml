---
# Container Runtime Role Defaults

podman_version: "latest"
enable_rootless: false
podman_network_name: "enterprise_network"
podman_network_subnet: "{{ vault_podman_network_subnet | default('10.0.0.0/24') }}"

# Zone networks come from network/zones.yml, the same file the firewall rules and the reachability
# tests are generated from, so the networks and the rules cannot disagree about addressing
# (docs/superpowers/specs/2026-10-10-network-segmentation-design.md section 3).
# Each zone carries name, cidr, bridge and purpose. `purpose` is not consumed by Ansible; it makes
# `podman network ls` output and the deploy log say what each zone is for.
segmentation_zone_doc: "{{ lookup('file', playbook_dir ~ '/network/zones.yml') | from_yaml }}"
segmentation_zones: "{{ segmentation_zone_doc.zones | dict2items | map(attribute='value') | list }}"
