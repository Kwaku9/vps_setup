<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voices</title>
<style>
  :root {
    --bg: #0b1118; --panel: #121b25; --edge: #233243; --ink: #e6eef2; --muted: #8fa3b3;
    --accent: #2dd4bf; --accent-ink: #062a26; --danger: #f87171;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font);
         padding: 32px 18px; display: flex; justify-content: center; }
  main { width: 100%; max-width: 760px; display: grid; gap: 18px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: 0.01em; }
  header p { margin: 0; color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
  label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  textarea { width: 100%; min-height: 180px; resize: vertical; background: #0d151e; color: var(--ink);
             border: 1px solid var(--edge); border-radius: 10px; padding: 12px 14px; font: inherit; }
  textarea:focus, select:focus, input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .count { justify-self: end; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .count.over { color: var(--danger); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  .field { display: grid; gap: 6px; }
  select { width: 100%; background: #0d151e; color: var(--ink); border: 1px solid var(--edge);
           border-radius: 10px; padding: 10px 12px; font: inherit; }
  .speed { display: flex; align-items: center; gap: 12px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .speed output { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
  .speed.off { opacity: 0.45; }
  .engines { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; border: 0; padding: 0; margin: 0; }
  .engines legend { margin-bottom: 6px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .engine { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--edge);
            border-radius: 10px; cursor: pointer; background: #0d151e; text-transform: none; letter-spacing: 0;
            font-size: 0.95rem; color: var(--ink); }
  .engine:has(input:checked) { border-color: var(--accent); }
  .engine input { margin-top: 4px; accent-color: var(--accent); }
  .engine small { display: block; color: var(--muted); font-size: 0.82rem; }
  .actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
           padding: 11px 22px; font: 600 0.95rem var(--font); cursor: pointer; }
  button:disabled { opacity: 0.55; cursor: progress; }
  .hint { color: var(--muted); font-size: 0.85rem; }
  .status { min-height: 1.4em; color: var(--muted); }
  .status.error { color: var(--danger); }
  .result { display: grid; gap: 10px; }
  audio { width: 100%; }
  a.download { color: var(--accent); font-size: 0.9rem; }
  @media (prefers-reduced-motion: no-preference) { button { transition: filter 0.15s; } button:hover:not(:disabled) { filter: brightness(1.08); } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Voices</h1>
    <p>Type text, choose an engine and a voice, listen or download.</p>
  </header>

  <section class="panel">
    <div class="field">
      <label for="text">Text</label>
      <textarea id="text" placeholder="Paste or type what you want read aloud."></textarea>
      <span class="count" id="count"></span>
    </div>
    <fieldset class="engines" id="engines" hidden><legend>Engine</legend></fieldset>
    <div class="row">
      <div class="field">
        <label for="voice">Voice</label>
        <select id="voice"></select>
      </div>
      <div class="field">
        <label for="speed">Speed</label>
        <div class="speed" id="speedBox">
          <input type="range" id="speed" min="0.5" max="2" step="0.05" value="1">
          <output id="speedOut" for="speed">1.00×</output>
        </div>
      </div>
    </div>
    <div class="actions">
      <button id="speak" type="button">Speak</button>
      <span class="hint">Ctrl + Enter also speaks.</span>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>

  <section class="panel result" id="result" hidden>
    <audio id="player" controls></audio>
    <a class="download" id="download" download>Download WAV</a>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const text = $("text"), voice = $("voice"), speed = $("speed"), speedOut = $("speedOut");
  const btn = $("speak"), status = $("status"), count = $("count");
  let maxChars = 2000, lastUrl = null, engines = {}, engine = "kokoro";
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const setStatus = (msg, isError = false) => { status.textContent = msg; status.classList.toggle("error", isError); };
  const updateCount = () => {
    const n = text.value.length;
    count.textContent = `${n.toLocaleString()} / ${maxChars.toLocaleString()} characters`;
    count.classList.toggle("over", n > maxChars);
  };
  speed.addEventListener("input", () => { speedOut.textContent = `${Number(speed.value).toFixed(2)}×`; store.set("kokoro.speed", speed.value); });
  voice.addEventListener("change", () => store.set(`voice.${engine}`, voice.value));
  text.addEventListener("input", updateCount);
  text.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); speak(); } });

  function showEngine(name) {
    engine = name; store.set("voices.engine", name);
    const e = engines[name];
    voice.replaceChildren();
    for (const [lang, list] of Object.entries(e.groups)) {
      const g = document.createElement("optgroup"); g.label = lang;
      for (const v of list) {
        const o = document.createElement("option");
        o.value = v.id; o.textContent = v.gender ? `${v.name} (${v.gender})` : v.name;
        g.appendChild(o);
      }
      voice.appendChild(g);
    }
    const saved = store.get(`voice.${name}`) || (name === "kokoro" ? store.get("kokoro.voice") : null);
    voice.value = (saved && [...voice.options].some((o) => o.value === saved)) ? saved : e.default;
    voice.disabled = voice.options.length < 2;
    speed.disabled = !e.speed;
    $("speedBox").classList.toggle("off", !e.speed);
    speed.title = e.speed ? "" : "This engine speaks at normal speed only.";
  }

  async function loadVoices() {
    const r = await fetch("api/voices");
    if (!r.ok) throw new Error(`Could not load voices (HTTP ${r.status}).`);
    const data = await r.json();
    maxChars = data.max_chars;
    engines = data.engines || { kokoro: { label: "Kokoro", default: data.default, groups: data.groups, speed: true } };
    const box = $("engines");
    for (const [name, e] of Object.entries(engines)) {
      const lab = document.createElement("label"); lab.className = "engine";
      const input = document.createElement("input");
      input.type = "radio"; input.name = "engine"; input.value = name;
      input.addEventListener("change", () => showEngine(name));
      const text = document.createElement("span"); text.textContent = e.label;
      const sub = document.createElement("small"); sub.textContent = e.hint || "";
      text.appendChild(sub); lab.append(input, text); box.appendChild(lab);
    }
    box.hidden = Object.keys(engines).length < 2;
    const want = store.get("voices.engine");
    const start = engines[want] ? want : "kokoro";
    box.querySelector(`input[value="${start}"]`).checked = true;
    showEngine(start);
    const sp = store.get("kokoro.speed");
    if (sp) { speed.value = sp; speedOut.textContent = `${Number(sp).toFixed(2)}×`; }
    updateCount();
  }

  async function speak() {
    const t = text.value.trim();
    if (!t) { setStatus("Type some text first.", true); return; }
    if (t.length > maxChars) { setStatus(`That is ${t.length} characters; the limit is ${maxChars}. Split it into parts.`, true); return; }
    btn.disabled = true; setStatus("Generating speech…");
    const started = performance.now();
    try {
      const r = await fetch("api/speak", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: t, voice: voice.value, speed: engines[engine].speed ? Number(speed.value) : 1, engine }),
      });
      if (!r.ok) {
        let detail = `HTTP ${r.status}`;
        try { const j = await r.json(); detail = typeof j.detail === "string" ? j.detail : detail; } catch {}
        throw new Error(`Speech failed: ${detail}`);
      }
      const blob = await r.blob();
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(blob);
      $("player").src = lastUrl;
      const dl = $("download"); dl.href = lastUrl; dl.download = `${engine}-${voice.value}.wav`;
      $("result").hidden = false;
      $("player").play().catch(() => {});
      setStatus(`Ready in ${((performance.now() - started) / 1000).toFixed(1)} s.`);
    } catch (e) {
      setStatus(e.message || "Speech failed.", true);
    } finally {
      btn.disabled = false;
    }
  }
  btn.addEventListener("click", speak);
  loadVoices().catch((e) => setStatus(e.message, true));
})();
</script>
</body>
</html>
