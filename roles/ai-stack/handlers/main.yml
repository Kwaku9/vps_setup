---
# AI Stack Handlers
#
# podman_container does NOT accept `state: restarted`; its choices are
# absent/present/stopped/started/created/quadlet. Handlers written that way failed
# every time they fired, so a config-only change rendered new content and the
# service kept running the old config indefinitely. Verified 2026-08-31: the
# LiteLLM config task reported changed, the handler ran, and the container's
# StartedAt did not move. Use `state: started` + `force_restart: true`, the form
# already proven in roles/security/handlers/main.yml.
#
# podman_POD is different: `restarted` IS a valid state there, so the pod handler
# below is correct as written.

# Measured 2026-09-09 on ansible-core 2.20.3 (box) and 2.18 (laptop) with a
# 3-handler probe (untagged / tags: always / tags: foo):
#   --tags foo                       -> ALL three handlers run
#   --tags foo --skip-tags always    -> NO handler runs, tagged or not
#   --skip-tags always               -> NO handler runs
# So `tags: ['always']` on a handler changes nothing (handlers already pass
# --tags filtering), and it is `--skip-tags always` that silently disables
# every handler. After such a run, restart the notified service by hand
# (`podman restart <name>`) or run the tag without --skip-tags.
- name: restart ai-stack-pod
  containers.podman.podman_pod:
    name: "{{ ai_stack.pod_name }}"
    state: restarted

- name: restart litellm
  containers.podman.podman_container:
    name: "{{ ai_stack.litellm.name }}"
    state: started
    force_restart: true

- name: restart openwebui
  containers.podman.podman_container:
    name: "{{ ai_stack.openwebui.name }}"
    state: started
    force_restart: true

- name: restart fabric-api
  containers.podman.podman_container:
    name: "{{ ai_stack.fabric_api.name }}"
    state: started
    force_restart: true
