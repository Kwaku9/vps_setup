---
# AI Stack Handlers

- name: restart ai-stack-pod
  containers.podman.podman_pod:
    name: "{{ ai_stack.pod_name }}"
    state: restarted

- name: restart n8n-claude
  containers.podman.podman_container:
    name: "{{ ai_stack.n8n_claude.name }}"
    state: restarted

- name: restart litellm
  containers.podman.podman_container:
    name: "{{ ai_stack.litellm.name }}"
    state: restarted

- name: restart openwebui
  containers.podman.podman_container:
    name: "{{ ai_stack.openwebui.name }}"
    state: restarted

- name: restart fabric-api
  containers.podman.podman_container:
    name: "{{ ai_stack.fabric_api.name }}"
    state: restarted

- name: restart claude-monitor
  containers.podman.podman_container:
    name: "{{ ai_stack.claude_monitor_backend.name }}"
    state: restarted
