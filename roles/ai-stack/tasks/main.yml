---
# AI Stack Role - n8n-claude + OpenWebUI + LiteLLM + Fabric
# Deploys the complete AI automation and interface stack

- name: Create AI stack data directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ ai_stack.data_dir }}"
    - "{{ ai_stack.data_dir }}/postgres"
    - "{{ ai_stack.data_dir }}/n8n"
    - "{{ ai_stack.data_dir }}/openwebui"
    - "{{ ai_stack.data_dir }}/litellm"
    - "{{ ai_stack.data_dir }}/fabric"
    - "{{ ai_stack.data_dir }}/claude-events"
  tags: ['ai-stack', 'always']

- name: Create AI stack pod
  containers.podman.podman_pod:
    name: "{{ ai_stack.pod_name }}"
    network: "{{ ai_stack.network }}"
    state: started
    ports:
      - "127.0.0.1:{{ ai_stack.n8n_claude.port }}:5678"           # n8n
      - "127.0.0.1:{{ ai_stack.openwebui.port }}:8080"            # OpenWebUI
      - "127.0.0.1:{{ ai_stack.litellm.port }}:4000"              # LiteLLM
      - "127.0.0.1:{{ ai_stack.fabric_api.port }}:8080"           # Fabric API (remapped)
      - "127.0.0.1:{{ ai_stack.kokoro_tts.port }}:8880"           # Kokoro TTS
      - "127.0.0.1:{{ ai_stack.claude_monitor_backend.port }}:3150"  # Claude Monitor Backend
      - "127.0.0.1:{{ ai_stack.claude_monitor_frontend.port }}:80"   # Claude Monitor Frontend
      - "127.0.0.1:{{ ai_stack.postgres.port }}:5432"             # PostgreSQL
      - "127.0.0.1:{{ ai_stack.searxng.port | default(8889) }}:8888"  # SearxNG (8888 to avoid 8080 conflict with OpenWebUI)
  when: ai_stack.enabled | default(true)
  tags: ['ai-stack', 'pod']

# PostgreSQL for AI Stack
- name: Deploy AI Stack PostgreSQL
  containers.podman.podman_container:
    name: "{{ ai_stack.postgres.name }}"
    image: "{{ ai_stack.postgres.image }}"
    state: started
    pod: "{{ ai_stack.pod_name }}"
    memory: 256m
    env:
      POSTGRES_DB: "litellm"
      POSTGRES_USER: "{{ ai_stack.postgres.user }}"
      POSTGRES_PASSWORD: "{{ ai_stack_postgres_password }}"
      POSTGRES_MULTIPLE_DATABASES: "n8n"
    volumes:
      - "{{ ai_stack.data_dir }}/postgres:/var/lib/postgresql/data:Z"
      - "{{ ai_stack.compose_dir }}/openwebui-litellm/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro"
    restart_policy: "unless-stopped"
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.postgres.enabled | default(true)
  tags: ['ai-stack', 'postgres']

# Wait for PostgreSQL to be ready
- name: Wait for PostgreSQL to be ready
  wait_for:
    host: 127.0.0.1
    port: "{{ ai_stack.postgres.port }}"
    delay: 5
    timeout: 60
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.postgres.enabled | default(true)
  tags: ['ai-stack', 'postgres']

# LiteLLM
- name: Deploy LiteLLM configuration
  template:
    src: litellm-config.yml.j2
    dest: "{{ ai_stack.data_dir }}/litellm/config.yml"
    mode: '0644'
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.litellm.enabled | default(true)
  tags: ['ai-stack', 'litellm']

- name: Deploy LiteLLM container
  containers.podman.podman_container:
    name: "{{ ai_stack.litellm.name }}"
    image: "{{ ai_stack.litellm.image }}"
    state: started
    pod: "{{ ai_stack.pod_name }}"
    memory: 512m
    env:
      DATABASE_URL: "postgresql://{{ ai_stack.postgres.user }}:{{ ai_stack_postgres_password | urlencode | replace('/', '%2F') }}@127.0.0.1:5432/litellm"
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: "{{ litellm_master_key }}"
      # Provider API keys (from vault.yml)
      OPENAI_API_KEY: "{{ openai_api_key }}"
      ANTHROPIC_API_KEY: "{{ anthropic_api_key }}"
      GEMINI_API_KEY: "{{ gemini_api_key }}"
      OPENROUTER_API_KEY: "{{ openrouter_api_key | default('') }}"
      DEEPSEEK_API_KEY: "{{ deepseek_api_key }}"
      COHERE_API_KEY: "{{ cohere_api_key }}"
      XAI_API_KEY: "{{ xai_api_key }}"
      GROQ_API_KEY: "{{ groq_api_key }}"
      # Vertex AI service account for Imagen-3
      GOOGLE_APPLICATION_CREDENTIALS: "/app/vertex-ai-key.json"
      # OpenTelemetry: per-model latency, token counts, cost per user
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://logs-pod:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/json"
      OTEL_SERVICE_NAME: "litellm"
    volumes:
      - "{{ ai_stack.data_dir }}/litellm/config.yml:/app/config.yaml:ro"
      - "{{ ai_stack.data_dir }}/litellm/vertex-ai-key.json:/app/vertex-ai-key.json:ro"
    command: "--config /app/config.yaml --port 4000 --host 0.0.0.0"
    restart_policy: "unless-stopped"
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.litellm.enabled | default(true)
  tags: ['ai-stack', 'litellm']

# Wait for LiteLLM to be ready before setup
- name: Wait for LiteLLM API to be ready
  wait_for:
    host: 127.0.0.1
    port: "{{ ai_stack.litellm.port }}"
    delay: 5
    timeout: 120
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.litellm.enabled | default(true)
  tags: ['ai-stack', 'litellm', 'litellm-setup']

# LiteLLM post-deployment: verify health
- name: Run LiteLLM post-deployment setup
  include_tasks: litellm-setup.yml
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.litellm.enabled | default(true)
  tags: ['ai-stack', 'litellm', 'litellm-setup']

# OpenWebUI
- name: Deploy OpenWebUI container
  containers.podman.podman_container:
    name: "{{ ai_stack.openwebui.name }}"
    image: "{{ ai_stack.openwebui.image }}"
    state: started
    pod: "{{ ai_stack.pod_name }}"
    memory: 512m
    recreate: true
    env:
      WEBUI_NAME: "AICORTEX"
      WEBUI_AUTH: "{{ ((openwebui_oidc_client_id is defined) or (ai_stack.openwebui.oidc.client_id | default('') | length > 0)) | ternary('True', ai_stack.openwebui.env.WEBUI_AUTH) }}"
      OPENAI_API_KEYS: "{{ litellm_master_key }}"
      OPENAI_API_BASE_URLS: "http://127.0.0.1:4000/v1"
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      OLLAMA_BASE_URL: "{{ ai_stack.openwebui.env.OLLAMA_BASE_URL }}"
      # Kokoro TTS (OpenAI-compatible endpoint in same pod)
      AUDIO_TTS_ENGINE: "openai"
      AUDIO_TTS_OPENAI_API_BASE_URL: "http://127.0.0.1:{{ ai_stack.kokoro_tts.port }}/v1"
      AUDIO_TTS_OPENAI_API_KEY: "not-needed"
      AUDIO_TTS_MODEL: "kokoro"
      AUDIO_TTS_VOICE: "af_heart"
      # OpenTelemetry instrumentation (traces + metrics → Alloy → Tempo/Prometheus)
      ENABLE_OTEL: "true"
      ENABLE_OTEL_TRACES: "true"
      ENABLE_OTEL_METRICS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://logs-pod:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: "openwebui"
      # OIDC SSO via Authentik
      ENABLE_OAUTH_SIGNUP: "{{ ((openwebui_oidc_client_id is defined) or (ai_stack.openwebui.oidc.client_id | default('') | length > 0)) | ternary('true', 'false') }}"
      ENABLE_OAUTH_GROUP_MANAGEMENT: "{{ ((openwebui_oidc_client_id is defined) or (ai_stack.openwebui.oidc.client_id | default('') | length > 0)) | ternary('true', 'false') }}"
      ENABLE_OAUTH_GROUP_CREATION: "false"
      OAUTH_GROUP_CLAIM: "groups"
      OAUTH_ADMIN_ROLES: "admins"
      ENABLE_OAUTH_ROLE_MANAGEMENT: "{{ ((openwebui_oidc_client_id is defined) or (ai_stack.openwebui.oidc.client_id | default('') | length > 0)) | ternary('true', 'false') }}"
      OAUTH_ROLES_CLAIM: "groups"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
      OAUTH_PROVIDER_NAME: "AICORSEC"
      OAUTH_CLIENT_ID: "{{ openwebui_oidc_client_id | default(ai_stack.openwebui.oidc.client_id | default('')) }}"
      OAUTH_CLIENT_SECRET: "{{ openwebui_oidc_client_secret | default(ai_stack.openwebui.oidc.client_secret | default('')) }}"
      OPENID_PROVIDER_URL: "{{ ((openwebui_oidc_client_id is defined) or (ai_stack.openwebui.oidc.client_id | default('') | length > 0)) | ternary('https://auth.' + domain_name + '/application/o/openwebui/.well-known/openid-configuration', '') }}"
      OAUTH_SCOPES: "openid email profile groups"
      WEBUI_SECRET_KEY: "{{ openwebui_secret_key }}"
      # Buffer size for streaming image chunks (base64 images can be ~2MB)
      CHAT_STREAM_RESPONSE_CHUNK_MAX_BUFFER_SIZE: "4194304"
      ENABLE_LOGIN_FORM: "false"
      DEFAULT_USER_ROLE: "{{ ((openwebui_oidc_client_id is defined) or (ai_stack.openwebui.oidc.client_id | default('') | length > 0)) | ternary('user', 'pending') }}"
    volumes:
      - "{{ ai_stack.data_dir }}/openwebui:/app/backend/data:Z"
    restart_policy: "unless-stopped"
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.openwebui.enabled | default(true)
  tags: ['ai-stack', 'openwebui']

# OpenWebUI post-deployment: configure LiteLLM connection + register models with access control
- name: Run OpenWebUI post-deployment setup
  include_tasks: openwebui-setup.yml
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.openwebui.enabled | default(true)
    - ai_stack.litellm.enabled | default(true)
  tags: ['ai-stack', 'openwebui', 'openwebui-setup']

# OpenWebUI branding: custom CSS, logo, favicon, env.py patch
- name: Apply OpenWebUI custom branding
  include_tasks: openwebui-branding.yml
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.openwebui.enabled | default(true)
  tags: ['ai-stack', 'openwebui', 'branding']

# Authentik branding: custom logo, background, CSS theme
- name: Apply Authentik custom branding
  include_tasks: authentik-branding.yml
  when:
    - ai_stack.enabled | default(true)
  tags: ['ai-stack', 'authentik', 'branding']

# Authentik application configuration: app names, icons, group-based visibility
- name: Configure Authentik applications
  include_tasks: authentik-apps.yml
  when:
    - ai_stack.enabled | default(true)
    - authentication.enabled | default(true)
  tags: ['ai-stack', 'authentik', 'authentik-apps']

# n8n-claude - Build and Deploy
- name: Check if n8n-claude source exists
  stat:
    path: "{{ ai_stack.compose_dir }}/{{ ai_stack.n8n_claude.source_path }}"
  register: n8n_claude_source
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.n8n_claude.enabled | default(true)
  tags: ['ai-stack', 'n8n-claude']

- name: Build n8n-claude container image
  containers.podman.podman_image:
    name: "{{ ai_stack.n8n_claude.image }}"
    path: "{{ ai_stack.compose_dir }}/{{ ai_stack.n8n_claude.source_path }}"
    build:
      file: Dockerfile
      rm: true
    force: "{{ ai_stack_force_rebuild | default(false) }}"
    state: present
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.n8n_claude.enabled | default(true)
    - ai_stack.n8n_claude.build | default(true)
    - n8n_claude_source.stat.exists | default(false)
  tags: ['ai-stack', 'n8n-claude', 'build']

- name: Deploy n8n-claude container
  containers.podman.podman_container:
    name: "{{ ai_stack.n8n_claude.name }}"
    image: "{{ ai_stack.n8n_claude.image }}"
    state: started
    pod: "{{ ai_stack.pod_name }}"
    memory: 256m
    env:
      DB_TYPE: "{{ ai_stack.n8n_claude.env.DB_TYPE }}"
      DB_POSTGRESDB_HOST: "127.0.0.1"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: "n8n"
      DB_POSTGRESDB_USER: "{{ ai_stack.postgres.user }}"
      DB_POSTGRESDB_PASSWORD: "{{ ai_stack_postgres_password }}"
      N8N_PROTOCOL: "{{ ai_stack.n8n_claude.env.N8N_PROTOCOL }}"
      N8N_HOST: "{{ ai_stack.n8n_claude.env.N8N_HOST }}"
      N8N_PORT: "{{ ai_stack.n8n_claude.env.N8N_PORT }}"
      NODE_ENV: "{{ ai_stack.n8n_claude.env.NODE_ENV }}"
      WEBHOOK_URL: "{{ ai_stack.n8n_claude.env.WEBHOOK_URL }}"
      CLAUDE_TELEMETRY: "{{ ai_stack.n8n_claude.env.CLAUDE_TELEMETRY }}"
      NODE_FUNCTION_ALLOW_BUILTIN: "{{ ai_stack.n8n_claude.env.NODE_FUNCTION_ALLOW_BUILTIN }}"
      N8N_RUNNERS_HEARTBEAT_INTERVAL: "{{ ai_stack.n8n_claude.env.N8N_RUNNERS_HEARTBEAT_INTERVAL }}"
      N8N_USER_MANAGEMENT_DISABLED: "false"
      # OpenTelemetry (requires @opentelemetry/auto-instrumentations-node in Dockerfile)
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://logs-pod:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/json"
      OTEL_SERVICE_NAME: "n8n-claude"
    volumes:
      - "{{ ai_stack.data_dir }}/n8n:/home/node/.n8n:Z"
      - "/root/.claude:/home/node/.claude:ro"
      - "{{ ai_stack.data_dir }}/claude-events:/workspaces/VScdeProjects/claude-monitor/storage:Z"
    restart_policy: "unless-stopped"
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.n8n_claude.enabled | default(true)
    - n8n_claude_source.stat.exists | default(false)
  tags: ['ai-stack', 'n8n-claude']

# Kokoro TTS
- name: Deploy Kokoro TTS container
  containers.podman.podman_container:
    name: "{{ ai_stack.kokoro_tts.name }}"
    image: "{{ ai_stack.kokoro_tts.image }}"
    state: started
    pod: "{{ ai_stack.pod_name }}"
    memory: 1024m
    env:
      # OpenTelemetry (env vars ignored if SDK not in image)
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://logs-pod:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/json"
      OTEL_SERVICE_NAME: "kokoro-tts"
    restart_policy: "unless-stopped"
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.kokoro_tts.enabled | default(true)
  tags: ['ai-stack', 'kokoro-tts']

# SearxNG (AI search engine)
- name: Create SearxNG data directory
  file:
    path: "{{ ai_stack.data_dir }}/searxng"
    state: directory
    mode: '0755'
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.searxng.enabled | default(false)
  tags: ['ai-stack', 'searxng']

- name: Deploy SearxNG settings
  template:
    src: searxng-settings.yml.j2
    dest: "{{ ai_stack.data_dir }}/searxng/settings.yml"
    mode: '0644'
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.searxng.enabled | default(false)
  tags: ['ai-stack', 'searxng']

- name: Deploy SearxNG container
  containers.podman.podman_container:
    name: "{{ ai_stack.searxng.name | default('searxng') }}"
    image: "{{ ai_stack.searxng.image | default('docker.io/searxng/searxng:latest') }}"
    state: started
    pod: "{{ ai_stack.pod_name }}"
    memory: 128m
    env:
      SEARXNG_PORT: "{{ ai_stack.searxng.internal_port | default('8888') }}"
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
    volumes:
      - "{{ ai_stack.data_dir }}/searxng/settings.yml:/etc/searxng/settings.yml:ro"
    restart_policy: "unless-stopped"
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.searxng.enabled | default(false)
  tags: ['ai-stack', 'searxng']

# Fabric API - Build and Deploy
- name: Check if Fabric source exists
  stat:
    path: "{{ ai_stack.compose_dir }}/{{ ai_stack.fabric_api.source_path }}"
  register: fabric_source
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.fabric_api.enabled | default(true)
  tags: ['ai-stack', 'fabric']

- name: Build Fabric API container image
  containers.podman.podman_image:
    name: "{{ ai_stack.fabric_api.image }}"
    path: "{{ ai_stack.compose_dir }}/{{ ai_stack.fabric_api.source_path }}"
    build:
      file: Dockerfile
      rm: true
    force: "{{ ai_stack_force_rebuild | default(false) }}"
    state: present
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.fabric_api.enabled | default(true)
    - ai_stack.fabric_api.build | default(true)
    - fabric_source.stat.exists | default(false)
  tags: ['ai-stack', 'fabric', 'build']

- name: Deploy Fabric API container
  containers.podman.podman_container:
    name: "{{ ai_stack.fabric_api.name }}"
    image: "{{ ai_stack.fabric_api.image }}"
    state: started
    pod: "{{ ai_stack.pod_name }}"
    volumes:
      - "{{ ai_stack.data_dir }}/fabric:/root/.config/fabric:Z"
    restart_policy: "unless-stopped"
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.fabric_api.enabled | default(true)
    - fabric_source.stat.exists | default(false)
  tags: ['ai-stack', 'fabric']

# Claude Monitor Backend - Build and Deploy
- name: Check if Claude Monitor Backend source exists
  stat:
    path: "{{ ai_stack.compose_dir }}/{{ ai_stack.claude_monitor_backend.source_path }}"
  register: claude_monitor_backend_source
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.claude_monitor_backend.enabled | default(true)
  tags: ['ai-stack', 'claude-monitor']

- name: Build Claude Monitor Backend container image
  containers.podman.podman_image:
    name: "{{ ai_stack.claude_monitor_backend.image }}"
    path: "{{ ai_stack.compose_dir }}/{{ ai_stack.claude_monitor_backend.source_path }}"
    build:
      file: Dockerfile
      rm: true
    force: "{{ ai_stack_force_rebuild | default(false) }}"
    state: present
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.claude_monitor_backend.enabled | default(true)
    - ai_stack.claude_monitor_backend.build | default(true)
    - claude_monitor_backend_source.stat.exists | default(false)
  tags: ['ai-stack', 'claude-monitor', 'build']

- name: Deploy Claude Monitor Backend container
  containers.podman.podman_container:
    name: "{{ ai_stack.claude_monitor_backend.name }}"
    image: "{{ ai_stack.claude_monitor_backend.image }}"
    state: started
    pod: "{{ ai_stack.pod_name }}"
    env:
      HOST: "{{ ai_stack.claude_monitor_backend.env.HOST }}"
      PORT: "{{ ai_stack.claude_monitor_backend.env.PORT }}"
      EVENT_LOG_PATH: "{{ ai_stack.claude_monitor_backend.env.EVENT_LOG_PATH }}"
      CORS_ORIGINS: "http://localhost:{{ ai_stack.claude_monitor_frontend.port }},http://localhost:80"
      LOG_LEVEL: "{{ ai_stack.claude_monitor_backend.env.LOG_LEVEL }}"
    volumes:
      - "{{ ai_stack.data_dir }}/claude-events:/app/storage:Z"
    restart_policy: "unless-stopped"
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.claude_monitor_backend.enabled | default(true)
    - claude_monitor_backend_source.stat.exists | default(false)
  tags: ['ai-stack', 'claude-monitor']

# Claude Monitor Frontend - Build and Deploy
- name: Check if Claude Monitor Frontend source exists
  stat:
    path: "{{ ai_stack.compose_dir }}/{{ ai_stack.claude_monitor_frontend.source_path }}"
  register: claude_monitor_frontend_source
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.claude_monitor_frontend.enabled | default(true)
  tags: ['ai-stack', 'claude-monitor']

- name: Build Claude Monitor Frontend container image
  containers.podman.podman_image:
    name: "{{ ai_stack.claude_monitor_frontend.image }}"
    path: "{{ ai_stack.compose_dir }}/{{ ai_stack.claude_monitor_frontend.source_path }}"
    build:
      file: Dockerfile
      rm: true
    force: "{{ ai_stack_force_rebuild | default(false) }}"
    state: present
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.claude_monitor_frontend.enabled | default(true)
    - ai_stack.claude_monitor_frontend.build | default(true)
    - claude_monitor_frontend_source.stat.exists | default(false)
  tags: ['ai-stack', 'claude-monitor', 'build']

- name: Deploy Claude Monitor Frontend container
  containers.podman.podman_container:
    name: "{{ ai_stack.claude_monitor_frontend.name }}"
    image: "{{ ai_stack.claude_monitor_frontend.image }}"
    state: started
    pod: "{{ ai_stack.pod_name }}"
    env:
      REACT_APP_API_URL: "http://localhost:{{ ai_stack.claude_monitor_backend.port }}/api/v1"
      REACT_APP_WS_URL: "ws://localhost:{{ ai_stack.claude_monitor_backend.port }}/ws"
    restart_policy: "unless-stopped"
  when:
    - ai_stack.enabled | default(true)
    - ai_stack.claude_monitor_frontend.enabled | default(true)
    - claude_monitor_frontend_source.stat.exists | default(false)
  tags: ['ai-stack', 'claude-monitor']

# Display status
- name: Display AI Stack status
  debug:
    msg:
      - "============================================"
      - "AI Stack deployed successfully!"
      - "============================================"
      - ""
      - "Services (SSH Tunnel Required):"
      - "  n8n-claude: http://localhost:{{ ai_stack.n8n_claude.port }}"
      - "  OpenWebUI: http://localhost:{{ ai_stack.openwebui.port }}"
      - "  LiteLLM: http://localhost:{{ ai_stack.litellm.port }}"
      - "  Fabric API: http://localhost:{{ ai_stack.fabric_api.port }}"
      - "  Kokoro TTS: http://localhost:{{ ai_stack.kokoro_tts.port }}"
      - "  Claude Monitor: http://localhost:{{ ai_stack.claude_monitor_frontend.port }}"
      - ""
      - "SSH Tunnel Command:"
      - "  ssh -L {{ ai_stack.n8n_claude.port }}:127.0.0.1:{{ ai_stack.n8n_claude.port }} -L {{ ai_stack.openwebui.port }}:127.0.0.1:{{ ai_stack.openwebui.port }} -L {{ ai_stack.litellm.port }}:127.0.0.1:{{ ai_stack.litellm.port }} root@{{ ansible_host }}"
      - "============================================"
  when: ai_stack.enabled | default(true)
  tags: ['ai-stack']
