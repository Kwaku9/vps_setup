---
# AI Stack Role Defaults
# OpenWebUI + LiteLLM + Fabric

ai_stack:
  enabled: true
  pod_name: "ai-stack-pod"
  network: "enterprise_network"
  data_dir: "/opt/podman-data/ai-stack"
  compose_dir: "/workspace/vscode-projects"

  # OpenWebUI
  openwebui:
    enabled: true
    name: "open-webui"
    image: "ghcr.io/open-webui/open-webui:latest"
    port: 3100
    internal_port: 8080
    env:
      WEBUI_AUTH: "True"
      OLLAMA_BASE_URL: "http://127.0.0.1:11434"
    branding:
      logo_url: "https://{{ s3_assets_bucket }}.s3.amazonaws.com/logo4.png"
      assets_base_url: "https://{{ s3_assets_bucket }}.s3.amazonaws.com"

  # LiteLLM Proxy
  litellm:
    enabled: true
    name: "litellm"
    # PINNED BY DIGEST 2026-08-11. Was `:main-latest`, a FLOATING tag: an unrelated
    # `--tags context-api` deploy recreated this container, pulled a newer LiteLLM whose
    # Prisma schema had drifted from the DB, and it crash-looped -- taking the public
    # buildfol.io chat widget down with `Upstream error 500`. A digest is immutable, so a
    # recreate can never silently change versions. To upgrade: change this digest
    # deliberately, then watch RestartCount stay flat (a crash-loop reports status=running).
    image: "ghcr.io/berriai/litellm-database@sha256:b6f3888c75e09ba23e89387d3e1e03c29ba748fa1fc078e0decb91d1dd08d8b1"
    port: 4000
    config_file: "config.yml"
    env:
      STORE_MODEL_IN_DB: "True"

  # Fabric API
  fabric_api:
    enabled: false
    name: "fabric-api"
    source_path: "fabric"
    image: "fabric-api:latest"
    port: 8088  # Changed from 8081 to avoid nginx conflict
    internal_port: 8080
    build: true

  # Azure LiteLLM ACA — private model inference gateway
  # Set azure_litellm_url in vault after Terraform deploy:
  #   terraform output litellm_azure_url
  azure:
    enabled: false  # Set to true after Azure deployment
    litellm_url: ""  # e.g., https://aiorch-litellm.happyocean-abc123.eastus2.azurecontainerapps.io

  # Kokoro TTS
  kokoro_tts:
    enabled: true
    name: "kokoro-tts"
    image: "ghcr.io/remsky/kokoro-fastapi-cpu:latest"
    port: 8880

  # EmbeddingGemma served via llama.cpp for OWUI RAG (routed through LiteLLM).
  # Own pod (pods-first / k8s migration). MEAN pooling is mandatory for EmbeddingGemma.
  llama_embed:
    enabled: true
    pod_name: "llama-embed-pod"
    container_name: "llama-embed"
    image: "ghcr.io/ggml-org/llama.cpp:server"
    port: 8090                      # internal listen port (cross-pod via pod DNS)
    # Primary embedder is the Fedora laptop GPU (llama.cpp CUDA, SAME GGUF) over the
    # tailnet; this VPS CPU pod is the LiteLLM FALLBACK for when the laptop is asleep/
    # off-tailnet. Fedora service: tools/fedora-gpu-embed/ (Quadlet llama-embed-gpu).
    # NOTE 2026-08-14: was 100.123.173.86, which is STALE - the laptop's tailnet
    # address is now 100.79.60.27 (`tailscale ip -4`). The live LiteLLM config on
    # the box had been corrected by hand, so a redeploy from this default would
    # have silently pointed the PRIMARY embedder at a dead IP and pushed every
    # request onto this CPU fallback. If the laptop's tailnet IP changes, this and
    # the Fedora quadlet's PublishPort must move together.
    gpu_tailnet_url: "http://100.79.60.27:18090/v1"     # Fedora GPU (primary) over tailnet
    data_dir: "/opt/podman-data/llama-embed"
    model_file: "embeddinggemma-300M-Q8_0.gguf"
    model_url: "https://huggingface.co/ggml-org/embeddinggemma-300M-GGUF/resolve/main/embeddinggemma-300M-Q8_0.gguf"
    ctx_size: 2048                  # EmbeddingGemma max context
    # ubatch was previously pinned to ctx_size (2048). The model file is 318 MB but
    # the process held ~1.2 GB, because the compute buffer scales with ubatch - it
    # was provisioned for bulk throughput while actually serving occasional
    # interactive queries (last observed request: 182 tokens). 512 keeps ample
    # headroom for real requests at a fraction of the allocation. Bulk embedding
    # runs on the laptop GPU, never here.
    ubatch_size: 512
    memory: "2g"                    # a CEILING, not an allocation - costs nothing idle

  # SearxNG (AI search)
  searxng:
    enabled: false
    name: "searxng"
    image: "docker.io/searxng/searxng:latest"
    port: 8889
    internal_port: 8888  # Avoid 8080 conflict with OpenWebUI in same pod

  # PostgreSQL for AI Stack (separate from main postgres)
  postgres:
    enabled: true
    name: "ai-stack-postgres"
    image: "docker.io/library/postgres:16-alpine"
    port: 5433  # Different port to avoid conflict with main postgres
    databases:
      - litellm
    user: "aistack"

# ── Open WebUI model reconciler ──────────────────────────────────────────────
# Replaces the old delete-then-create model registration loop.
#
# mode:
#   audit  - read only. Reports creates/updates/conflicts and prints a paste-ready
#            adoption list. Writes nothing. Safe to run any time.
#   apply  - performs creates and updates. Never deletes; pruning is a separate
#            change gated on its own flag.
owui_reconcile_mode: audit

# Ownership marker written to meta.managed_by. The reconciler refuses to touch any
# row that does not carry it, unless the id is on owui_adoption_list below.
owui_managed_by_marker: "ansible-model-tiers"

# One-time list of unmarked legacy ids this deploy is allowed to claim and stamp.
# Populate from an audit run, review each entry, then empty it again once every
# managed row carries the marker. Leaving ids here permanently defeats the guard.
owui_adoption_list: []

# Knowledge-base reindex. OFF by default and deliberately opt-in.
#
# The reindex deletes every KB's vector collection and re-embeds every file, with
# embedding served by the workstation GPU over the tailnet. It previously had no
# guard and ran on every openwebui-setup deploy. Enable only when the embedding
# model actually changed, and only with the embedder confirmed reachable:
#
#   ansible-playbook ... --tags reindex -e owui_reindex_enabled=true
owui_reindex_enabled: false

# Blind re-registration of the five image-only models into LiteLLM's DB. OFF: the
# rows already exist 38 times over (190 total). Phase 3 moves them into generated
# config and removes the task entirely.
owui_register_image_models: false
