---
# AI Stack Role Defaults
# n8n-claude + OpenWebUI + LiteLLM + Fabric

ai_stack:
  enabled: true
  pod_name: "ai-stack-pod"
  network: "enterprise_network"
  data_dir: "/opt/podman-data/ai-stack"
  compose_dir: "/workspace/vscode-projects"

  # n8n with Claude Code CLI
  n8n_claude:
    enabled: false
    name: "n8n-claude"
    source_path: "n8n/n8n-claude"
    image: "n8n-claude:latest"
    port: 5678
    build: true
    env:
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_HOST: "127.0.0.1"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: "n8n"
      DB_POSTGRESDB_USER: "aistack"
      N8N_PROTOCOL: "http"
      N8N_HOST: "localhost"
      N8N_PORT: "5678"
      NODE_ENV: "production"
      WEBHOOK_URL: "http://localhost:5678/"
      CLAUDE_TELEMETRY: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: "child_process"
      N8N_RUNNERS_HEARTBEAT_INTERVAL: "60"

  # OpenWebUI
  openwebui:
    enabled: true
    name: "open-webui"
    image: "ghcr.io/open-webui/open-webui:latest"
    port: 3100
    internal_port: 8080
    env:
      WEBUI_AUTH: "True"
    branding:
      logo_url: "https://{{ s3_assets_bucket }}.s3.amazonaws.com/logo4.png"
      assets_base_url: "https://{{ s3_assets_bucket }}.s3.amazonaws.com"
    # Shared pgvector RAG substrate — OFF by default (env keys are omitted, so OWUI
    # behaves exactly as today). Enable ONLY after the dump/restore + preflight per
    # docs/pgvector-owui-changeset.md. Changing embedding_model/vector_dim later
    # means re-embedding everything — decide once.
    rag:
      enabled: false
      vector_db: "pgvector"
      embedding_engine: "openai"          # OpenAI-compatible engine = LiteLLM proxy
      embedding_model: "embeddinggemma"   # EmbeddingGemma-300M, 768-dim, local via llama.cpp
      embedding_base_url: "http://127.0.0.1:4000/v1"   # LiteLLM (pod loopback)
      vector_dim: 768                     # MUST match the embedding model's output dim

  # LiteLLM Proxy
  litellm:
    enabled: true
    name: "litellm"
    image: "ghcr.io/berriai/litellm-database:main-latest"
    port: 4000
    config_file: "config.yml"
    env:
      STORE_MODEL_IN_DB: "True"

  # llama.cpp embedding server (EmbeddingGemma-300M) — local embeddings, replaces Ollama.
  # Tested: serves OpenAI /v1/embeddings, 768-dim, mean pooling. LiteLLM fronts it.
  llama_embeddings:
    enabled: true
    name: "llama-embeddings"
    image: "ghcr.io/ggml-org/llama.cpp:server"
    port: 8081
    model_hf: "ggml-org/embeddinggemma-300M-GGUF:Q8_0"   # tiny model — Q8 keeps quality
    pooling: "mean"                                       # EmbeddingGemma requires mean pooling

  # Fabric API
  fabric_api:
    enabled: false
    name: "fabric-api"
    source_path: "fabric"
    image: "fabric-api:latest"
    port: 8088  # Changed from 8081 to avoid nginx conflict
    internal_port: 8080
    build: true

  # Azure LiteLLM ACA — private model inference gateway
  # Set azure_litellm_url in vault after Terraform deploy:
  #   terraform output litellm_azure_url
  azure:
    enabled: false  # Set to true after Azure deployment
    litellm_url: ""  # e.g., https://aiorch-litellm.happyocean-abc123.eastus2.azurecontainerapps.io

  # Kokoro TTS
  kokoro_tts:
    enabled: true
    name: "kokoro-tts"
    image: "ghcr.io/remsky/kokoro-fastapi-cpu:latest"
    port: 8880

  # Claude Monitor Backend
  claude_monitor_backend:
    enabled: true
    name: "claude-monitor-backend"
    source_path: "n8n/n8n-claude/claude-monitor/backend"
    image: "claude-monitor-backend:latest"
    port: 3150
    build: true
    env:
      HOST: "0.0.0.0"
      PORT: "3150"
      EVENT_LOG_PATH: "/app/storage/events.jsonl"
      LOG_LEVEL: "info"

  # Claude Monitor Frontend
  claude_monitor_frontend:
    enabled: true
    name: "claude-monitor-frontend"
    source_path: "n8n/n8n-claude/claude-monitor/frontend"
    image: "claude-monitor-frontend:latest"
    port: 3151
    internal_port: 80
    build: true

  # SearxNG (AI search)
  searxng:
    enabled: false
    name: "searxng"
    image: "docker.io/searxng/searxng:latest"
    port: 8889
    internal_port: 8888  # Avoid 8080 conflict with OpenWebUI in same pod

  # PostgreSQL for AI Stack (separate from main postgres)
  postgres:
    enabled: true
    name: "ai-stack-postgres"
    # pgvector: flip true ONLY during the dump/restore migration runbook (the Alpine→Debian
    # image swap). Default false keeps postgres:16-alpine — a normal deploy will NOT swap the
    # image in place (which would risk text-index collation). See docs/pgvector-owui-changeset.md.
    pgvector: false
    image: "{{ 'docker.io/pgvector/pgvector:pg16' if (ai_stack.postgres.pgvector | default(false)) else 'docker.io/library/postgres:16-alpine' }}"
    port: 5433  # Different port to avoid conflict with main postgres
    databases:
      - litellm
      - n8n
      - memory  # vector substrate DB (created idempotently by tasks/pgvector.yml when rag.enabled)
    user: "aistack"
