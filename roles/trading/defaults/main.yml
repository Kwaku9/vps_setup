---
# ATLAS Trading Role Defaults

trading:
  enabled: true

  # Backtrader container.
  # On-demand: OFF by default so a normal deploy neither builds nor stores the image.
  # Build/deploy when ready:  ansible-playbook site.yml --tags backtrader -e build_backtrader=true
  backtrader:
    enabled: false
    image: "backtrader-atlas:latest"
    strategies_dir: "/opt/compose/backtrader-strategies"
    results_dir: "/opt/compose/backtrader-results"

  # Lightweight Charts frontend.
  # On-demand: OFF by default (see backtrader). Build/deploy when ready:
  #   ansible-playbook site.yml --tags trading-charts -e build_charts=true
  charts:
    enabled: false
    image: "atlas-charts:latest"
    container_name: "atlas-charts"
    port: 3080

  # Data ingestion
  ingestion:
    # IBKR OHLC cron (requires active IBeam session)
    ibkr:
      enabled: true
      symbols: "SPY,QQQ,IWM"
      timeframes: "1d,1h,4h"
      # Mon-Fri after market close
      schedule: "0 17 * * 1-5"
      timezone: "America/New_York"

    # MT5 import directory
    mt5:
      import_dir: "/opt/compose/mt5-imports"

  # PostgreSQL backtest schema
  schema:
    enabled: true
