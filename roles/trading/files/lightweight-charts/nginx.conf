server {
    listen 3080;
    root /usr/share/nginx/html;
    index index.html;

    # Podman Netavark DNS — deferred resolution prevents startup crash
    resolver REDACTED_DNS valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ohlc {
        set $vm_upstream http://monitoring-pod:8428;
        proxy_pass $vm_upstream/api/v1/query_range$is_args$args;
        proxy_set_header Host $host;
    }

    location /api/vm/ {
        set $vm_upstream http://monitoring-pod:8428;
        rewrite ^/api/vm/(.*) /$1 break;
        proxy_pass $vm_upstream;
        proxy_set_header Host $host;
    }
}
