  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
  tags: ['authentication', 'sso-setup', 'mfa']

# --- 5.5f: Bind admin TOTP validation stage to authentication flow (order 30) ---

- name: "[MFA] Check if admin TOTP flow binding exists"
  uri:
    url: "{{ authentik_url }}/api/v3/flows/bindings/?target={{ sso_authentication_flow_pk }}&stage={{ mfa_admin_validate_pk }}"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: mfa_admin_binding_check
  check_mode: no
  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
    - mfa_admin_validate_pk | default('') | length > 0
    - sso_authentication_flow_pk is defined
  tags: ['authentication', 'sso-setup', 'mfa']

- name: "[MFA] Bind admin TOTP validation to authentication flow"
  uri:
    url: "{{ authentik_url }}/api/v3/flows/bindings/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      target: "{{ sso_authentication_flow_pk }}"
      stage: "{{ mfa_admin_validate_pk }}"
      order: 30
      re_evaluate_policies: true
    status_code: [200, 201]
  register: mfa_admin_binding_created
  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
    - mfa_admin_validate_pk | default('') | length > 0
    - sso_authentication_flow_pk is defined
    - mfa_admin_binding_check.json.results | length == 0
  tags: ['authentication', 'sso-setup', 'mfa']

- name: "[MFA] Set admin flow binding PK"
  set_fact:
    mfa_admin_flow_binding_pk: >-
      {{ (mfa_admin_binding_check.json.results | length > 0)
         | ternary(mfa_admin_binding_check.json.results[0].policybindingmodel_ptr_id,
                   mfa_admin_binding_created.json.policybindingmodel_ptr_id | default('')) }}
  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
  tags: ['authentication', 'sso-setup', 'mfa']

# --- Bind admin policy to the admin flow stage binding ---
# Note: /api/v3/policies/bindings/?target=<uuid> rejects FlowStageBinding PKs (400),
# so we skip the pre-check and make the POST idempotent by accepting 400 (already exists).

- name: "[MFA] Bind admin policy to admin flow stage binding"
  uri:
    url: "{{ authentik_url }}/api/v3/policies/bindings/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      target: "{{ mfa_admin_flow_binding_pk }}"
      policy: "{{ mfa_admin_policy_pk }}"
      order: 0
      enabled: true
      negate: false
      timeout: 30
    status_code: [200, 201, 400]
  register: mfa_admin_policy_binding_result
  changed_when: mfa_admin_policy_binding_result.status in [200, 201]
  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
    - mfa_admin_flow_binding_pk | default('') | length > 0
    - mfa_admin_policy_pk | default('') | length > 0
  tags: ['authentication', 'sso-setup', 'mfa']

# --- 5.5g: Bind user TOTP validation stage to authentication flow (order 31) ---

- name: "[MFA] Check if user TOTP flow binding exists"
  uri:
    url: "{{ authentik_url }}/api/v3/flows/bindings/?target={{ sso_authentication_flow_pk }}&stage={{ mfa_user_validate_pk }}"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: mfa_user_binding_check
  check_mode: no
  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
    - mfa_user_validate_pk | default('') | length > 0
    - sso_authentication_flow_pk is defined
  tags: ['authentication', 'sso-setup', 'mfa']

- name: "[MFA] Bind user TOTP validation to authentication flow"
  uri:
    url: "{{ authentik_url }}/api/v3/flows/bindings/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      target: "{{ sso_authentication_flow_pk }}"
      stage: "{{ mfa_user_validate_pk }}"
      order: 31
      re_evaluate_policies: true
    status_code: [200, 201]
  register: mfa_user_binding_created
  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
    - mfa_user_validate_pk | default('') | length > 0
    - sso_authentication_flow_pk is defined
    - mfa_user_binding_check.json.results | length == 0
  tags: ['authentication', 'sso-setup', 'mfa']

- name: "[MFA] Set user flow binding PK"
  set_fact:
    mfa_user_flow_binding_pk: >-
      {{ (mfa_user_binding_check.json.results | length > 0)
         | ternary(mfa_user_binding_check.json.results[0].policybindingmodel_ptr_id,
                   mfa_user_binding_created.json.policybindingmodel_ptr_id | default('')) }}
  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
  tags: ['authentication', 'sso-setup', 'mfa']

# --- Bind non-admin policy to the user flow stage binding ---
# Same pattern: POST is idempotent, 400 = already exists.

- name: "[MFA] Bind non-admin policy to user flow stage binding"
  uri:
    url: "{{ authentik_url }}/api/v3/policies/bindings/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      target: "{{ mfa_user_flow_binding_pk }}"
      policy: "{{ mfa_nonadmin_policy_pk }}"
      order: 0
      enabled: true
      negate: false
      timeout: 30
    status_code: [200, 201, 400]
  register: mfa_nonadmin_policy_binding_result
  changed_when: mfa_nonadmin_policy_binding_result.status in [200, 201]
  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
    - mfa_user_flow_binding_pk | default('') | length > 0
    - mfa_nonadmin_policy_pk | default('') | length > 0
  tags: ['authentication', 'sso-setup', 'mfa']

# ============================================================
# Step 5.6: Password Recovery Flow (self-service password reset)
# ============================================================
# Sends a password reset link via email (uses global SMTP settings).
# Flow stages: identification → email → password prompt → user write → user login

# --- 5.6a: Check if recovery flow already exists ---

- name: "[Recovery] Check if recovery flow exists"
  uri:
    url: "{{ authentik_url }}/api/v3/flows/instances/?slug=password-recovery"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: recovery_flow_check
  check_mode: no
  when: sso_config.recovery.enabled | default(false)
  tags: ['authentication', 'sso-setup']

# --- 5.6b: Identification stage (user enters email/username) ---

- name: "[Recovery] Check if identification stage exists"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/identification/?name=recovery-identification"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: recovery_ident_check
  check_mode: no
  when:
    - sso_config.recovery.enabled | default(false)
    - recovery_flow_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Create identification stage"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/identification/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "recovery-identification"
      user_fields:
        - "email"
        - "username"
      show_matched_user: true
    status_code: [200, 201]
  register: recovery_ident_created
  when:
    - sso_config.recovery.enabled | default(false)
    - recovery_flow_check.json.results | length == 0
    - recovery_ident_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Set identification stage PK"
  set_fact:
    recovery_ident_pk: >-
      {{ (recovery_ident_check is defined and recovery_ident_check is not skipped and recovery_ident_check.json.results | length > 0)
         | ternary(recovery_ident_check.json.results[0].pk | default(''),
                   recovery_ident_created.json.pk | default('')) }}
  when: sso_config.recovery.enabled | default(false)
  tags: ['authentication', 'sso-setup']

# --- 5.6c: Email stage (sends password reset link) ---

- name: "[Recovery] Check if email stage exists"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/email/?name=recovery-email"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: recovery_email_check
  check_mode: no
  when:
    - sso_config.recovery.enabled | default(false)
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Create email stage"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/email/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "recovery-email"
      use_global_settings: false
      host: "{{ authentik_smtp_host }}"
      port: "{{ authentik_smtp_port | default(587) }}"
      username: "{{ authentik_smtp_username }}"
      password: "{{ authentik_smtp_password }}"
      use_tls: true
      use_ssl: false
      timeout: 30
      from_address: "{{ authentik_smtp_from }}"
      activate_user_on_success: true
      token_expiry: "minutes={{ sso_config.recovery.token_expiry | default(30) }}"
      subject: "Reset your password"
      template: "email/password_reset.html"
    status_code: [200, 201]
  register: recovery_email_created
  when:
    - sso_config.recovery.enabled | default(false)
    - recovery_email_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Ensure email stage SMTP config"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/email/{{ recovery_email_check.json.results[0].pk }}/"
    method: PATCH
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      use_global_settings: false
      host: "{{ authentik_smtp_host }}"
      port: "{{ authentik_smtp_port | default(587) }}"
      username: "{{ authentik_smtp_username }}"
      password: "{{ authentik_smtp_password }}"
      use_tls: true
      use_ssl: false
      timeout: 30
      from_address: "{{ authentik_smtp_from }}"
      subject: "Reset your password"
    status_code: [200]
  when:
    - sso_config.recovery.enabled | default(false)
    - recovery_email_check.json.results | length > 0
  changed_when: true
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Set email stage PK"
  set_fact:
    recovery_email_pk: >-
      {{ (recovery_email_check is defined and recovery_email_check is not skipped and recovery_email_check.json.results | length > 0)
         | ternary(recovery_email_check.json.results[0].pk | default(''),
                   recovery_email_created.json.pk | default('')) }}
  when: sso_config.recovery.enabled | default(false)
  tags: ['authentication', 'sso-setup']

# --- 5.6d: Password prompt stage (new password + confirm) ---

- name: "[Recovery] Get prompt field definitions"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/prompt/prompts/"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: recovery_prompt_fields
  check_mode: no
  when:
    - sso_config.recovery.enabled | default(false)
    - recovery_flow_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Extract password field PKs"
  set_fact:
    recovery_password_field_pks: >-
      {{ recovery_prompt_fields.json.results
         | selectattr('field_key', 'in', ['password', 'password_repeat'])
         | map(attribute='pk') | list }}
  when:
    - recovery_prompt_fields is defined
    - recovery_prompt_fields is not skipped
    - recovery_prompt_fields.json is defined
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Check if prompt stage exists"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/prompt/stages/?name=recovery-password-prompt"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: recovery_prompt_check
  check_mode: no
  when:
    - sso_config.recovery.enabled | default(false)
    - recovery_flow_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Create password prompt stage"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/prompt/stages/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "recovery-password-prompt"
      fields: "{{ recovery_password_field_pks | default([]) }}"
      validation_policies: []
    status_code: [200, 201]
  register: recovery_prompt_created
  when:
    - sso_config.recovery.enabled | default(false)
    - recovery_flow_check.json.results | length == 0
    - recovery_prompt_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Set prompt stage PK"
  set_fact:
    recovery_prompt_pk: >-
      {{ (recovery_prompt_check is defined and recovery_prompt_check is not skipped and recovery_prompt_check.json.results | length > 0)
         | ternary(recovery_prompt_check.json.results[0].pk | default(''),
                   recovery_prompt_created.json.pk | default('')) }}
  when: sso_config.recovery.enabled | default(false)
  tags: ['authentication', 'sso-setup']

# --- 5.6e: User-write stage (writes new password, never creates user) ---

- name: "[Recovery] Check if user-write stage exists"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/user_write/?name=recovery-user-write"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: recovery_write_check
  check_mode: no
  when:
    - sso_config.recovery.enabled | default(false)
    - recovery_flow_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Create user-write stage"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/user_write/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "recovery-user-write"
      create_users_as_inactive: false
      user_creation_mode: "never_create"
    status_code: [200, 201]
  register: recovery_write_created
  when:
    - sso_config.recovery.enabled | default(false)
    - recovery_flow_check.json.results | length == 0
    - recovery_write_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Set user-write stage PK"
  set_fact:
    recovery_write_pk: >-
      {{ (recovery_write_check is defined and recovery_write_check is not skipped and recovery_write_check.json.results | length > 0)
         | ternary(recovery_write_check.json.results[0].pk | default(''),
                   recovery_write_created.json.pk | default('')) }}
  when: sso_config.recovery.enabled | default(false)
  tags: ['authentication', 'sso-setup']

# --- 5.6f: User-login stage (auto-login after password reset) ---

- name: "[Recovery] Check if user-login stage exists"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/user_login/?name=recovery-user-login"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: recovery_login_check
  check_mode: no
  when:
    - sso_config.recovery.enabled | default(false)
    - recovery_flow_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Create user-login stage"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/user_login/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "recovery-user-login"
      session_duration: "seconds=0"
    status_code: [200, 201]
  register: recovery_login_created
  when:
    - sso_config.recovery.enabled | default(false)
    - recovery_flow_check.json.results | length == 0
    - recovery_login_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Set user-login stage PK"
  set_fact:
    recovery_login_pk: >-
      {{ (recovery_login_check is defined and recovery_login_check is not skipped and recovery_login_check.json.results | length > 0)
         | ternary(recovery_login_check.json.results[0].pk | default(''),
                   recovery_login_created.json.pk | default('')) }}
  when: sso_config.recovery.enabled | default(false)
  tags: ['authentication', 'sso-setup']

# --- 5.6g: Create recovery flow + bind stages ---

- name: "[Recovery] Create recovery flow"
  uri:
    url: "{{ authentik_url }}/api/v3/flows/instances/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "Password Recovery"
      slug: "password-recovery"
      title: "Reset Your Password"
      designation: "recovery"
      authentication: "none"
    status_code: [200, 201]
  register: recovery_flow_created
  when:
    - sso_config.recovery.enabled | default(false)
    - recovery_flow_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Set recovery flow PK"
  set_fact:
    recovery_flow_pk: >-
      {{ (recovery_flow_check is defined and recovery_flow_check is not skipped and recovery_flow_check.json.results | length > 0)
         | ternary(recovery_flow_check.json.results[0].pk | default(''),
                   recovery_flow_created.json.pk | default('')) }}
  when: sso_config.recovery.enabled | default(false)
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Build stage binding list"
  set_fact:
    recovery_stages:
      - { stage: "{{ recovery_ident_pk }}", order: 10 }
      - { stage: "{{ recovery_email_pk }}", order: 20 }
      - { stage: "{{ recovery_prompt_pk }}", order: 30 }
      - { stage: "{{ recovery_write_pk }}", order: 40 }
      - { stage: "{{ recovery_login_pk }}", order: 50 }
  when:
    - sso_config.recovery.enabled | default(false)
    - recovery_flow_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Bind stages to recovery flow"
  uri:
    url: "{{ authentik_url }}/api/v3/flows/bindings/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      target: "{{ recovery_flow_pk }}"
      stage: "{{ item.stage }}"
      order: "{{ item.order }}"
    status_code: [200, 201]
  loop: "{{ recovery_stages }}"
  loop_control:
    label: "stage order {{ item.order }}"
  when:
    - sso_config.recovery.enabled | default(false)
    - recovery_flow_check.json.results | length == 0
    - item.stage | default('') | length > 0
  tags: ['authentication', 'sso-setup']

# --- 5.6h: Link recovery flow to the default brand ---

- name: "[Recovery] Get default brand"
  uri:
    url: "{{ authentik_url }}/api/v3/core/brands/"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: recovery_brands
  check_mode: no
  when:
    - sso_config.recovery.enabled | default(false)
    - recovery_flow_pk | default('') | length > 0
  tags: ['authentication', 'sso-setup']

- name: "[Recovery] Link recovery flow to default brand"
  uri:
    url: "{{ authentik_url }}/api/v3/core/brands/{{ recovery_brands.json.results[0].brand_uuid }}/"
    method: PATCH
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      flow_recovery: "{{ recovery_flow_pk }}"
    status_code: 200
  when:
    - sso_config.recovery.enabled | default(false)
    - recovery_flow_pk | default('') | length > 0
    - recovery_brands.json.results | length > 0
  tags: ['authentication', 'sso-setup']

# ============================================================
# Step 6: Create OAuth2/OIDC providers for each service
# ============================================================

- name: "[SSO] Check existing OIDC providers"
  uri:
    url: "{{ authentik_url }}/api/v3/providers/oauth2/?name=sso-{{ item.name }}"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_oidc_provider_checks
  loop: "{{ sso_config.oidc_services }}"
  loop_control:
    label: "{{ item.name }}"
  check_mode: no
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Create OIDC providers"
  uri:
    url: "{{ authentik_url }}/api/v3/providers/oauth2/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "sso-{{ item.item.name }}"
      authorization_flow: "{{ sso_authorization_flow_pk }}"
      invalidation_flow: "{{ sso_invalidation_flow_pk }}"
      client_type: "confidential"
      redirect_uris:
        - url: "{{ item.item.redirect_uri }}"
          matching_mode: "strict"
      signing_key: "{{ sso_signing_key_pk }}"
      property_mappings: "{{ sso_all_scopes }}"
      sub_mode: "hashed_user_id"
      include_claims_in_id_token: true
      issuer_mode: "per_provider"
    status_code: [200, 201]
  register: sso_oidc_providers_created
  loop: "{{ sso_oidc_provider_checks.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.json.results | length == 0
  tags: ['authentication', 'sso-setup']

# --- Register OIDC client_id/client_secret as facts ---

- name: "[SSO] Set OIDC facts for newly created providers"
  set_fact:
    "{{ item.item.item.name }}_oidc_client_id": "{{ item.json.client_id }}"
    "{{ item.item.item.name }}_oidc_client_secret": "{{ item.json.client_secret }}"
  loop: "{{ sso_oidc_providers_created.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.name | default('skipped') }}"
  when:
    - item is not skipped
    - item.json is defined
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Set OIDC facts for existing providers"
  set_fact:
    "{{ item.item.name }}_oidc_client_id": "{{ item.json.results[0].client_id }}"
    "{{ item.item.name }}_oidc_client_secret": "{{ item.json.results[0].client_secret }}"
  loop: "{{ sso_oidc_provider_checks.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.json.results | length > 0
  tags: ['authentication', 'sso-setup']

# ============================================================
# Step 7: Create applications for each OIDC provider
# ============================================================

- name: "[SSO] Check existing applications"
  uri:
    url: "{{ authentik_url }}/api/v3/core/applications/?slug={{ item.slug }}"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_app_checks
  loop: "{{ sso_config.oidc_services }}"
  loop_control:
    label: "{{ item.name }}"
  check_mode: no
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Get provider PKs for application creation"
  uri:
    url: "{{ authentik_url }}/api/v3/providers/oauth2/?name=sso-{{ item.item.name }}"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_provider_pks
  loop: "{{ sso_app_checks.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.json.pagination.count == 0
  check_mode: no
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Create applications"
  uri:
    url: "{{ authentik_url }}/api/v3/core/applications/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ item.item.item.name | title }}"
      slug: "{{ item.item.item.slug }}"
      provider: "{{ item.json.results[0].pk }}"
      meta_launch_url: "https://{{ item.item.item.slug }}.{{ domain_name }}"
      policy_engine_mode: "any"
    status_code: [200, 201]
  loop: "{{ sso_provider_pks.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.name | default('skipped') }}"
  when:
    - item is not skipped
    - item.json is defined
    - item.json.results | length > 0
  tags: ['authentication', 'sso-setup']

# ============================================================
# Step 8: Create bookmark applications (non-OIDC admin services)
# ============================================================

- name: "[SSO] Check existing bookmark applications"
  uri:
    url: "{{ authentik_url }}/api/v3/core/applications/?slug={{ item.slug }}"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_bookmark_app_checks
  loop: "{{ sso_config.bookmark_services | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  check_mode: no
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Create bookmark applications"
  uri:
    url: "{{ authentik_url }}/api/v3/core/applications/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ item.item.name | title }}"
      slug: "{{ item.item.slug }}"
      meta_launch_url: "{{ item.item.launch_url }}"
      policy_engine_mode: "any"
    status_code: [200, 201]
  loop: "{{ sso_bookmark_app_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('skipped') }}"
  when:
    - item.json is defined
    - item.json.pagination.count == 0
  tags: ['authentication', 'sso-setup']

# ============================================================
# Step 9: Create group policy bindings (restrict admin services)
# ============================================================

- name: "[SSO] Build list of admin-restricted services"
  set_fact:
    sso_admin_restricted_services: >-
      {{ (sso_config.oidc_services | selectattr('access_group', 'defined')
          | selectattr('access_group', 'equalto', 'admin') | list)
         + (sso_config.bookmark_services | default([])
            | selectattr('access_group', 'defined')
            | selectattr('access_group', 'equalto', 'admin') | list) }}
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Look up admins group PK"
  uri:
    url: "{{ authentik_url }}/api/v3/core/groups/?search={{ sso_config.groups.admin | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_admins_group_lookup
  check_mode: no
  when: sso_admin_restricted_services | length > 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Set admins group PK"
  set_fact:
    sso_admins_group_pk: "{{ sso_admins_group_lookup.json.results[0].pk }}"
  when:
    - sso_admins_group_lookup is not skipped
    - sso_admins_group_lookup.json.results | length > 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Look up application PKs for binding"
  uri:
    url: "{{ authentik_url }}/api/v3/core/applications/?slug={{ item.slug }}"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_binding_app_lookups
  loop: "{{ sso_admin_restricted_services }}"
  loop_control:
    label: "{{ item.name }}"
  check_mode: no
  when: sso_admins_group_pk is defined
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Check existing policy bindings"
  uri:
    url: "{{ authentik_url }}/api/v3/policies/bindings/?target={{ item.json.results[0].pk }}"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_existing_bindings
  loop: "{{ sso_binding_app_lookups.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('skipped') }}"
  when:
    - item is not skipped
    - item.json is defined
    - item.json.results | length > 0
  check_mode: no
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Create group policy bindings for admin services"
  uri:
    url: "{{ authentik_url }}/api/v3/policies/bindings/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      target: "{{ item.item.json.results[0].pk }}"
      group: "{{ sso_admins_group_pk }}"
      order: 0
      enabled: true
      negate: false
      timeout: 30
    status_code: [200, 201]
  loop: "{{ sso_existing_bindings.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.name | default('skipped') }}"
  when:
    - item is not skipped
    - item.json is defined
    - item.json.results | selectattr('group', 'equalto', sso_admins_group_pk) | list | length == 0
  failed_when: false
  tags: ['authentication', 'sso-setup']

# ============================================================
# Step 10: Display SSO summary (native OIDC - no outpost)
# ============================================================

- name: "[SSO] Display SSO setup summary"
  debug:
    msg:
      - "============================================"
      - "Authentik SSO Setup Complete (Native OIDC)"
      - "============================================"
      - ""
      - "Auth Mode: Native OIDC per service (no outpost)"
      - ""
      - "Enrollment:"
      - "  Self-service: {{ sso_config.enrollment.enabled | default(true) }}"
      - "  Email verification: {{ sso_config.enrollment.email_verification | default(true) }}"
      - "  Login page: https://{{ auth_domain }}"
      - ""
      - "OIDC Providers:"
      - "  Grafana: client_id={{ grafana_oidc_client_id | default('(not created)') }}"
      - "  OpenWebUI: client_id={{ openwebui_oidc_client_id | default('(not created)') }}"
      - "  Portainer: client_id={{ portainer_oidc_client_id | default('(not created)') }}"
      - ""
      - "Bookmark Apps: {{ sso_config.bookmark_services | default([]) | map(attribute='name') | list | join(', ') }}"
      - ""
      - "Group Policy Bindings:"
      - "  Admin-restricted: {{ sso_admin_restricted_services | default([]) | map(attribute='name') | list | join(', ') }}"
      - "  Group: {{ sso_config.groups.admin }} (PK={{ sso_admins_group_pk | default('n/a') }})"
      - ""
      - "MFA (TOTP):"
      - "  Enabled: {{ sso_config.mfa.enabled | default(false) }}"
      - "  TOTP: {{ sso_config.mfa.totp.enabled | default(false) }}"
      - "  Admin requirement: TOTP required (forced setup if missing)"
      - "  Other users: TOTP optional (prompted if configured, skipped if not)"
      - "  Admin validation stage: {{ mfa_admin_validate_pk | default('n/a') }}"
      - "  User validation stage: {{ mfa_user_validate_pk | default('n/a') }}"
      - ""
      - "Password Recovery:"
      - "  Enabled: {{ sso_config.recovery.enabled | default(false) }}"
      - "  Flow: password-recovery (PK={{ recovery_flow_pk | default('n/a') }})"
      - "  Token expiry: {{ sso_config.recovery.token_expiry | default(30) }} minutes"
      - "  Email template: email/password_reset.html"
      - ""
      - "Groups: {{ sso_config.groups.admin }}, {{ sso_config.groups.free }}, {{ sso_config.groups.paid }}"
      - "============================================"
  tags: ['authentication', 'sso-setup']
