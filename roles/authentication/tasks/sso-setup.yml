  tags: ['authentication', 'sso-setup', 'mfa']

- name: "[MFA] Set user TOTP validation stage PK"
  set_fact:
    mfa_user_validate_pk: >-
      {{ (mfa_user_validate_check.json.results | length > 0)
         | ternary(mfa_user_validate_check.json.results[0].pk,
                   mfa_user_validate_created.json.pk | default('')) }}
  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
  tags: ['authentication', 'sso-setup', 'mfa']

# --- 5.5d: Expression policy — is admin ---

- name: "[MFA] Check if admin expression policy exists"
  uri:
    url: "{{ authentik_url }}/api/v3/policies/expression/?name=mfa-policy-is-admin"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: mfa_admin_policy_check
  check_mode: no
  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
  tags: ['authentication', 'sso-setup', 'mfa']

- name: "[MFA] Create admin expression policy"
  uri:
    url: "{{ authentik_url }}/api/v3/policies/expression/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "mfa-policy-is-admin"
      expression: 'return ak_is_group_member(request.user, name="admins")'
      execution_logging: false
    status_code: [200, 201]
  register: mfa_admin_policy_created
  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
    - mfa_admin_policy_check.json.results | length == 0
  tags: ['authentication', 'sso-setup', 'mfa']

- name: "[MFA] Set admin expression policy PK"
  set_fact:
    mfa_admin_policy_pk: >-
      {{ (mfa_admin_policy_check.json.results | length > 0)
         | ternary(mfa_admin_policy_check.json.results[0].pk,
                   mfa_admin_policy_created.json.pk | default('')) }}
  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
  tags: ['authentication', 'sso-setup', 'mfa']

# --- 5.5e: Expression policy — is NOT admin ---

- name: "[MFA] Check if non-admin expression policy exists"
  uri:
