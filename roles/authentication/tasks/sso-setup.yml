    - sso_config.mfa.totp.enabled | default(false)
    - mfa_admin_validate_check.json.results | length == 0
    - mfa_totp_setup_pk | default('') | length > 0
  tags: ['authentication', 'sso-setup', 'mfa']

- name: "[MFA] Set admin TOTP validation stage PK"
  set_fact:
    mfa_admin_validate_pk: >-
      {{ (mfa_admin_validate_check.json.results | length > 0)
         | ternary(mfa_admin_validate_check.json.results[0].pk,
                   mfa_admin_validate_created.json.pk | default('')) }}
  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
  tags: ['authentication', 'sso-setup', 'mfa']

# --- 5.5c: User TOTP validation stage (optional — skip if not configured) ---

- name: "[MFA] Check if user TOTP validation stage exists"
  uri:
