    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "mfa-admin-totp-required"
      not_configured_action: "configure"
      device_classes:
        - totp
      configuration_stages:
        - "{{ mfa_totp_setup_pk }}"
    status_code: [200, 201]
  register: mfa_admin_validate_created
  when:
