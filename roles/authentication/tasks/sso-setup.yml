      {{ (mfa_totp_setup_check.json.results | length > 0)
         | ternary(mfa_totp_setup_check.json.results[0].pk,
                   mfa_totp_setup_created.json.pk | default('')) }}
  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
  tags: ['authentication', 'sso-setup', 'mfa']

# --- 5.5b: Admin TOTP validation stage (required — configure if missing) ---

