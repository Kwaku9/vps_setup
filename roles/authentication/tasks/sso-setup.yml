---
# Authentik SSO Setup: Groups, Enrollment, OIDC Providers (Native OIDC)
# Fully automated via Authentik API — zero manual UI steps
#
# Each service (Grafana, Portainer, OpenWebUI) uses native OIDC integration
# directly with Authentik. No outpost or forward-auth proxy needed.
#
# Prerequisites:
#   - Authentik deployed with bootstrap token
#   - authentication.authentik.sso.enabled: true in all.yml
#
# Produces set_fact vars consumed by downstream roles:
#   - grafana_oidc_client_id / grafana_oidc_client_secret
#   - openwebui_oidc_client_id / openwebui_oidc_client_secret
#   - portainer_oidc_client_id / portainer_oidc_client_secret

- name: Set SSO variables
  set_fact:
    authentik_token: "{{ authentik_bootstrap_token }}"
    sso_config: "{{ authentication.authentik.sso }}"
    auth_domain: "auth.{{ domain_name }}"
  tags: ['authentication', 'sso-setup']

# ============================================================
# Step 1: Wait for Authentik API
# ============================================================

- name: "[SSO] Wait for Authentik API readiness"
  uri:
    url: "{{ authentik_url }}/api/v3/core/users/me/"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
    timeout: 10
  register: sso_health
  retries: 30
  delay: 10
  until: sso_health.status == 200
  check_mode: no
  tags: ['authentication', 'sso-setup']

# ============================================================
# Step 2: Create groups
# ============================================================

- name: "[SSO] Check existing groups"
  uri:
    url: "{{ authentik_url }}/api/v3/core/groups/?search={{ item.value | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_existing_groups
  loop: "{{ sso_config.groups | dict2items }}"
  loop_control:
    label: "{{ item.value }}"
  check_mode: no
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Create groups"
  uri:
    url: "{{ authentik_url }}/api/v3/core/groups/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ item.item.value }}"
      is_superuser: "{{ item.item.key == 'admin' }}"
    status_code: [200, 201]
  loop: "{{ sso_existing_groups.results }}"
  loop_control:
    label: "{{ item.item.value }}"
  when: item.json.results | length == 0
  tags: ['authentication', 'sso-setup']

# ============================================================
# Step 3: Get default flows and signing key
# ============================================================

- name: "[SSO] Get default authorization flow"
  uri:
    url: "{{ authentik_url }}/api/v3/flows/instances/?designation=authorization"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_auth_flows
  check_mode: no
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Set authorization flow"
  set_fact:
    sso_authorization_flow_pk: "{{ sso_auth_flows.json.results[0].pk }}"
    sso_authorization_flow_slug: "{{ sso_auth_flows.json.results[0].slug }}"
  when: sso_auth_flows.json.results | length > 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Get default invalidation flow"
  uri:
    url: "{{ authentik_url }}/api/v3/flows/instances/?designation=invalidation"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_invalidation_flows
  check_mode: no
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Set invalidation flow"
  set_fact:
    sso_invalidation_flow_pk: "{{ sso_invalidation_flows.json.results[0].pk }}"
  when: sso_invalidation_flows.json.results | length > 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Get default authentication flow"
  uri:
    url: "{{ authentik_url }}/api/v3/flows/instances/?designation=authentication"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_authn_flows
  check_mode: no
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Set authentication flow"
  set_fact:
    sso_authentication_flow_pk: "{{ sso_authn_flows.json.results[0].pk }}"
    sso_authentication_flow_slug: "{{ sso_authn_flows.json.results[0].slug }}"
  when: sso_authn_flows.json.results | length > 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Get signing certificate keypair"
  uri:
    url: "{{ authentik_url }}/api/v3/crypto/certificatekeypairs/?has_key=true"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_cert_keypairs
  check_mode: no
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Set signing key"
  set_fact:
    sso_signing_key_pk: "{{ sso_cert_keypairs.json.results[0].pk }}"
  when: sso_cert_keypairs.json.results | length > 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Generate signing keypair if none exists"
  uri:
    url: "{{ authentik_url }}/api/v3/crypto/certificatekeypairs/generate/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      common_name: "authentik SSO Signing Key"
      subject_alt_name: "DNS:{{ auth_domain }}"
      validity_days: 365
    status_code: [200, 201]
  register: sso_generated_keypair
  when: sso_cert_keypairs.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Set signing key from generated keypair"
  set_fact:
    sso_signing_key_pk: "{{ sso_generated_keypair.json.pk }}"
  when:
    - sso_generated_keypair is defined
    - sso_generated_keypair is not skipped
  tags: ['authentication', 'sso-setup']

# ============================================================
# Step 4: Get default property mappings + create groups scope
# ============================================================

- name: "[SSO] Get default scope mappings"
  uri:
    url: "{{ authentik_url }}/api/v3/propertymappings/provider/scope/?ordering=scope_name"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_scope_mappings
  check_mode: no
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Extract openid/email/profile mapping PKs"
  set_fact:
    sso_default_scopes: >-
      {{ sso_scope_mappings.json.results
         | selectattr('scope_name', 'in', ['openid', 'email', 'profile'])
         | map(attribute='pk') | list }}
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Check if groups scope mapping exists"
  uri:
    url: "{{ authentik_url }}/api/v3/propertymappings/provider/scope/?scope_name=groups"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_groups_scope_check
  check_mode: no
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Create groups scope mapping"
  uri:
    url: "{{ authentik_url }}/api/v3/propertymappings/provider/scope/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "SSO Groups Scope"
      scope_name: "groups"
      description: "Returns user group memberships"
      expression: "return {\"groups\": [g.name for g in request.user.ak_groups.all()]}"
    status_code: [200, 201]
  register: sso_groups_scope_created
  when: sso_groups_scope_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Set groups scope PK"
  set_fact:
    sso_groups_scope_pk: >-
      {{ (sso_groups_scope_check.json.results | length > 0)
         | ternary(sso_groups_scope_check.json.results[0].pk,
                   sso_groups_scope_created.json.pk | default('')) }}
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Build complete scope list"
  set_fact:
    sso_all_scopes: "{{ sso_default_scopes + [sso_groups_scope_pk] }}"
  tags: ['authentication', 'sso-setup']

# ============================================================
# Step 5: Create enrollment flow (self-service registration)
# ============================================================

- name: "[SSO] Check if enrollment flow exists"
  uri:
    url: "{{ authentik_url }}/api/v3/flows/instances/?slug=self-service-enrollment"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_enrollment_flow_check
  check_mode: no
  when: sso_config.enrollment.enabled | default(true)
  tags: ['authentication', 'sso-setup']

# --- Create enrollment stages ---

- name: "[SSO] Check if prompt stage exists"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/prompt/stages/?name=enrollment-prompt"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_prompt_stage_check
  check_mode: no
  when:
    - sso_config.enrollment.enabled | default(true)
    - sso_enrollment_flow_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Get prompt field definitions"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/prompt/prompts/"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_prompt_fields
  check_mode: no
  when:
    - sso_config.enrollment.enabled | default(true)
    - sso_enrollment_flow_check.json.results | length == 0
    - sso_prompt_stage_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Extract prompt field PKs for enrollment"
  set_fact:
    sso_prompt_field_pks: >-
      {{ sso_prompt_fields.json.results
         | selectattr('field_key', 'in', ['username', 'email', 'name', 'password', 'password_repeat'])
         | map(attribute='pk') | list }}
  when:
    - sso_prompt_fields is defined
    - sso_prompt_fields is not skipped
    - sso_prompt_fields.json is defined
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Create prompt stage"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/prompt/stages/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "enrollment-prompt"
      fields: "{{ sso_prompt_field_pks | default([]) }}"
      validation_policies: []
    status_code: [200, 201]
  register: sso_prompt_stage_created
  when:
    - sso_config.enrollment.enabled | default(true)
    - sso_enrollment_flow_check.json.results | length == 0
    - sso_prompt_stage_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Set prompt stage PK"
  set_fact:
    sso_prompt_stage_pk: >-
      {{ (sso_prompt_stage_check is defined and sso_prompt_stage_check is not skipped and sso_prompt_stage_check.json.results | length > 0)
         | ternary(sso_prompt_stage_check.json.results[0].pk | default(''),
                   sso_prompt_stage_created.json.pk | default('')) }}
  when: sso_config.enrollment.enabled | default(true)
  tags: ['authentication', 'sso-setup']

# --- User write stage ---

- name: "[SSO] Check if user-write stage exists"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/user_write/?name=enrollment-user-write"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_user_write_check
  check_mode: no
  when:
    - sso_config.enrollment.enabled | default(true)
    - sso_enrollment_flow_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Get free_users group PK (default enrollment group)"
  uri:
    url: "{{ authentik_url }}/api/v3/core/groups/?search={{ sso_config.groups.free | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_users_group
  check_mode: no
  when: sso_config.enrollment.enabled | default(true)
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Create user-write stage"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/user_write/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "enrollment-user-write"
      create_users_as_inactive: "{{ sso_config.enrollment.email_verification | default(true) }}"
      create_users_group: "{{ sso_users_group.json.results[0].pk }}"
      user_creation_mode: "always_create"
      user_type: "internal"
    status_code: [200, 201]
  register: sso_user_write_created
  when:
    - sso_config.enrollment.enabled | default(true)
    - sso_enrollment_flow_check.json.results | length == 0
    - sso_user_write_check.json.results | length == 0
    - sso_users_group.json.results | length > 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Set user-write stage PK"
  set_fact:
    sso_user_write_stage_pk: >-
      {{ (sso_user_write_check is defined and sso_user_write_check is not skipped and sso_user_write_check.json.results | length > 0)
         | ternary(sso_user_write_check.json.results[0].pk | default(''),
                   sso_user_write_created.json.pk | default('')) }}
  when: sso_config.enrollment.enabled | default(true)
  tags: ['authentication', 'sso-setup']

# --- Email verification stage ---

- name: "[SSO] Check if email stage exists"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/email/?name=enrollment-email-verification"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_email_stage_check
  check_mode: no
  when:
    - sso_config.enrollment.enabled | default(true)
    - sso_config.enrollment.email_verification | default(true)
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Create email verification stage"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/email/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "enrollment-email-verification"
      use_global_settings: false
      host: "{{ authentik_smtp_host }}"
      port: "{{ authentik_smtp_port | default(587) }}"
      username: "{{ authentik_smtp_username }}"
      password: "{{ authentik_smtp_password }}"
      use_tls: true
      use_ssl: false
      timeout: 30
      from_address: "{{ authentik_smtp_from }}"
      activate_user_on_success: true
      token_expiry: "minutes=30"
      subject: "Verify your AICortex account"
      template: "email/account_confirmation.html"
    status_code: [200, 201]
  register: sso_email_stage_created
  when:
    - sso_config.enrollment.enabled | default(true)
    - sso_config.enrollment.email_verification | default(true)
    - sso_email_stage_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Ensure email stage SMTP config"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/email/{{ sso_email_stage_check.json.results[0].pk }}/"
    method: PATCH
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      use_global_settings: false
      host: "{{ authentik_smtp_host }}"
      port: "{{ authentik_smtp_port | default(587) }}"
      username: "{{ authentik_smtp_username }}"
      password: "{{ authentik_smtp_password }}"
      use_tls: true
      use_ssl: false
      timeout: 30
      from_address: "{{ authentik_smtp_from }}"
      subject: "Verify your AICortex account"
    status_code: [200]
  when:
    - sso_config.enrollment.enabled | default(true)
    - sso_config.enrollment.email_verification | default(true)
    - sso_email_stage_check.json.results | length > 0
  changed_when: true
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Set email stage PK"
  set_fact:
    sso_email_stage_pk: >-
      {{ (sso_email_stage_check is defined and sso_email_stage_check is not skipped and sso_email_stage_check.json.results | length > 0)
         | ternary(sso_email_stage_check.json.results[0].pk | default(''),
                   sso_email_stage_created.json.pk | default('')) }}
  when:
    - sso_config.enrollment.enabled | default(true)
    - sso_config.enrollment.email_verification | default(true)
  tags: ['authentication', 'sso-setup']

# --- User login stage ---

- name: "[SSO] Check if user-login stage exists"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/user_login/?name=enrollment-user-login"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: sso_login_stage_check
  check_mode: no
  when:
    - sso_config.enrollment.enabled | default(true)
    - sso_enrollment_flow_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Create user-login stage"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/user_login/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "enrollment-user-login"
      session_duration: "seconds=0"
    status_code: [200, 201]
  register: sso_login_stage_created
  when:
    - sso_config.enrollment.enabled | default(true)
    - sso_enrollment_flow_check.json.results | length == 0
    - sso_login_stage_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Set user-login stage PK"
  set_fact:
    sso_login_stage_pk: >-
      {{ (sso_login_stage_check is defined and sso_login_stage_check is not skipped and sso_login_stage_check.json.results | length > 0)
         | ternary(sso_login_stage_check.json.results[0].pk | default(''),
                   sso_login_stage_created.json.pk | default('')) }}
  when: sso_config.enrollment.enabled | default(true)
  tags: ['authentication', 'sso-setup']

# --- Create enrollment flow + bind stages ---

- name: "[SSO] Create enrollment flow"
  uri:
    url: "{{ authentik_url }}/api/v3/flows/instances/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "Self-Service Enrollment"
      slug: "self-service-enrollment"
      title: "Create an Account"
      designation: "enrollment"
      authentication: "none"
    status_code: [200, 201]
  register: sso_enrollment_flow_created
  when:
    - sso_config.enrollment.enabled | default(true)
    - sso_enrollment_flow_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Set enrollment flow PK"
  set_fact:
    sso_enrollment_flow_pk: >-
      {{ (sso_enrollment_flow_check is defined and sso_enrollment_flow_check is not skipped and sso_enrollment_flow_check.json.results | length > 0)
         | ternary(sso_enrollment_flow_check.json.results[0].pk | default(''),
                   sso_enrollment_flow_created.json.pk | default('')) }}
    sso_enrollment_flow_slug: "self-service-enrollment"
  when: sso_config.enrollment.enabled | default(true)
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Build stage binding list"
  set_fact:
    sso_enrollment_stages: >-
      {{ [
        {'stage': sso_prompt_stage_pk, 'order': 10},
        {'stage': sso_user_write_stage_pk, 'order': 20}
      ] + (
        (sso_config.enrollment.email_verification | default(true))
        | ternary(
            [{'stage': sso_email_stage_pk | default(''), 'order': 30}],
            []
          )
      ) + [
        {'stage': sso_login_stage_pk, 'order': 40}
      ] }}
  when:
    - sso_config.enrollment.enabled | default(true)
    - sso_enrollment_flow_check.json.results | length == 0
  tags: ['authentication', 'sso-setup']

- name: "[SSO] Bind stages to enrollment flow"
  uri:
    url: "{{ authentik_url }}/api/v3/flows/bindings/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      target: "{{ sso_enrollment_flow_pk }}"
      stage: "{{ item.stage }}"
      order: "{{ item.order }}"
    status_code: [200, 201]
  loop: "{{ sso_enrollment_stages }}"
  loop_control:
    label: "stage order {{ item.order }}"
  when:
    - sso_config.enrollment.enabled | default(true)
    - sso_enrollment_flow_check.json.results | length == 0
    - item.stage | default('') | length > 0
  tags: ['authentication', 'sso-setup']

# --- Link enrollment flow to default authentication flow ---

- name: "[SSO] Link enrollment flow to default authentication flow"
  uri:
    url: "{{ authentik_url }}/api/v3/flows/instances/{{ sso_authentication_flow_slug }}/"
    method: PATCH
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      enrollment_flow: "{{ sso_enrollment_flow_pk }}"
    status_code: 200
  when:
    - sso_config.enrollment.enabled | default(true)
    - sso_enrollment_flow_pk is defined
    - sso_enrollment_flow_pk | length > 0
    - sso_authentication_flow_slug is defined
  tags: ['authentication', 'sso-setup']

# ============================================================
# Step 5.5: MFA — TOTP setup (required for admins, optional for all)
# ============================================================
# Two authenticator validation stages bound to the authentication flow:
#   order 30: mfa-admin-totp-required  (not_configured_action=configure, policy: is admin)
#   order 31: mfa-user-totp-optional   (not_configured_action=skip, policy: is NOT admin)
# Both share mfa-totp-setup (QR code enrollment) as the configuration stage.

# --- 5.5a: TOTP setup stage (QR code enrollment) ---

- name: "[MFA] Check if TOTP setup stage exists"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/authenticator/totp/?name=mfa-totp-setup"
    method: GET
    headers:
      Authorization: "Bearer {{ authentik_token }}"
    status_code: 200
  register: mfa_totp_setup_check
  check_mode: no
  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
  tags: ['authentication', 'sso-setup', 'mfa']

- name: "[MFA] Create TOTP setup stage"
  uri:
    url: "{{ authentik_url }}/api/v3/stages/authenticator/totp/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "mfa-totp-setup"
      digits: "{{ sso_config.mfa.totp.digits | default(6) }}"
    status_code: [200, 201]
  register: mfa_totp_setup_created
  when:
    - sso_config.mfa.enabled | default(false)
    - sso_config.mfa.totp.enabled | default(false)
    - mfa_totp_setup_check.json.results | length == 0
  tags: ['authentication', 'sso-setup', 'mfa']

- name: "[MFA] Set TOTP setup stage PK"
  set_fact:
