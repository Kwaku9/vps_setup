---
# Authentication Role - Authentik SSO & Authentication
# Deploys centralized authentication and SSO infrastructure

- name: Create authentication pod
  containers.podman.podman_pod:
    name: authentication-pod
    network: "{{ podman_network_name | default('enterprise_network') }}"
    state: started
    ports:
      - "127.0.0.1:9000:9000"    # Authentik HTTP (internal - SSH tunnel)
      - "127.0.0.1:9443:9443"    # Authentik HTTPS (internal - SSH tunnel)
      - "127.0.0.1:6379:6379"    # Redis (Authentik's sole consumer)
  when: authentication.enabled | default(true)
  tags: ['authentication', 'pod']

# Redis (in authentication-pod — Authentik is the sole consumer)
- name: Create Redis data directory
  file:
    path: /opt/podman-data/redis
    state: directory
    mode: '0755'
  when: authentication.enabled | default(true)
  tags: ['authentication', 'redis']

- name: Deploy Redis container (in authentication-pod)
  containers.podman.podman_container:
    name: redis
    image: "docker.io/library/redis:8-alpine"
    state: started
    pod: authentication-pod
    memory: "128m"
    cpu_shares: 512
    command: "redis-server --appendonly yes"
    volumes:
      - /opt/podman-data/redis:/data:Z
    restart_policy: unless-stopped
  when: authentication.enabled | default(true)
  tags: ['authentication', 'redis']

- name: Create Authentik PostgreSQL database
  containers.podman.podman_container:
    name: authentik-postgres
    image: "docker.io/library/postgres:{{ shared_services[0].version | default('18-alpine') }}"
    state: started
    pod: authentication-pod
    memory: "256m"
    cpu_shares: 1024
    env:
      POSTGRES_DB: "{{ authentication.authentik.postgres_db | default('authentik') }}"
      POSTGRES_USER: "{{ authentication.authentik.postgres_user | default('authentik') }}"
      POSTGRES_PASSWORD: "{{ authentik_password }}"
    volumes:
      - authentik-postgres-data:/var/lib/postgresql/data
  when:
    - authentication.enabled | default(true)
    - authentication.authentik.enabled | default(true)
  tags: ['authentication', 'authentik', 'postgres']

- name: Wait for Authentik PostgreSQL to be ready
  wait_for:
    host: localhost
    port: 5432
    delay: 5
    timeout: 60
  when:
    - authentication.enabled | default(true)
    - authentication.authentik.enabled | default(true)
  tags: ['authentication', 'authentik']

- name: Deploy Authentik Server container
  containers.podman.podman_container:
    name: authentik-server
    image: "{{ authentication.authentik.image | default('ghcr.io/goauthentik/server:2025.10') }}"
    state: started
    pod: authentication-pod
    memory: "768m"
    cpu_shares: 2048
    env:
      AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ authentik_bootstrap_password }}"
      AUTHENTIK_BOOTSTRAP_TOKEN: "{{ authentik_bootstrap_token }}"
      AUTHENTIK_BOOTSTRAP_EMAIL: "{{ authentik_bootstrap_email | default('admin@' + domain_name) }}"
      AUTHENTIK_REDIS__HOST: "localhost"
      AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: "REDACTED_CIDR,127.0.0.0/8"
      AUTHENTIK_LISTEN__METRICS: "0.0.0.0:9300"
      AUTHENTIK_OUTPOSTS__DISCOVER: "false"
      AUTHENTIK_OUTPOSTS__DISABLE_EMBEDDED_OUTPOST: "true"
      AUTHENTIK_POSTGRESQL__HOST: "localhost"
      AUTHENTIK_POSTGRESQL__NAME: "{{ authentication.authentik.postgres_db | default('authentik') }}"
      AUTHENTIK_POSTGRESQL__USER: "{{ authentication.authentik.postgres_user | default('authentik') }}"
      AUTHENTIK_POSTGRESQL__PASSWORD: "{{ authentik_password }}"
      AUTHENTIK_SECRET_KEY: "{{ authentik_secret_key }}"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_LOG_LEVEL: "info"
      AUTHENTIK_EMAIL__HOST: "{{ authentik_smtp_host }}"
      AUTHENTIK_EMAIL__PORT: "{{ authentik_smtp_port | default('587') }}"
      AUTHENTIK_EMAIL__USERNAME: "{{ authentik_smtp_username }}"
      AUTHENTIK_EMAIL__PASSWORD: "{{ authentik_smtp_password }}"
      AUTHENTIK_EMAIL__USE_TLS: "true"
      AUTHENTIK_EMAIL__FROM: "{{ authentik_smtp_from }}"
    command: server
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
  when:
    - authentication.enabled | default(true)
    - authentication.authentik.enabled | default(true)
  tags: ['authentication', 'authentik', 'server']

- name: Deploy Authentik Worker container
  containers.podman.podman_container:
    name: authentik-worker
    image: "{{ authentication.authentik.worker_image | default('ghcr.io/goauthentik/server:2025.10') }}"
    state: started
    pod: authentication-pod
    memory: "512m"
    cpu_shares: 1024
    env:
      AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ authentik_bootstrap_password }}"
      AUTHENTIK_BOOTSTRAP_TOKEN: "{{ authentik_bootstrap_token }}"
      AUTHENTIK_BOOTSTRAP_EMAIL: "{{ authentik_bootstrap_email | default('admin@' + domain_name) }}"
      AUTHENTIK_REDIS__HOST: "localhost"
      AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: "REDACTED_CIDR,127.0.0.0/8"
      AUTHENTIK_POSTGRESQL__HOST: "localhost"
      AUTHENTIK_POSTGRESQL__NAME: "{{ authentication.authentik.postgres_db | default('authentik') }}"
      AUTHENTIK_POSTGRESQL__USER: "{{ authentication.authentik.postgres_user | default('authentik') }}"
      AUTHENTIK_POSTGRESQL__PASSWORD: "{{ authentik_password }}"
      AUTHENTIK_SECRET_KEY: "{{ authentik_secret_key }}"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_LOG_LEVEL: "info"
      AUTHENTIK_EMAIL__HOST: "{{ authentik_smtp_host }}"
      AUTHENTIK_EMAIL__PORT: "{{ authentik_smtp_port | default('587') }}"
      AUTHENTIK_EMAIL__USERNAME: "{{ authentik_smtp_username }}"
      AUTHENTIK_EMAIL__PASSWORD: "{{ authentik_smtp_password }}"
      AUTHENTIK_EMAIL__USE_TLS: "true"
      AUTHENTIK_EMAIL__FROM: "{{ authentik_smtp_from }}"
    command: worker
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
      - authentik-certs:/certs
  when:
    - authentication.enabled | default(true)
    - authentication.authentik.enabled | default(true)
  tags: ['authentication', 'authentik', 'worker']

- name: Display Authentik status
  debug:
    msg:
      - "Authentik SSO deployed successfully"
      - "Authentik UI: http://{{ ansible_host }}:9000"
      - "Default login: akadmin / <bootstrap_password from vault>"
  when: authentication.enabled | default(true)
  tags: ['authentication']

# Configure Authentik <-> Cloudflare Zero Trust OIDC integration
- name: Configure Authentik-Cloudflare OIDC integration
  include_tasks: cloudflare-integration.yml
  when:
    - authentication.enabled | default(true)
    - authentication.authentik.enabled | default(true)
    - authentication.authentik.cloudflare_integration.enabled | default(false)
    - cloudflare.enabled | default(false)
  tags: ['authentication', 'cloudflare-integration', 'sso']

# Configure SSO: enrollment, native OIDC providers for each service
- name: Configure SSO (native OIDC providers + enrollment)
  include_tasks: sso-setup.yml
  when:
    - authentication.enabled | default(true)
    - authentication.authentik.enabled | default(true)
    - authentication.authentik.sso.enabled | default(false)
  tags: ['authentication', 'sso', 'sso-setup']
