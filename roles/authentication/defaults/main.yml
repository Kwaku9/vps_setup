---
# Authentication Role Defaults - Authentik SSO

authentication:
  enabled: true
  authentik:
    enabled: true
    version: "2026.5"
    image: "ghcr.io/goauthentik/server:2026.5"
    port: 9000
    postgres_db: "authentik"
    postgres_user: "authentik"
    sso:
      enabled: false
      enrollment:
        enabled: true
        email_verification: true
      groups:
        admin: "admins"
        free: "free_users"
        paid: "paid_users"
      oidc_services: []
    # NOTE: workshop_outpost is defined in all.yml, not here. all.yml sets the
    # whole `authentication:` dict and Ansible does not deep-merge hashes, so a
    # key added here under authentik would silently never exist at runtime.

# Will be overridden by vault
authentik_password: "VAULT_OVERRIDE"
authentik_secret_key: "VAULT_OVERRIDE"
authentik_smtp_host: ""
authentik_smtp_port: "587"
authentik_smtp_username: ""
authentik_smtp_password: ""
authentik_smtp_from: ""

# ============================================================
# Access tiers: who gets what, with throttles and caps.
# ============================================================
# STATUS 2026-11-05. "enforced" lines are live; everything marked PROPOSED is
# the review draft for the student group and the tiered LiteLLM keys, and is
# not wired to any task yet. Numbers are starting points, not measurements.
#
# Escalation is never self-service: a user asks through the portal, the owner
# approves or denies, and only then does a deploy change their group.
access_tiers:
  public:                       # self sign-up lands here
    group: free_users           # enforced (enrollment-user-write)
    signup:
      inactive_until_email_verified: true   # enforced, 30 min token
      bot_challenge: true                   # enforced, CF managed challenge
      rate_limit: "5 POST / 10s / IP"       # enforced, CF http_ratelimit
    apps: [openwebui]           # enforced (authentik-apps.yml bindings)
    mfa: optional               # enforced (default validation stage)
    llm:                        # enforced 2026-11-05 via Open WebUI groups
      models: free_only         # docs/model_tiers.yml tier: free = Groq + Cloudflare
                                # pools only; no paid models, no local inference
      caps: per-route           # Groq 24 RPM / 6.5K TPM, Cloudflare 10-15 RPM
                                # (80% of the free plans). No per-user cap: Open
                                # WebUI uses one LiteLLM key for everyone.
    escalation: portal_request  # PROPOSED (portal not built)

  students:                     # enforced 2026-11-07
    group: students             # admins add members; sign-up never does
    apps: [openwebui, grafana, charts, timeline, portal, decks, threat-map]   # geo: admin-only (dev server)
    edge: "own CF Access app per host: groups students OR admins"
    grafana: students_org_viewer  # separate org, 16 dashboards, metrics + student_view SQL, no logs
    openwebui: [free, local]    # 9 free models + local-chat
    mfa: required               # mfa.totp.required_groups
    llm:                        # enforced 2026-11-05: LiteLLM team "students"
      models: [free-chat, free-small]  # local-chat added when Strata is back
      team: {rpm: 20, tpm: 12000, max_budget_usd: 5, per: 30d}
      demo_key: {rpm: 5, tpm: 4000, parallel: 1, expires: 30d}
      mint: "--tags litellm-tiers -e student=<name>"
      revoke: "--tags litellm-tiers -e revoke_student=<name>"
    tailnet: per_student_approval    # credit-limited, owner approves each
    write_access: lab_sandbox_only   # real services stay read-only
    logging: elevated                # per-identity access log + alerts
    escalation: portal_request

  paid:
    group: paid_users
    apps: [openwebui, grafana]  # enforced
    mfa: optional

  admins:
    group: admins
    apps: all                   # enforced
    mfa: required               # enforced (mfa-routing.yml)
    edge: "CF Access requires groups=admins"   # enforced
