---
# Backup Role Defaults
# Provides backup/restore for all VPS persistent data

backup:
  enabled: true
  # Base backup directory
  backup_dir: /opt/backups
  # Retention for the LOCAL copy in {{ backup_dir }}/daily, in days.
  # 2026-08-16: 2 -> 0. With s3_delete_local the local archive is removed as
  # soon as S3 has a verified copy, so this only governs leftovers from a run
  # whose upload failed. `find -mtime +0` prunes anything >=24h old, i.e. a
  # failed archive is cleared by the NEXT run's pre-flight before that run
  # needs the space. Do not raise this while s3_delete_local is true: archives
  # are now ~6.4G and a run peaks at ~2x that, against ~18G free.
  retention_days: 0
  # Pre-flight aborts the run (writing nothing) if free space on the backup
  # filesystem is below this many GB after pruning old backups. Peak usage is
  # ~2x one backup (staging dir + final archive held at once). Post-trim a
  # backup is ~3G (obs TSDBs + node_modules + *.bak excluded), so peak ~6G and
  # 8G guards it with headroom. The mid-run tar/gzip failure detection is the
  # real backstop; if this gate aborts, the disk is genuinely too full — free
  # space / enable S3, don't just lower this further.
  min_free_gb: 8
  # ── S3 sync ───────────────────────────────────────────────────────────────
  # 2026-08-16: ENABLED. S3 is now the ONLY offsite copy — the laptop pull
  # (vps-backup-pull.timer) is retired. That timer used to *drain*
  # /opt/backups/daily every morning, which is the only reason a 94G disk with
  # ~6.4G archives ever fit. Nothing drains it now, so s3_delete_local below is
  # load-bearing, not an optimisation: without it the disk fills within a day.
  s3_enabled: true
  # MUST be set to a real bucket via vault_s3_backups_bucket. The 'my-backups'
  # fallback in all.yml:744 is a placeholder that does not exist — uploads to it
  # fail, and before 2026-08-16 that failure was swallowed by `|| warn`.
  s3_bucket: "{{ s3_backups_bucket }}"
  s3_region: "us-east-1"
  # Archives to keep in S3. COUNT-based, not date-based: the old date-cutoff
  # prune keeps nothing at all if runs are skipped for a stretch, and it reused
  # retention_days, which now means something entirely different.
  s3_retention_count: 4
  # Remove the local archive once S3 has a size-verified copy. Required while
  # s3_enabled is true and no external puller drains the backup directory.
  s3_delete_local: true

  # Data directories to backup (bind mounts under /opt/podman-data)
  # Sizes noted 2026-07-05. victoriametrics (metrics TSDB, 2.3G) intentionally
  # DROPPED: transient time-series with no DR value — it rebuilds after restore.
  data_dirs:
    - /opt/podman-data/postgres            # 2.7G  session history + recall vectors — CRITICAL
    - /opt/podman-data/ai-stack/postgres   # 104M  OWUI/litellm postgres
    - /opt/podman-data/ai-stack/openwebui  # 2.3G  OWUI data/RAG
    - /opt/podman-data/ai-stack/litellm    # 19K
    - /opt/podman-data/redis               # 5K
    - /opt/podman-data/crowdsec/data       # (part of 923M) security decisions
    - /opt/podman-data/crowdsec/config     # security config
    - /opt/podman-data/neo4j               # 428M store (1.0G txn logs excluded). Added 2026-07-31:
                                           # the graph (~394k nodes incl. infra topology + risk
                                           # register) had NO daily backup, only a stale 06-03 dump.
    - /opt/podman-data/journey-tracker     # 2.9M
    - /opt/podman-data/mcp                 # 99M
    # - /opt/podman-data/victoriametrics   # 2.3G  DROPPED — transient metrics TSDB
    # Added 2026-08-21. Honeypot hits live in Loki, and loki-data is
    # (correctly) dropped below as a transient log TSDB. But attacker telemetry
    # is not operational noise — it is EVIDENCE, and the only record of who
    # probed us and when. Losing the host previously lost the entire
    # investigative history, including every burned-hostname canary hit.
    #
    # Rather than back up 2.4G of mostly-application Loki data, a daily job
    # extracts just the {honeypot="true"} stream to compact JSONL here.
    # See roles/honeypot-threatmap/tasks/evidence-export.yml
    - /opt/podman-data/honeypot-evidence   # small, append-only attacker telemetry

  # Named Podman volumes to export
  # loki-data (2.4G logs), tempo-data (1.3G traces), trivy-cache (1.1G vuln-db
  # cache) DROPPED: transient/regenerable, ~4.8G of low-value data removed.
  named_volumes:
    - grafana-data            # 74M   dashboards — keep
    - authentik-postgres-data # 261M  identity/users — CRITICAL
    - traefik-plugins         # 670K
    # - loki-data             # 2.4G  DROPPED — transient log TSDB
    # - tempo-data            # 1.3G  DROPPED — transient trace TSDB
    # - trivy-cache           # 1.1G  DROPPED — regenerable vuln-db cache

  # Config directories to backup
  config_dirs:
    - /opt/compose

  # Exclude patterns for tar. Beyond transient junk, drop regenerable/stale
  # bloat that inflated the /opt/compose "config" backup to 2.7G:
  #   node_modules  — reinstalled via npm/yarn, never restore-critical
  #   *.bak / *.bak.* — stale hand-made backup dirs (e.g. decks.bak.<ts>, ~340M)
  exclude_patterns:
    - "*.tmp"
    - "*.log"
    - "*.pid"
    - "node_modules"
    - "*.bak"
    - "*.bak.*"
    - "neo4j/data/transactions"   # WAL only; safe to drop because the pod is stopped

  # Pods to stop during backup for consistent snapshots
  # security-infra-pod stays running (Traefik serves traffic)
  stop_pods:
    - neo4j-pod          # 2026-07-31: stop for a consistent, checkpointed graph snapshot
    - metrics-pod
    - logs-pod
    - tempo-pod
    - ai-stack-pod
    - management-pod
    - authentication-pod
    - frontend-pod
    - shared-db-pod
    - security-pod

  # All pods to restart after restore
  all_pods:
    - security-infra-pod
    - metrics-pod
    - logs-pod
    - tempo-pod
    - ai-stack-pod
    - authentication-pod
    - management-pod
    - frontend-pod
    - shared-db-pod
    - security-pod
