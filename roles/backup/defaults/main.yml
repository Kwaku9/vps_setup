---
# Backup Role Defaults
# Provides backup/restore for all VPS persistent data

backup:
  enabled: true
  # Base backup directory
  backup_dir: /opt/backups
  # Retention: number of daily backups to keep. Reduced 3->2: disk sits at ~91%
  # and each (trimmed) backup is ~4.5G, so 2 copies (~9G) is the safe ceiling.
  retention_days: 2
  # Pre-flight aborts the run (writing nothing) if free space on the backup
  # filesystem is below this many GB after pruning old backups. Peak usage is
  # ~2x one backup (staging dir + final archive held at once). Post-trim a
  # backup is ~3G (obs TSDBs + node_modules + *.bak excluded), so peak ~6G and
  # 8G guards it with headroom. The mid-run tar/gzip failure detection is the
  # real backstop; if this gate aborts, the disk is genuinely too full — free
  # space / enable S3, don't just lower this further.
  min_free_gb: 8
  # Google One (consumer Drive) offsite copy via rclone.
  # Google One is CONSUMER Drive, so this needs a personal OAuth token — a
  # service account will not work: files an SA creates count against the SA's
  # own (zero) quota, not the 5TB, and the Shared-Drive workaround needs
  # Workspace. Token lives in vault as gdrive_oauth_token.
  gdrive_enabled: false
  gdrive_remote: "gdrive"
  # Client-side encryption wrapper. Encrypts in-flight during upload, so no
  # second plaintext copy is written locally.
  gdrive_encrypt: true
  gdrive_crypt_remote: "gdrive-crypt"
  gdrive_path: "vps-backups/daily"
  gdrive_config: "/root/.config/rclone/rclone.conf"
  gdrive_retention_days: 30
  # Local archives kept AFTER a verified offsite upload. Applied ONLY when the
  # upload verified — a failed upload must never reduce the number of copies
  # that exist, so on failure this is ignored and retention_days still governs.
  local_copies_after_offsite: 1

  # S3 sync (optional)
  s3_enabled: false
  s3_bucket: "{{ s3_backups_bucket }}"
  s3_region: "us-east-1"

  # Data directories to backup (bind mounts under /opt/podman-data)
  # Sizes noted 2026-07-05. victoriametrics (metrics TSDB, 2.3G) intentionally
  # DROPPED: transient time-series with no DR value — it rebuilds after restore.
  data_dirs:
    - /opt/podman-data/postgres            # 2.7G  session history + recall vectors — CRITICAL
    - /opt/podman-data/ai-stack/postgres   # 104M  OWUI/litellm postgres
    - /opt/podman-data/ai-stack/openwebui  # 2.3G  OWUI data/RAG
    - /opt/podman-data/ai-stack/litellm    # 19K
    - /opt/podman-data/redis               # 5K
    - /opt/podman-data/crowdsec/data       # (part of 923M) security decisions
    - /opt/podman-data/crowdsec/config     # security config
    - /opt/podman-data/neo4j               # 428M store (1.0G txn logs excluded). Added 2026-07-31:
                                           # the graph (~394k nodes incl. infra topology + risk
                                           # register) had NO daily backup, only a stale 06-03 dump.
    - /opt/podman-data/journey-tracker     # 2.9M
    - /opt/podman-data/mcp                 # 99M
    # - /opt/podman-data/victoriametrics   # 2.3G  DROPPED — transient metrics TSDB

  # Named Podman volumes to export
  # loki-data (2.4G logs), tempo-data (1.3G traces), trivy-cache (1.1G vuln-db
  # cache) DROPPED: transient/regenerable, ~4.8G of low-value data removed.
  named_volumes:
    - grafana-data            # 74M   dashboards — keep
    - authentik-postgres-data # 261M  identity/users — CRITICAL
    - traefik-plugins         # 670K
    - authentik-media         # 10M
    - authentik-certs         # 1K
    - authentik-templates     # 1K
    # loki-data RESTORED 2026-08-21. Previously dropped as a "transient log
    # TSDB", which was right when logs were only for live debugging. They are
    # now retained deliberately: security-posture history and training data for
    # the administrative agent. Also far smaller than the old note claims —
    # 156M, not 2.4G, because Loki's retention_period is 336h (14 days).
    - loki-data               # 156M  LOG CORPUS — restored
    # tempo-data still out (1.3G traces) pending a Grafana dashboard check that
    # traces are actually being consumed. Revisit after that test.
    # - tempo-data            # 1.3G  HELD — verify usage via Grafana first
    # - trivy-cache           # 1.1G  DROPPED — regenerable vuln-db cache

  # Config directories to backup
  config_dirs:
    - /opt/compose

  # Exclude patterns for tar. Beyond transient junk, drop regenerable/stale
  # bloat that inflated the /opt/compose "config" backup to 2.7G:
  #   node_modules  — reinstalled via npm/yarn, never restore-critical
  #   *.bak / *.bak.* — stale hand-made backup dirs (e.g. decks.bak.<ts>, ~340M)
  exclude_patterns:
    - "*.tmp"
    - "*.log"
    - "*.pid"
    - "node_modules"
    - "*.bak"
    - "*.bak.*"
    - "neo4j/data/transactions"   # WAL only; safe to drop because the pod is stopped
    # tar cannot read a live SQLite file consistently — it exits 1 ("file
    # changed as we read it") and can capture a torn, corrupt copy.
    # sqlite_snapshots below takes a proper online-backup copy instead.
    - "crowdsec.db"

  # Log directories: archived WITHOUT the *.log exclusion above, because they
  # ARE the logs. Retained for security-posture history and agent training.
  log_dirs:
    - /var/log                    # 212M  squid access, tailscale, crowdsec feeds

  # Hot SQLite DBs needing a consistent online-backup copy. crowdsec is
  # deliberately NOT in stop_pods (it is the security layer and stays up during
  # the backup), so crowdsec.db is always mid-write when tar reaches it. This
  # was failing every night since at least 2026-08-11.
  sqlite_snapshots:
    - { path: /opt/podman-data/crowdsec/data/crowdsec.db, name: crowdsec.db }

  # Pods to stop during backup for consistent snapshots
  # security-infra-pod stays running (Traefik serves traffic)
  stop_pods:
    - neo4j-pod          # 2026-07-31: stop for a consistent, checkpointed graph snapshot
    - metrics-pod
    - logs-pod
    - tempo-pod
    - ai-stack-pod
    - management-pod
    - authentication-pod
    - frontend-pod
    - shared-db-pod
    - security-pod

  # All pods to restart after restore
  all_pods:
    - security-infra-pod
    - metrics-pod
    - logs-pod
    - tempo-pod
    - ai-stack-pod
    - authentication-pod
    - management-pod
    - frontend-pod
    - shared-db-pod
    - security-pod
