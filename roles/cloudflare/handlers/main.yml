---
# Cloudflare Role Handlers

- name: restart cloudflared
  command: podman restart {{ cloudflare_tunnel.container_name | default('cloudflared') }}
  listen: restart cloudflared

- name: restart traefik
  command: podman restart traefik
  listen: restart traefik

- name: verify cloudflare tunnel
  command: podman logs --tail 20 {{ cloudflare_tunnel.container_name | default('cloudflared') }}
  register: tunnel_logs
  changed_when: false
  listen: verify cloudflare tunnel

- name: display tunnel logs
  debug:
    msg: "{{ tunnel_logs.stdout_lines | default([]) }}"
  listen: verify cloudflare tunnel

- name: wait for certificate
  pause:
    seconds: 30
    prompt: "Waiting for ACME certificate generation..."
  listen: wait for certificate
