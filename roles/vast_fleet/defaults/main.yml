---
# Defaults for the vast_fleet role. Everything here is overridable from
# group_vars/gpu_fleet.yml -- nothing in this role should need editing to use it
# for a different fleet, model set, or provider account.

vast_api_base_v0: "https://console.vast.ai/api/v0"
vast_api_base_v1: "https://console.vast.ai/api/v1"

# API surface notes (verified against the live API, 2026-08):
#   list    GET    {v1}/instances/        -- v0 returns 410 deprecated_endpoint,
#                                            and the TRAILING SLASH is required
#                                            (without it you get a 301).
#   offers  GET    {v0}/bundles/?q=<urlencoded json>
#   create  PUT    {v0}/asks/<offer_id>/  -- PUT only; GET returns a 404 whose
#                                            body leaks "predicate mismatch for
#                                            view asks_accept".
#   destroy DELETE {v1}/instances/<id>/
vast_endpoint_instances: "{{ vast_api_base_v1 }}/instances/"
vast_endpoint_bundles: "{{ vast_api_base_v0 }}/bundles/"
vast_endpoint_ask: "{{ vast_api_base_v0 }}/asks"

# How long to wait for a rented instance to reach actual_status == running.
# Cold hosts pull the image first, which on a slow link is the long pole.
vast_boot_timeout_sec: 900
vast_boot_poll_sec: 15

# Safety rail. The role refuses to create instances when the number it would
# create exceeds this, regardless of what the fleet spec says. Guards against a
# templating mistake that expands gpu_fleet_members into something enormous.
vast_max_instances_per_run: 8

# Set true to see what WOULD be rented without spending anything. Recommended
# for the first run against a new fleet spec.
vast_fleet_check_only: false
