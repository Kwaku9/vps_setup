---
# Cloudflare Tunnel Role Defaults
# Container deployed in security-infra-pod (shared-services role)

cloudflared:
  enabled: true
  container_name: "cloudflared"
  # Its own pod (phase 2). The POD holds the pinned address: traefik_internal_sources in
  # roles/shared-services/defaults/main.yml lists it, and the deploy asserts the two agree.
  pod_name: "cloudflared-pod"
  static_ip: "10.89.0.235"
  # vmscrape dials cloudflared:2000; the alias keeps that name resolving until the zone move.
  network_alias: "cloudflared"
  # Single source of truth is cloudflare.tunnel.image in all.yml (pinned tag).
  image: "{{ cloudflare.tunnel.image | default('docker.io/cloudflare/cloudflared:2026.9.3') }}"
  network: "enterprise_network"
  memory: "128m"  # Reduced from 256m — using 48MB
  config_dir: "/opt/compose/cloudflare"
  tunnel_name: "alpine-vps-tunnel"
  protocol: "quic"
  metrics_port: 2000
  domain: "{{ domain_name }}"

  # Traefik is standalone — use container name via Podman DNS
  ingress:
    - hostname: "ssh.{{ domain_name }}"
      service: "ssh://host.containers.internal:22"
    - hostname: "{{ domain_name }}"
      service: "https://traefik:443"
      no_tls_verify: true
    - hostname: "*.{{ domain_name }}"
      service: "https://traefik:443"
      no_tls_verify: true

# Vault overrides these
cloudflared_tunnel_token: "VAULT_OVERRIDE"
