<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; media-src 'self'; object-src 'none'; base-uri 'none'">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AICORTEX — Live Threat Map</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<header>
  <div class="logo">AICORTEX <span>LIVE THREAT INTELLIGENCE</span></div>

  <div class="counters">
    <div class="counter"><div class="val" id="cnt-total">0</div><div class="lbl">TOTAL 24H</div></div>
    <div class="counter"><div class="val" id="cnt-rate">0</div><div class="lbl">/ HOUR</div></div>
    <div class="counter"><div class="val" id="cnt-countries">0</div><div class="lbl">COUNTRIES</div></div>
    <div class="src-chips">
      <span class="src-chip"><span class="src-dot" style="background:#00a95e"></span>HP <b id="chip-honeypot">0</b></span>
      <span class="src-chip"><span class="src-dot" style="background:#2789cc"></span>PRB <b id="chip-probes">0</b></span>
      <span class="src-chip"><span class="src-dot" style="background:#e8304b"></span>BAN <b id="chip-bans">0</b></span>
    </div>
  </div>

  <div class="header-right">
    <button id="btn-audio-arm" aria-label="Enable audio">🔊 ARM AUDIO</button>
    <div id="audio-panel">
      <button id="btn-audio-mute" class="active" aria-label="Toggle sound effects">SFX</button>
      <input id="audio-vol" type="range" min="0" max="0.6" step="0.02" aria-label="Volume">
      <button id="btn-ambient" aria-label="Toggle ambient soundtrack">AMBIENT</button>
    </div>
    <div class="status"><div class="dot" id="status-dot"></div><span id="status-text">Connecting…</span></div>
  </div>
</header>

<main>
  <div id="globe-container"></div>

  <aside>
    <div class="panel" id="panel-countries">
      <h3>TOP ATTACKING COUNTRIES</h3>
      <div id="country-list"></div>
    </div>

    <div class="panel" id="panel-types">
      <h3>ATTACK TYPES</h3>
      <div id="type-list"></div>
    </div>

    <div class="panel" id="panel-paths">
      <h3>TOP PROBED PATHS</h3>
      <div id="path-list"></div>
    </div>

    <div class="feed-wrapper">
      <div class="feed-header"><h3>EVENT FEED</h3></div>
      <div id="feed"></div>
    </div>
  </aside>
</main>

<footer>
  <div class="transport">
    <button id="btn-live">◉ LIVE</button>
    <button id="btn-play">▶ PLAY</button>
    <div class="group" id="speed-buttons" role="group" aria-label="Replay speed"></div>
    <div class="group" id="range-presets" role="group" aria-label="Timeline range"></div>
    <span id="replay-range"></span>
    <span id="replay-clock"></span>
    <button id="btn-intel">◈ INTEL</button>
    <div class="legend" role="group" aria-label="Event sources">
      <button id="legend-honeypot"><span class="src-dot" style="background:#00a95e"></span>HONEYPOT</button>
      <button id="legend-probes"><span class="src-dot" style="background:#2789cc"></span>PROBES</button>
      <button id="legend-bans"><span class="src-dot" style="background:#e8304b"></span>BANS</button>
    </div>
  </div>
  <div class="timeline-wrap">
    <canvas id="timeline-canvas" aria-label="Attack density timeline — drag to select a replay range"></canvas>
    <div id="timeline-tooltip"></div>
  </div>
</footer>

<div id="intel-modal" role="dialog" aria-modal="true" aria-label="Grafana intel report">
  <div class="intel-box">
    <div class="intel-header">
      <h2>◈ INTEL REPORT</h2>
      <span id="intel-range"></span>
      <div id="intel-tabs"></div>
      <button id="intel-close" aria-label="Close">✕</button>
    </div>
    <div id="intel-body"></div>
  </div>
</div>

<script src="/static/vendor/globe.gl.min.js"></script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
