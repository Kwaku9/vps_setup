---
# Base Role - Alpine Linux Foundation
# Installs minimal essential packages and configures system basics

- name: Update Alpine package index
  apk:
    update_cache: yes
  tags: ['base', 'packages']

- name: Install essential base packages
  apk:
    name:
      - bash              # Required for restore scripts
      - curl              # HTTP client
      - wget              # Alternative HTTP client
      - git               # Version control
      - gnupg             # Credential encryption/decryption
      - tar               # Archive extraction
      - gzip              # Compression
      - ca-certificates   # SSL/TLS certificates
      - tzdata            # Timezone data
      - openssh           # SSH server
      - rsync             # File synchronization (required for Ansible synchronize)
      - sudo              # Privilege escalation
      - iptables          # Required for Podman netavark networking
      - ip6tables         # IPv6 firewall for Podman
      - gcompat           # GNU C compatibility (required for VS Code Remote SSH)
      - libstdc++         # C++ standard library (required for VS Code Remote SSH)
    state: present
  tags: ['base', 'packages']

- name: Set system timezone
  community.general.timezone:
    name: "{{ timezone | default('America/New_York') }}"
  tags: ['base', 'system']

- name: Configure Git global settings
  git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    - { name: 'user.name', value: "{{ git.user_name | default('Ansible Automation') }}" }
    - { name: 'user.email', value: "{{ git.user_email | default('ansible@localhost') }}" }
  tags: ['base', 'git']

- name: Ensure /opt directory exists
  file:
    path: /opt
    state: directory
    mode: '0755'
  tags: ['base', 'directories']

- name: Create backup directory
  file:
    path: "{{ backup.destination | default('/opt/backups') }}"
    state: directory
    mode: '0755'
  when: backup.enabled | default(true)
  tags: ['base', 'directories']

- name: Display base setup completion
  debug:
    msg: "Base Alpine Linux setup completed successfully"
  tags: ['base']
