---
# Security Role - Firewall, Fail2ban, Wazuh, Trivy
# Implements security hardening and threat detection

- name: Import hardening tasks
  import_tasks: ../../hardening.yml
  tags: ['security', 'hardening']

# ============================================
# HOST-LEVEL SECURITY (Fail2ban & Firewall)
# ============================================

- name: Install Fail2ban
  apk:
    name:
      - fail2ban
      - iptables
    state: present
  when: security.fail2ban.enabled | default(true)
  tags: ['security', 'fail2ban']

- name: Create Fail2ban jail configuration
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: '0644'
  when: security.fail2ban.enabled | default(true)
  notify: restart fail2ban
  tags: ['security', 'fail2ban']

- name: Add Fail2ban to default runlevel
  command: rc-update add fail2ban default
  register: fail2ban_runlevel
  changed_when: "'already added' not in fail2ban_runlevel.stderr"
  failed_when: false
  when: security.fail2ban.enabled | default(true)
  tags: ['security', 'fail2ban']

- name: Start Fail2ban service
  command: rc-service fail2ban start
  register: fail2ban_start
  changed_when: "'started' in fail2ban_start.stdout"
  failed_when: false
  when: security.fail2ban.enabled | default(true)
  tags: ['security', 'fail2ban']

- name: Create firewall configuration script
  template:
    src: firewall.sh.j2
    dest: /usr/local/bin/configure-firewall.sh
    mode: '0755'
  when: security.firewall.enabled | default(true)
  tags: ['security', 'firewall']

- name: Create iptables directory
  file:
    path: /etc/iptables
    state: directory
    mode: '0755'
  when: security.firewall.enabled | default(true)
  tags: ['security', 'firewall']

- name: Apply firewall rules
  command: /usr/local/bin/configure-firewall.sh start
  when: security.firewall.enabled | default(true)
  tags: ['security', 'firewall']

- name: Save iptables rules for persistence
  shell: |
    iptables-save > /etc/iptables/rules-save
  when: security.firewall.enabled | default(true)
  tags: ['security', 'firewall']

- name: Create iptables restore service
  copy:
    content: |
      #!/sbin/openrc-run
      description="Restore iptables rules"
      depend() {
        before net
        need localmount
      }
      start() {
        ebegin "Restoring iptables rules"
        if [ -f /etc/iptables/rules-save ]; then
          iptables-restore < /etc/iptables/rules-save
        fi
        eend $?
      }
    dest: /etc/init.d/iptables
    mode: '0755'
  when: security.firewall.enabled | default(true)
  tags: ['security', 'firewall']

- name: Enable iptables service on boot
  command: rc-update add iptables boot
  register: iptables_runlevel
  changed_when: "'already added' not in iptables_runlevel.stderr"
  failed_when: false
  when: security.firewall.enabled | default(true)
  tags: ['security', 'firewall']

# ============================================
# SECURITY POD (Wazuh Stack & Trivy)
# ============================================

- name: Create security pod
  containers.podman.podman_pod:
    name: security-pod
    network: "{{ podman_network_name | default('enterprise_network') }}"
    state: started
    ports:
      - "127.0.0.1:1514:1514"    # Wazuh Agent (TCP) (internal)
      - "127.0.0.1:1514:1514/udp" # Wazuh Agent (UDP) (internal)
      - "127.0.0.1:1515:1515"    # Wazuh enrollment (internal)
      - "127.0.0.1:55000:55000"  # Wazuh API (internal)
      - "127.0.0.1:5601:5601"    # Wazuh Dashboard (internal - SSH tunnel)
      - "127.0.0.1:9200:9200"    # Wazuh Indexer (internal)
  when: security.wazuh.enabled | default(true)
  tags: ['security', 'pod']

# ============================================
# WAZUH DEPLOYMENT (Containerized)
# ============================================

- name: Create Wazuh configuration directory
  file:
    path: /opt/compose/wazuh
    state: directory
    mode: '0755'
  when: security.wazuh.enabled | default(true)
  tags: ['security', 'wazuh']

- name: Deploy Wazuh Indexer container
  containers.podman.podman_container:
    name: wazuh-indexer
    image: "docker.io/wazuh/wazuh-indexer:{{ security.wazuh.version | default('4.14.1') }}"
    state: started
    pod: security-pod
    env:
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      discovery.type: "single-node"
      network.host: "0.0.0.0"
      plugins.security.disabled: "true"
      bootstrap.memory_lock: "true"
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    ulimits:
      - "nofile=65536:65536"
      - "memlock=-1:-1"
  when: security.wazuh.enabled | default(true)
  tags: ['security', 'wazuh', 'wazuh-indexer']

- name: Wait for Wazuh Indexer to start
  wait_for:
    host: localhost
    port: 9200
    delay: 15
    timeout: 180
  when: security.wazuh.enabled | default(true)
  tags: ['security', 'wazuh']

- name: Deploy Wazuh Manager container
  containers.podman.podman_container:
    name: wazuh-manager
    image: "docker.io/wazuh/wazuh-manager:{{ security.wazuh.version | default('4.14.1') }}"
    state: started
    pod: security-pod
    env:
      INDEXER_URL: "https://127.0.0.1:9200"
      INDEXER_USERNAME: "admin"
      INDEXER_PASSWORD: "{{ wazuh_password | default('SecurePass123!') }}"
      FILEBEAT_SSL_VERIFICATION_MODE: "none"
      API_USERNAME: "wazuh-wui"
      API_PASSWORD: "{{ wazuh_password | default('SecurePass123!') }}"
    volumes:
      - wazuh-manager-data:/var/ossec/data
      - wazuh-manager-logs:/var/ossec/logs
      - wazuh-manager-etc:/var/ossec/etc
      - /var/log:/host-logs:ro
  when: security.wazuh.enabled | default(true)
  tags: ['security', 'wazuh', 'wazuh-manager']

- name: Wait for Wazuh Manager to start
  wait_for:
    host: localhost
    port: 55000
    delay: 20
    timeout: 180
  when: security.wazuh.enabled | default(true)
  tags: ['security', 'wazuh']

- name: Deploy Wazuh Dashboard container
  containers.podman.podman_container:
    name: wazuh-dashboard
    image: "docker.io/wazuh/wazuh-dashboard:{{ security.wazuh.version | default('4.14.1') }}"
    state: started
    pod: security-pod
    env:
      INDEXER_USERNAME: "admin"
      INDEXER_PASSWORD: "{{ wazuh_password | default('SecurePass123!') }}"
      WAZUH_API_URL: "https://127.0.0.1"
      API_USERNAME: "wazuh-wui"
      API_PASSWORD: "{{ wazuh_password | default('SecurePass123!') }}"
      OPENSEARCH_HOSTS: "https://127.0.0.1:9200"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "5601"
    volumes:
      - wazuh-dashboard-data:/usr/share/wazuh-dashboard/data
  when: security.wazuh.enabled | default(true)
  tags: ['security', 'wazuh', 'wazuh-dashboard']

# ============================================
# WAZUH AGENT (Host Installation)
# ============================================

- name: Check if Wazuh agent is already installed
  stat:
    path: /var/ossec/bin/wazuh-control
  register: wazuh_agent_installed
  when: security.wazuh.enabled | default(true)
  tags: ['security', 'wazuh', 'wazuh-agent']

- name: Download Wazuh agent for Alpine Linux
  get_url:
    url: "https://packages.wazuh.com/4.x/alpine/v3.19/main/x86_64/wazuh-agent-{{ security.wazuh.version | default('4.14.1') }}.apk"
    dest: "/tmp/wazuh-agent.apk"
    mode: '0644'
  when:
    - security.wazuh.enabled | default(true)
    - not wazuh_agent_installed.stat.exists
  tags: ['security', 'wazuh', 'wazuh-agent']

- name: Install Wazuh agent
  command: apk add --allow-untrusted /tmp/wazuh-agent.apk
  when:
    - security.wazuh.enabled | default(true)
    - not wazuh_agent_installed.stat.exists
  tags: ['security', 'wazuh', 'wazuh-agent']

- name: Configure Wazuh agent to connect to manager
  template:
    src: ossec.conf.j2
    dest: /var/ossec/etc/ossec.conf
    mode: '0644'
  when: security.wazuh.enabled | default(true)
  notify: restart wazuh-agent
  tags: ['security', 'wazuh', 'wazuh-agent']

- name: Import Wazuh manager key (for agent authentication)
  command: /var/ossec/bin/manage_agents -i {{ wazuh_agent_key }}
  when:
    - security.wazuh.enabled | default(true)
    - wazuh_agent_key is defined
  failed_when: false
  tags: ['security', 'wazuh', 'wazuh-agent']

- name: Add Wazuh agent to default runlevel
  command: rc-update add wazuh-agent default
  register: wazuh_agent_runlevel
  changed_when: "'already added' not in wazuh_agent_runlevel.stderr"
  failed_when: false
  when: security.wazuh.enabled | default(true)
  tags: ['security', 'wazuh', 'wazuh-agent']

- name: Start Wazuh agent service
  command: rc-service wazuh-agent start
  register: wazuh_agent_start
  changed_when: "'started' in wazuh_agent_start.stdout"
  failed_when: false
  when: security.wazuh.enabled | default(true)
  tags: ['security', 'wazuh', 'wazuh-agent']

# ============================================
# TETRAGON (eBPF Security Observability)
# ============================================
# Kernel-level eBPF hooks for process, file, and
# network monitoring. Events written to JSON log files
# picked up by Alloy -> Loki. Complements Wazuh agent.

- name: Verify eBPF/BTF kernel support for Tetragon
  shell: |
    test -f /sys/kernel/btf/vmlinux && echo "BTF_SUPPORTED" || echo "BTF_MISSING"
  register: btf_check
  changed_when: false
  when: security.tetragon.enabled | default(false)
  tags: ['security', 'tetragon']

- name: Warn if BTF not available for Tetragon
  debug:
    msg: "WARNING: Kernel BTF not available at /sys/kernel/btf/vmlinux. Tetragon requires BTF. Install linux-lts with CONFIG_DEBUG_INFO_BTF=y"
  when:
    - security.tetragon.enabled | default(false)
    - btf_check.stdout is defined
    - "'BTF_MISSING' in btf_check.stdout"
  tags: ['security', 'tetragon']

- name: Set kptr_restrict for Tetragon kprobe support
  sysctl:
    name: kernel.kptr_restrict
    value: '1'
    state: present
    sysctl_set: yes
    reload: yes
  when: security.tetragon.enabled | default(false)
  tags: ['security', 'tetragon']

- name: Create Tetragon directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/compose/tetragon
    - /var/log/tetragon
  when: security.tetragon.enabled | default(false)
  tags: ['security', 'tetragon']

- name: Deploy Tetragon tracing policy
  template:
    src: tetragon-policy.yaml.j2
    dest: /opt/compose/tetragon/tracing-policy.yaml
    mode: '0644'
  when: security.tetragon.enabled | default(false)
  notify: restart tetragon
  tags: ['security', 'tetragon']

- name: Deploy Tetragon container
  containers.podman.podman_container:
    name: tetragon
    image: "quay.io/cilium/tetragon:{{ security.tetragon.version | default('v1.6.0') }}"
    state: started
    network: "{{ podman_network_name | default('enterprise_network') }}"
    memory: 128m
    privileged: true
    pid_mode: host
    cgroupns: host
    env:
      TETRAGON_EXPORT_FILENAME: "/var/log/tetragon/events.json"
      TETRAGON_TRACING_POLICY_DIR: "/etc/tetragon/tetragon.tp.d"
      TETRAGON_SERVER_ADDRESS: "127.0.0.1:54321"
      TETRAGON_LOG_LEVEL: "info"
      TETRAGON_METRICS_SERVER: ":2112"
    volumes:
      - /sys/kernel/btf/vmlinux:/var/lib/tetragon/btf:ro
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - /sys/kernel/debug:/sys/kernel/debug:rw
      - /proc:/proc:ro
      - /var/log/tetragon:/var/log/tetragon:rw
      - /opt/compose/tetragon/tracing-policy.yaml:/etc/tetragon/tetragon.tp.d/policy.yaml:ro
  when: security.tetragon.enabled | default(false)
  tags: ['security', 'tetragon']

# ============================================
# TRIVY (One-shot cron scan — no persistent server)
# Runs as a disposable container via cron, saves ~80MB RAM
# ============================================

- name: Create Trivy scan script (one-shot container mode)
  template:
    src: trivy-scan.sh.j2
    dest: /usr/local/bin/trivy-scan-all
    mode: '0755'
  when: security.trivy.enabled | default(true)
  tags: ['security', 'trivy']

- name: Remove old Trivy server container (migrated to one-shot)
  containers.podman.podman_container:
    name: trivy-scanner
    state: absent
  failed_when: false
  when: security.trivy.enabled | default(true)
  tags: ['security', 'trivy', 'cleanup']

- name: Pull Trivy image for one-shot scans
  containers.podman.podman_image:
    name: "docker.io/aquasec/trivy:{{ security.trivy.version | default('0.68.2') }}"
    state: present
  when: security.trivy.enabled | default(true)
  tags: ['security', 'trivy']

# ============================================
# CROWDSEC (Config only — container in security-infra-pod via shared-services)
# ============================================

- name: Remove old standalone CrowdSec container (migrated to security-infra-pod)
  containers.podman.podman_container:
    name: crowdsec
    state: absent
  failed_when: false
  when: security.crowdsec.enabled | default(false)
  tags: ['security', 'crowdsec', 'cleanup']

- name: Install logrotate
  apk:
    name: logrotate
    state: present
  when: security.crowdsec.enabled | default(false)
  tags: ['security', 'crowdsec', 'logrotate']

- name: Deploy Traefik access log rotation
  template:
    src: traefik-logrotate.j2
    dest: /etc/logrotate.d/traefik
    mode: '0644'
  when: security.crowdsec.enabled | default(false)
  tags: ['security', 'crowdsec', 'logrotate']

# ============================================
# SQUID TRANSPARENT PROXY (Host-level egress control)
# ============================================

- name: Install Squid packages
  apk:
    name:
      - squid
      - squid-openrc
    state: present
  when: security.squid.enabled | default(false)
  tags: ['security', 'squid']

- name: Create Squid SSL directory
  file:
    path: /etc/squid/ssl
    state: directory
    mode: '0750'
    owner: squid
    group: squid
  when: security.squid.enabled | default(false)
  tags: ['security', 'squid']

- name: Generate Squid CA certificate (if not exists)
  shell: |
    if [ ! -f /etc/squid/ssl/squid-ca.pem ]; then
      openssl req -new -newkey rsa:2048 -days 3650 -nodes -x509 \
        -subj "/CN=Squid Transparent Proxy CA" \
        -keyout /etc/squid/ssl/squid-ca-key.pem \
        -out /etc/squid/ssl/squid-ca-cert.pem
      cat /etc/squid/ssl/squid-ca-key.pem /etc/squid/ssl/squid-ca-cert.pem > /etc/squid/ssl/squid-ca.pem
      chown squid:squid /etc/squid/ssl/*
      chmod 640 /etc/squid/ssl/*
    fi
  args:
    creates: /etc/squid/ssl/squid-ca.pem
  when: security.squid.enabled | default(false)
  tags: ['security', 'squid']

- name: Initialize Squid SSL certificate database
  shell: |
    if [ ! -d /var/lib/squid/ssl_db ]; then
      /usr/lib/squid/security_file_certgen -c -s /var/lib/squid/ssl_db -M 4MB
      chown -R squid:squid /var/lib/squid/ssl_db
    fi
  args:
    creates: /var/lib/squid/ssl_db
  when: security.squid.enabled | default(false)
  tags: ['security', 'squid']

- name: Create Squid log directory
  file:
    path: /var/log/squid
    state: directory
    mode: '0755'
    owner: squid
    group: squid
  when: security.squid.enabled | default(false)
  tags: ['security', 'squid']

- name: Deploy Squid configuration
  template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    mode: '0644'
  notify: restart squid
  when: security.squid.enabled | default(false)
  tags: ['security', 'squid']

- name: Deploy Squid egress report script
  template:
    src: squid-report.py.j2
    dest: /usr/local/bin/squid-report
    mode: '0755'
  when: security.squid.enabled | default(false)
  tags: ['security', 'squid']

- name: Enable and start Squid service
  service:
    name: squid
    enabled: yes
    state: started
  when: security.squid.enabled | default(false)
  tags: ['security', 'squid']

# ============================================
# THREAT INTELLIGENCE FEED CHECKER
# ============================================

- name: Deploy threat-feed-checker script
  template:
    src: threat-feed-checker.py.j2
    dest: /usr/local/bin/threat-feed-checker
    mode: '0755'
  tags: ['security', 'threat-feed', 'cron-jobs']

- name: Schedule threat-feed-checker cron (every 15 min)
  cron:
    name: "threat-feed-checker"
    minute: "*/15"
    job: "/usr/bin/python3 /usr/local/bin/threat-feed-checker >> /var/log/threat-feed-checker.log 2>&1"
  tags: ['security', 'threat-feed', 'cron-jobs']

# ============================================
# FAIL2BAN METRICS
# ============================================

- name: Deploy fail2ban-metrics script
  template:
    src: fail2ban-metrics.sh.j2
    dest: /usr/local/bin/fail2ban-metrics
    mode: '0755'
  tags: ['security', 'fail2ban', 'cron-jobs']

- name: Schedule fail2ban-metrics cron (every 5 min)
  cron:
    name: "fail2ban-metrics"
    minute: "*/5"
    job: "/usr/local/bin/fail2ban-metrics > /dev/null 2>&1"
  tags: ['security', 'fail2ban', 'cron-jobs']

# ============================================
# CROWDSEC DAILY REPORT
# ============================================

- name: Create CrowdSec reporting scripts directory
  file:
    path: /opt/scripts
    state: directory
    mode: '0755'
  tags: ['security', 'crowdsec', 'cron-jobs']

- name: Deploy crowdsec-daily-report script
  template:
    src: crowdsec-daily-report.sh.j2
    dest: /opt/scripts/crowdsec-daily-report.sh
    mode: '0755'
  tags: ['security', 'crowdsec', 'cron-jobs']

- name: Schedule crowdsec-daily-report cron (daily 9:00 AM)
  cron:
    name: "crowdsec-daily-report"
    minute: "0"
    hour: "9"
    job: "/opt/scripts/crowdsec-daily-report.sh > /dev/null 2>&1"
  tags: ['security', 'crowdsec', 'cron-jobs']

# ============================================
# SECURITY AUDIT
# ============================================

- name: Create security check script
  template:
    src: security-check.sh.j2
    dest: /usr/local/bin/security-check
    mode: '0755'
  tags: ['security', 'audit']

- name: Run initial security scan
  command: /usr/local/bin/security-check
  register: security_scan
  changed_when: false
  failed_when: false
  tags: ['security', 'audit']

- name: Display security scan results
  debug:
    var: security_scan.stdout_lines
  tags: ['security', 'audit']

- name: Display security stack status
  debug:
    msg:
      - "================================================"
      - "Security Stack Deployment Complete"
      - "================================================"
      - ""
      - "HOST-LEVEL SERVICES:"
      - "  Fail2ban: {{ 'Enabled (protecting SSH)' if security.fail2ban.enabled | default(true) else 'Disabled' }}"
      - "  Firewall: {{ 'Enabled (iptables rules applied)' if security.firewall.enabled | default(true) else 'Disabled' }}"
      - "  Wazuh Agent: {{ 'Installed and running' if security.wazuh.enabled | default(true) else 'Disabled' }}"
      - "  Squid Proxy: {{ 'Enabled (' + security.squid.mode | default('discovery') + ' mode)' if security.squid.enabled | default(false) else 'Disabled' }}"
      - ""
      - "CONTAINERIZED SERVICES (security-pod):"
      - "  Wazuh Indexer: {{ 'Running on port 9200' if security.wazuh.enabled | default(true) else 'Disabled' }}"
      - "  Wazuh Manager: {{ 'Running (API port 55000)' if security.wazuh.enabled | default(true) else 'Disabled' }}"
      - "  Wazuh Dashboard: {{ 'Running on port 5601' if security.wazuh.enabled | default(true) else 'Disabled' }}"
      - "  Trivy Scanner: {{ 'One-shot cron scan (daily 2AM, no persistent server)' if security.trivy.enabled | default(true) else 'Disabled' }}"
      - ""
      - "SECURITY-INFRA-POD (via shared-services):"
      - "  CrowdSec: {{ 'Running in security-infra-pod (LAPI on 8180, metrics on 6060)' if security.crowdsec.enabled | default(false) else 'Disabled' }}"
      - ""
      - "eBPF SECURITY (standalone container):"
      - "  Tetragon: {{ 'Running (eBPF process/file/network monitoring)' if security.tetragon.enabled | default(false) else 'Disabled' }}"
      - ""
      - "ACCESS URLs:"
      - "  Wazuh Dashboard: http://{{ ansible_host }}:5601"
      - "  Wazuh API: https://{{ ansible_host }}:55000"
      - ""
      - "SECURITY SCRIPTS:"
      - "  Trivy scan: /usr/local/bin/trivy-scan-all"
      - "  Security check: /usr/local/bin/security-check"
      - ""
      - "WAZUH AGENT:"
      - "  Status: systemctl status wazuh-agent (or rc-service wazuh-agent status)"
      - "  Config: /var/ossec/etc/ossec.conf"
      - "  Logs: /var/ossec/logs/ossec.log"
      - ""
      - "TETRAGON:"
      - "  Events: /var/log/tetragon/events.json"
      - "  Query: podman exec tetragon tetra getevents -o compact"
      - "  Policy: /opt/compose/tetragon/tracing-policy.yaml"
      - "  Loki: {job=\"tetragon\"}"
      - ""
      - "================================================"
  tags: ['security']
