---
# Security Role Defaults

security:
  fail2ban:
    enabled: true
    bantime: "1h"
    findtime: "10m"
    maxretry: 5
    jail_services:
      - sshd

  wazuh:
    enabled: false  # Resource intensive - enable manually
    version: "4.7.2"

  tetragon:
    enabled: false  # eBPF requires kernel support - enable in all.yml
    version: "v1.6.0"

  trivy:
    enabled: true
    version: "latest"
    scan_on_startup: true

  crowdsec:
    enabled: true
    version: "1.6.4"
    image: "crowdsecurity/crowdsec:v1.6.4"
    collections:
      - crowdsecurity/traefik
      - crowdsecurity/http-cve
      - crowdsecurity/base-http-scenarios
      - crowdsecurity/sshd
      - crowdsecurity/linux

  firewall:
    enabled: true
    allowed_ports:
      - 22     # SSH (all other services accessed via Cloudflare Tunnel)

  squid:
    enabled: false  # Transparent egress proxy — enable manually
    mode: "discovery"  # discovery = log-only, enforcement = whitelist-based blocking
    http_port: 3128
    https_port: 3129
    container_subnet: "REDACTED_CIDR"
    dns_nameserver: "REDACTED_DNS"
