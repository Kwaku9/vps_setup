# Managed by Ansible (roles/security/files/crowdsec/parsers/s02-enrich/).
#
# Drop 403s that Traefik generated itself, so CrowdSec only counts 403s the
# apps actually returned.
#
# A Traefik access-log line with DownstreamStatus 403 and OriginStatus 0 never
# reached a backend: a middleware refused it. Here that is either the CrowdSec
# bouncer itself (an IP that is already banned, or the bouncer failing closed
# while LAPI is unreachable) or the internal-only ipAllowList. Counting those
# turns one refusal into a ban: on 2026-10-22 the bouncer lost LAPI during a
# deploy, 403'd the owner's open Grafana tab ~25 times in two minutes, and
# http-generic-403-bf banned the owner's own IP for 4h.
#
# Real app 403s (OriginStatus 403) still count, so 403 brute-force detection
# against the apps is unchanged.
name: aicortex/traefik-self-403-whitelist
description: "Ignore 403s generated by Traefik middlewares (OriginStatus 0)"
filter: "evt.Meta.log_type == 'http_access-log' && evt.Unmarshaled.traefik != nil"
whitelist:
  reason: "Traefik-generated 403 (middleware refusal, no backend response)"
  expression:
    - "int(evt.Unmarshaled.traefik.DownstreamStatus ?? 0) == 403 && int(evt.Unmarshaled.traefik.OriginStatus ?? 0) == 0"
