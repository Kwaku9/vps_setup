---
# Security Role Handlers (Alpine Linux OpenRC)

- name: restart fail2ban
  # tags: always — a handler without tags is FILTERED OUT by --tags, so a
  # tagged deploy would render new config and never restart the service.
  # 'always' affects filtering only; handlers still run only when notified.
  tags: ['always']
  command: rc-service fail2ban restart

- name: restart sshd
  tags: ['always']
  command: rc-service sshd restart

- name: restart wazuh-agent
  tags: ['always']
  command: rc-service wazuh-agent restart

- name: restart crowdsec
  tags: ['always']
  containers.podman.podman_container:
    name: crowdsec
    state: started
    force_restart: true

- name: restart squid
  tags: ['always']
  service:
    name: squid
    state: restarted

- name: restart tetragon
  tags: ['always']
  containers.podman.podman_container:
    name: tetragon
    state: started
    force_restart: true
  failed_when: false  # Tetragon container may not exist yet on first run
