---
# Frontend Role Defaults
#
# What this role owns:
#   - frontend-pod (nginx, journey-tracker)  — atlas-charts now standalone in roles/trading/
#   - WorldView (geospatial-dashboard) — runs in dev-pod via Vite
#   - Expo Dev Server (aicortex-chat) — runs in dev-pod via Metro bundler
#
# What used to be here but isn't anymore:
#   - ais-relay → roles/backend/ (it's an API service, not a frontend)
#   - ops-dashboard → roles/management/ (runs in management-pod)

deploy_frontend: true

frontend:
  nginx:
    enabled: true
    version: "alpine"
    port: 8080

# WorldView Geospatial Dashboard (geo.aicortex.cloud)
# Source lives at roles/frontend/files/geospatial-dashboard/ and is synced
# to the build context on every deploy.
worldview:
  enabled: true
  container_name: "worldview-dev"
  image: "docker.io/library/node:22-alpine"
  source_dir: "/opt/compose/geospatial-dashboard"
  port: 5173
  memory: "640m"
  node_max_old_space: "448"
  domain: "geo.{{ domain_name }}"

  # Vite dev server config
  vite:
    allowed_hosts: "geo.{{ domain_name }}"
    watch_polling: true
    watch_interval: 1000

# Expo Dev Server (dev.aicortex.cloud) — Metro bundler for the aicortex-chat
# React Native app. Serves the JS bundle to connected Expo dev clients.
# Source lives at roles/frontend/files/aicortex-chat/ and is synced to the
# build/run context on every deploy.
expo_dev:
  enabled: true
  container_name: "expo-dev"
  image: "localhost/expo-dev:latest"
  source_dir: "/opt/compose/aicortex-chat"
  port: 8082
  host_port: 19000
  tailnet_ip: "100.121.252.38"
  tailnet_host: "alpine-vps.taila30e7d.ts.net"
  # Set to either tailnet_ip (no DNS dependency) or tailnet_host (needs MagicDNS on client)
  packager_url_host: "100.121.252.38"
  memory: "3g"
  cpu_shares: 512
  domain: "dev.{{ domain_name }}"
  node_max_old_space: "2048"

# Vault overrides these
worldview_google_maps_api_key: "VAULT_OVERRIDE"
worldview_cesium_ion_token: "VAULT_OVERRIDE"
worldview_opensky_username: "VAULT_OVERRIDE"
worldview_opensky_password: "VAULT_OVERRIDE"
worldview_adsb_api_key: "VAULT_OVERRIDE"
worldview_wigle_api_token: "VAULT_OVERRIDE"
worldview_firms_map_key: "VAULT_OVERRIDE"
worldview_acled_email: "VAULT_OVERRIDE"
worldview_acled_password: "VAULT_OVERRIDE"
worldview_abuseipdb_api_key: "VAULT_OVERRIDE"
worldview_vps_lat: "{{ vault_vps_lat | default('0.0') }}"
worldview_vps_lon: "{{ vault_vps_lon | default('0.0') }}"
