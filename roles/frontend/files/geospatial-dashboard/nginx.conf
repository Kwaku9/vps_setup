server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CrowdSec threat data via VictoriaMetrics
    location /api/threats/ {
        proxy_pass http://monitoring-pod:8428/api/v1/;
        proxy_set_header Host $host;
    }

    # OSINT: ipinfo.io
    location /api/osint/ipinfo/ {
        proxy_pass https://ipinfo.io/;
        proxy_set_header Host ipinfo.io;
        proxy_ssl_server_name on;
    }

    # OSINT: GreyNoise community
    location /api/osint/greynoise/ {
        proxy_pass https://api.greynoise.io/v3/community/;
        proxy_set_header Host api.greynoise.io;
        proxy_ssl_server_name on;
    }

    # OSINT: Cloudflare DoH for reverse DNS
    location /api/osint/rdns {
        proxy_pass https://cloudflare-dns.com/dns-query;
        proxy_set_header Host cloudflare-dns.com;
        proxy_set_header Accept "application/dns-json";
        proxy_ssl_server_name on;
    }

    # OSINT: AbuseIPDB (key injected via env)
    location /api/osint/abuseipdb {
        proxy_pass https://api.abuseipdb.com/api/v2/check;
        proxy_set_header Host api.abuseipdb.com;
        proxy_set_header Key $abuseipdb_key;
        proxy_set_header Accept "application/json";
        proxy_ssl_server_name on;
    }

    # AIS vessel data relay    location /api/ais/ {        proxy_pass http://localhost:9100/;    }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
