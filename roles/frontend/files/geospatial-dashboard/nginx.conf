    # Threat telemetry from a Prometheus-compatible store
    # companion service — absent when running standalone; the layer degrades
    location /api/threats {
        set $wv_upstream http://metrics:8428;
        rewrite ^/api/threats$ /api/v1 break;
        rewrite ^/api/threats/(.*)$ /api/v1/$1 break;
        proxy_pass $wv_upstream;
        proxy_set_header Host metrics:8428;
