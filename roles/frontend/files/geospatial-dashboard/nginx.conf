    # Reverse DNS over Cloudflare DoH
    location /api/osint/rdns {
        set $wv_upstream https://cloudflare-dns.com;
        rewrite ^/api/osint/rdns$ /dns-query break;
        rewrite ^/api/osint/rdns/(.*)$ /dns-query/$1 break;
        proxy_pass $wv_upstream;
        proxy_set_header Host cloudflare-dns.com;
        proxy_ssl_server_name on;
        proxy_set_header Accept "application/dns-json";
    }

    # NASA FIRMS wildfire hotspots (key is in the query string, not a header)
    # requires VITE_FIRMS_MAP_KEY; without it the upstream answers with an error the layer surfaces
    location /api/firms {
        set $wv_upstream https://firms.modaps.eosdis.nasa.gov;
        rewrite ^/api/firms$ / break;
        rewrite ^/api/firms/(.*)$ /$1 break;
        proxy_pass $wv_upstream;
