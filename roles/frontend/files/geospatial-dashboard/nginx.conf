    # WiGLE wireless-network density (rate-limited + cached server-side)
    # Credential is injected here so it never reaches the browser.
    # WIGLE_API_TOKEN is templated into the config at container start (see docker-entrypoint.sh).
    location /api/wigle {
        set $wv_upstream https://api.wigle.net;
        rewrite ^/api/wigle$ / break;
        rewrite ^/api/wigle/(.*)$ /$1 break;
        proxy_pass $wv_upstream;
        proxy_set_header Host api.wigle.net;
        proxy_ssl_server_name on;
