    # GreyNoise community IP reputation
    location /api/osint/greynoise {
        set $wv_upstream https://api.greynoise.io;
        rewrite ^/api/osint/greynoise$ /v3/community break;
        rewrite ^/api/osint/greynoise/(.*)$ /v3/community/$1 break;
        proxy_pass $wv_upstream;
