---
# Frontend Role - Nginx Web Server + Static Apps
# Deploys web services, landing page, atlas-charts, and journey-tracker

- name: Create frontend pod
  containers.podman.podman_pod:
    name: frontend-pod
    network: "{{ podman_network_name | default('enterprise_network') }}"
    state: started
    ports:
      - "127.0.0.1:8081:80"      # Nginx landing page
      - "127.0.0.1:3080:3080"    # Atlas Charts
  when: deploy_frontend | default(true)
  tags: ['frontend', 'pod']

# ── Nginx Landing Page ──

- name: Create Nginx configuration
  template:
    src: nginx.conf.j2
    dest: /opt/compose/nginx.conf
    mode: '0644'
  when:
    - deploy_frontend | default(true)
    - frontend.nginx.enabled | default(true)
  tags: ['frontend', 'nginx']

- name: Create landing page HTML
  template:
    src: index.html.j2
    dest: /opt/compose/index.html
    mode: '0644'
  when:
    - deploy_frontend | default(true)
    - frontend.nginx.enabled | default(true)
  tags: ['frontend', 'nginx']

- name: Deploy Nginx container
  containers.podman.podman_container:
    name: nginx
    image: "docker.io/library/nginx:{{ frontend.nginx.version | default('alpine') }}"
    state: started
    pod: frontend-pod
    memory: "128m"
    cpu_shares: 512
    volumes:
      - /opt/compose/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/compose/index.html:/usr/share/nginx/html/index.html:ro
  when:
    - deploy_frontend | default(true)
    - frontend.nginx.enabled | default(true)
  tags: ['frontend', 'nginx']

# ── Atlas Charts ──

- name: Deploy Atlas Charts container
  containers.podman.podman_container:
    name: atlas-charts
    image: "{{ frontend.atlas_charts.image | default('ghcr.io/atlas-charts/atlas-charts:latest') }}"
    state: started
    pod: frontend-pod
    memory: "64m"
    cpu_shares: 512
    restart_policy: unless-stopped
  when:
    - deploy_frontend | default(true)
    - frontend.atlas_charts.enabled | default(false)
  tags: ['frontend', 'atlas-charts']

# ── Journey Tracker ──

- name: Deploy Journey Tracker container
  containers.podman.podman_container:
    name: journey-tracker
    image: "{{ frontend.journey_tracker.image | default('nginx:alpine') }}"
    state: started
    pod: frontend-pod
    memory: "32m"
    cpu_shares: 512
    volumes:
      - /opt/podman-data/journey-tracker:/usr/share/nginx/html:ro
    restart_policy: unless-stopped
  when:
    - deploy_frontend | default(true)
    - frontend.journey_tracker.enabled | default(false)
  tags: ['frontend', 'journey-tracker']

- name: Display frontend status
  debug:
    msg:
      - "Frontend pod deployed:"
      - "  Nginx: http://{{ ansible_host }}:8081"
      - "  Atlas Charts: http://{{ ansible_host }}:3080"
  when: deploy_frontend | default(true)
  tags: ['frontend']

# WorldView Geospatial Dashboard (Vite dev with HMR)
- name: Build WorldView container image
  containers.podman.podman_image:
    name: "{{ frontend.worldview.image }}"
    path: "{{ frontend.worldview.source_path }}"
    build:
      target: dev
    force: "{{ mcp_build.force_rebuild | default(false) }}"
  when:
    - deploy_frontend | default(true)
    - frontend.worldview.enabled | default(false)
    - frontend.worldview.build | default(true)
  tags: ['frontend', 'worldview']

- name: Deploy WorldView container
  containers.podman.podman_container:
    name: "{{ frontend.worldview.name }}"
    image: "{{ frontend.worldview.image }}"
    state: started
    network: "{{ podman_network_name | default('enterprise_network') }}"
    restart_policy: unless-stopped
    volumes:
      - "{{ frontend.worldview.source_path }}:/app:Z"
      - "{{ frontend.worldview.source_path }}/.env:/app/.env:ro,Z"
    env:
      NODE_ENV: "development"
    memory: "512m"
  when:
    - deploy_frontend | default(true)
    - frontend.worldview.enabled | default(false)
  tags: ['frontend', 'worldview']

- name: Check if WorldView vite config changed
  stat:
    path: "{{ frontend.worldview.source_path }}/vite.config.ts"
  register: worldview_vite_config
  when:
    - deploy_frontend | default(true)
    - frontend.worldview.enabled | default(false)
  tags: ['frontend', 'worldview']

- name: Restart WorldView to pick up proxy and env changes
  command: podman restart {{ frontend.worldview.name }}
  register: worldview_restart
  changed_when: worldview_restart.rc == 0
  failed_when: false
  when:
    - deploy_frontend | default(true)
    - frontend.worldview.enabled | default(false)
  tags: ['frontend', 'worldview']

- name: Display WorldView status
  debug:
    msg: "WorldView dashboard deployed at http://{{ frontend.worldview.name }}:{{ frontend.worldview.port }} (routed via Traefik at geo.{{ domain_name | default('example.com') }})"
  when:
    - deploy_frontend | default(true)
    - frontend.worldview.enabled | default(false)
  tags: ['frontend', 'worldview']
