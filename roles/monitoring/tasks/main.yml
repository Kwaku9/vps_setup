---
# Monitoring Role - Prometheus, Grafana, Loki, Tempo, Alloy Stack
# Deploys observability infrastructure with unified telemetry collection

- name: Create monitoring pod
  containers.podman.podman_pod:
    name: monitoring-pod
    network: "{{ podman_network_name | default('enterprise_network') }}"
    state: started
    ports:
      - "127.0.0.1:3000:3000"    # Grafana (internal - SSH tunnel)
      - "127.0.0.1:5000:5000"    # CheckMK (internal - SSH tunnel)
      - "127.0.0.1:9090:9090"    # Prometheus (internal - SSH tunnel)
      - "127.0.0.1:9100:9100"    # Node Exporter (internal)
      - "127.0.0.1:3200:3100"    # Loki (internal)
      - "127.0.0.1:4318:4318"    # Tempo OTLP HTTP (internal)
  when: monitoring.enabled | default(true)
  tags: ['monitoring', 'pod']

- name: Create Prometheus configuration
  template:
    src: prometheus.yml.j2
    dest: /opt/compose/prometheus.yml
    mode: '0644'
  when: monitoring.prometheus.enabled | default(true)
  tags: ['monitoring', 'prometheus']

- name: Deploy Prometheus container
  containers.podman.podman_container:
    name: prometheus
    image: "docker.io/prom/prometheus:{{ monitoring.prometheus.version | default('latest') }}"
    state: started
    pod: monitoring-pod
    memory: "{{ monitoring.prometheus.memory | default('512m') }}"
    volumes:
      - /opt/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/compose/prometheus-rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      --storage.tsdb.retention.time={{ monitoring.prometheus.retention | default('15d') }}
      --web.enable-remote-write-receiver
  when:
    - monitoring.enabled | default(true)
    - monitoring.prometheus.enabled | default(true)
  tags: ['monitoring', 'prometheus']

- name: Create Grafana datasources configuration
  template:
    src: grafana-datasources.yml.j2
    dest: /opt/compose/grafana-datasources.yml
    mode: '0644'
  when: monitoring.grafana.enabled | default(true)
  tags: ['monitoring', 'grafana']

- name: Create Grafana dashboards configuration
  template:
    src: grafana-dashboards.yml.j2
    dest: /opt/compose/grafana-dashboards.yml
    mode: '0644'
  when: monitoring.grafana.enabled | default(true)
  tags: ['monitoring', 'grafana']

- name: Deploy Grafana container
  containers.podman.podman_container:
    name: grafana
    image: "docker.io/grafana/grafana:{{ monitoring.grafana.version | default('latest') }}"
    state: started
    pod: monitoring-pod
    env:
      GF_SECURITY_ADMIN_USER: "{{ monitoring.grafana.admin_user | default('admin') }}"
      GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_password }}"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana-data:/var/lib/grafana
      - /opt/compose/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - /opt/compose/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
  when:
    - monitoring.enabled | default(true)
    - monitoring.grafana.enabled | default(true)
  tags: ['monitoring', 'grafana']

- name: Deploy Node Exporter container
  containers.podman.podman_container:
    name: node-exporter
    image: "docker.io/prom/node-exporter:{{ monitoring.node_exporter.version | default('latest') }}"
    state: started
    pod: monitoring-pod
    command: >
      --path.procfs=/host/proc
      --path.sysfs=/host/sys
      --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
  when:
    - monitoring.enabled | default(true)
    - monitoring.node_exporter.enabled | default(true)
  tags: ['monitoring', 'node-exporter']

- name: Create Grafana Alloy configuration
  template:
    src: alloy-config.alloy.j2
    dest: /opt/compose/alloy-config.alloy
    mode: '0644'
  when: monitoring.alloy.enabled | default(true)
  tags: ['monitoring', 'alloy']

- name: Deploy Grafana Alloy container
  containers.podman.podman_container:
    name: alloy
    image: "docker.io/grafana/alloy:{{ monitoring.alloy.version | default('latest') }}"
    state: started
    pod: monitoring-pod
    command: >
      run
      --server.http.listen-addr=0.0.0.0:12345
      --storage.path=/var/lib/alloy/data
      /etc/alloy/config.alloy
    volumes:
      - /opt/compose/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/log:/var/log:ro
      - /var/run/podman/podman.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    privileged: yes
  when:
    - monitoring.enabled | default(true)
    - monitoring.alloy.enabled | default(true)
  tags: ['monitoring', 'alloy']

- name: Create Tempo configuration
  template:
    src: tempo-config.yml.j2
    dest: /opt/compose/tempo-config.yml
    mode: '0644'
  when: monitoring.tempo.enabled | default(true)
  tags: ['monitoring', 'tempo']

- name: Deploy Grafana Tempo container
  containers.podman.podman_container:
    name: tempo
    image: "docker.io/grafana/tempo:{{ monitoring.tempo.version | default('latest') }}"
    state: started
    pod: monitoring-pod
    memory: "{{ monitoring.tempo.memory | default('768m') }}"
    command: "-config.file=/etc/tempo/tempo.yml"
    volumes:
      - /opt/compose/tempo-config.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
  when:
    - monitoring.enabled | default(true)
    - monitoring.tempo.enabled | default(true)
  tags: ['monitoring', 'tempo']

- name: Create Loki configuration
  template:
    src: loki-config.yml.j2
    dest: /opt/compose/loki-config.yml
    mode: '0644'
  when: monitoring.loki.enabled | default(true)
  tags: ['monitoring', 'loki']

- name: Deploy Loki container
  containers.podman.podman_container:
    name: loki
    image: "docker.io/grafana/loki:{{ monitoring.loki.version | default('latest') }}"
    state: started
    pod: monitoring-pod
    volumes:
      - /opt/compose/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: "-config.file=/etc/loki/local-config.yaml"
  when:
    - monitoring.enabled | default(true)
    - monitoring.loki.enabled | default(true)
  tags: ['monitoring', 'loki']

- name: Deploy CheckMK container
  containers.podman.podman_container:
    name: checkmk
    image: "{{ monitoring.checkmk.image | default('checkmk/check-mk-raw:2.3.0-daily') }}"
    state: started
    pod: monitoring-pod
    env:
      CMK_SITE_ID: "{{ monitoring.checkmk.site_name | default('cmk') }}"
    volumes:
      - checkmk-data:/omd/sites
    tmpfs:
      "/opt/omd/sites/{{ monitoring.checkmk.site_name | default('cmk') }}/tmp": "rw,noexec,nosuid,size=1g"
  when:
    - monitoring.enabled | default(true)
    - monitoring.checkmk.enabled | default(true)
  tags: ['monitoring', 'checkmk']

- name: Display monitoring stack status
  debug:
    msg:
      - "Monitoring stack deployed successfully"
      - "  Components: Prometheus, Grafana, Loki, Tempo, Alloy, Node Exporter, CheckMK"
      - ""
      - "Access URLs:"
      - "  Grafana: http://{{ ansible_host }}:3000"
      - "  Prometheus: http://{{ ansible_host }}:9090"
      - "  Tempo (OTLP HTTP): http://{{ ansible_host }}:4318"
      - "  CheckMK: http://{{ ansible_host }}:5000/{{ monitoring.checkmk.site_name | default('cmk') }}"
      - ""
      - "Note: Loki (port 3200), Alloy (internal), and Node Exporter (port 9100) are accessible within the pod"
  when: monitoring.enabled | default(true)
  tags: ['monitoring']
