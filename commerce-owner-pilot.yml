---
- name: Assign first named owner to a separate synthetic shared pilot
  hosts: alpine_servers
  gather_facts: false
  tasks:
    - name: Require the explicitly selected sign-in email
      ansible.builtin.assert:
        that: commerce_owner_email is defined
    - name: Create or reuse only the synthetic named-owner pilot and assign local access
      ansible.builtin.command:
        argv: [podman, exec, -i, commerce-dev, python, '-']
        stdin: |
          import json,os,urllib.request
          def call(path,data=None):
              req=urllib.request.Request('http://127.0.0.1:8788'+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['ADMIN_TOKEN'],'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=15) as r:return json.load(r)
          assert call('/api/auth-info')['named_sign_in_enabled']
          name='Named owner onboarding pilot (synthetic)'
          existing=[m for m in call('/api/merchants') if m['name']==name]
          assert len(existing)<=1
          m=existing[0] if existing else call('/api/onboarding/merchants',{'name':name,'domain':'example.com'})
          assert m.get('access_mode')=='named' and m['domain']=='example.com' and not m.get('published')
          address={{ commerce_owner_email | to_json }}
          accounts=[a for a in call('/api/accounts') if a['email']==address.lower()]
          if accounts:
              assert len(accounts)==1 and accounts[0]['role']=='merchant-owner' and accounts[0]['merchant']==m['id'] and accounts[0]['enabled']
          else:call('/api/accounts',{'action':'invite','email':address,'role':'merchant-owner','merchant':m['id']})
          print('PASS synthetic named-owner pilot assigned; production untouched, preview inactive, no email sent')
      changed_when: false
      no_log: true
    - name: Report pilot assignment without identity or credential values
      ansible.builtin.debug:
        msg: Synthetic named-owner pilot assigned. Use the existing Cloudflare sign-in; no email was sent.
