# ============================================================
# DEPRECATED - Superseded by roles/ai-stack/ Ansible role
# This file is kept for reference only. The Ansible role
# (roles/ai-stack/) is now the source of truth for Open WebUI
# and related service deployment.
# See: ansible-playbook site.yml --tags "ai-stack"
# ============================================================

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui-ollama
    ports:
      - "3000:8080"
    volumes:
      - ollama:/root/.ollama
      - open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - WEBUI_AUTH=False
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - litellm

  bolt-ai:
    image: bolt-ai:production
    build:
      context: ../newbolt
      dockerfile: Dockerfile
      target: bolt-ai-production
    container_name: bolt-ai-production
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - COMPOSE_PROFILES=production
      - PORT=5173
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HuggingFace_API_KEY=${HuggingFace_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPEN_ROUTER_API_KEY=${OPEN_ROUTER_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - OLLAMA_API_BASE_URL=http://127.0.0.1:11434
      - XAI_API_KEY=${XAI_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - TOGETHER_API_BASE_URL=${TOGETHER_API_BASE_URL}
      - AWS_BEDROCK_CONFIG=${AWS_BEDROCK_CONFIG}
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-debug}
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: pnpm run dockerstart
    restart: always

  fabric-api:
    build:
      context: ../fabric
      dockerfile: Dockerfile
    container_name: fabric-api
    working_dir: /app
    volumes:
      - ../fabric:/app
      - fabric_config:/root/.config/fabric
    # Default CMD from Dockerfile will be used: --serve --address 0.0.0.0:8080
    ports:
      - "8080:8080"
    restart: always

  fabric-web-ui:
    build:
      context: ../fabric/web
      dockerfile: Dockerfile
    container_name: fabric-web-ui
    ports:
      - "3030:3000"
    environment:
      - FABRIC_API_URL=http://fabric-api:8080
      - FABRIC_BASE_URL=http://fabric-api:8080
      - NODE_ENV=development
    depends_on:
      - fabric-api
    restart: always
    stdin_open: true
    tty: true

  litellm:
    image: ghcr.io/berriai/litellm-database:main-latest
    container_name: litellm
    env_file:
      - .env
    ports:
      - "4000:4000"
    volumes:
      - ./config.yml:/app/config.yaml
    command: --config /app/config.yaml --port 4000 --host 0.0.0.0
    restart: always
    environment:
      DATABASE_URL: "postgresql://REDACTED_USER:REDACTED_PASSWORD@db:5432/litellm"
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost', 4000)); s.close()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: litellm-db
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: REDACTED_USER
      POSTGRES_PASSWORD: REDACTED_PASSWORD
      POSTGRES_MULTIPLE_DATABASES: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U REDACTED_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_DATABASE_TYPE=postgresdb
      - N8N_DATABASE_HOST=db
      - N8N_DATABASE_PORT=5432
      - N8N_DATABASE_NAME=n8n
      - N8N_DATABASE_USER=n8n_user
      - N8N_DATABASE_PASSWORD=REDACTED_PASSWORD
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=REDACTED_PASSWORD
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
      - C:\Users\swirl\PycharmProjects\ScrapyExtractor:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro-tts
    ports:
      - "8880:8880"
    restart: always

volumes:
  open-webui: 
  ollama: 
  postgres_data: 
  fabric_config: 
  n8n_data: 
