name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.claude/**'
      - 'screenshots/**'
      - 'labguide-*'
      - 'slides-ocr/**'
      - 'text-extracts/**'
      - '*.png'
      - '*.jpg'
      - '*.csv'
      - 'profiles.yml'
      - '.github/**'

  workflow_dispatch:
    inputs:
      tags:
        description: 'Ansible tags (comma-separated, or "all")'
        required: false
        default: ''
      check_mode:
        description: 'Dry run (--check --diff)'
        required: false
        type: boolean
        default: false
      skip_approval:
        description: 'Skip Telegram approval (for urgent fixes)'
        required: false
        type: boolean
        default: false

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      tags: ${{ steps.map.outputs.tags }}
      should_deploy: ${{ steps.map.outputs.should_deploy }}
    steps:
      - name: Detect changed files and map to Ansible tags
        id: map
        run: |
          # For workflow_dispatch with explicit tags
          if [ -n "${{ github.event.inputs.tags }}" ]; then
            echo "tags=${{ github.event.inputs.tags }}" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get changed files
          CHANGED=$(ssh -o StrictHostKeyChecking=no root@localhost \
            "cd /workspace/vscode-projects/vps_setup && \
             git fetch origin main && \
             git diff --name-only HEAD origin/main 2>/dev/null" || echo "")

          if [ -z "$CHANGED" ]; then
            # Fallback: diff against previous commit
            CHANGED=$(ssh -o StrictHostKeyChecking=no root@localhost \
              "cd /workspace/vscode-projects/vps_setup && \
               git log --name-only --pretty=format: -1 origin/main" || echo "")
          fi

          TAGS=""

          add_tag() {
            local tag="$1"
            if [[ ! ",$TAGS," == *",$tag,"* ]]; then
              TAGS="${TAGS:+$TAGS,}$tag"
            fi
          }

          for file in $CHANGED; do
            case "$file" in
              roles/base/*)                 add_tag "base" ;;
              roles/container-runtime/*)    add_tag "container-runtime" ;;
              roles/cloudflared/*)          add_tag "cloudflared" ;;
              roles/cloudflare/*)           add_tag "cloudflare" ;;
              roles/shared-services/*)      add_tag "shared-services" ;;
              roles/management/*)           add_tag "management" ;;
              roles/monitoring/*)           add_tag "monitoring" ;;
              roles/security/*)             add_tag "security" ;;
              roles/authentication/*)       add_tag "authentication" ;;
              roles/ai-stack/*)             add_tag "ai-stack" ;;
              roles/trading/*)              add_tag "trading" ;;
              roles/journey-tracker/*)      add_tag "journey-tracker" ;;
              roles/frontend/*)             add_tag "frontend" ;;
              roles/worldview/*)            add_tag "frontend" ;;
              roles/backend/*)              add_tag "backend" ;;
              roles/backup/*)              add_tag "backup" ;;
              roles/claude-prep/*)          add_tag "claude-prep" ;;
              roles/mcp-servers/*)          add_tag "mcp-servers" ;;
              roles/gemini-prep/*)          add_tag "gemini-prep" ;;
              roles/github-runner/*)        add_tag "github-runner" ;;
              dashboards/*)                 add_tag "monitoring" ;;
              all.yml)                      TAGS="all" ;;
              site.yml)                     TAGS="all" ;;
              templates/*)                  TAGS="all" ;;
              group_vars/*)                 TAGS="all" ;;
              *)                            ;; # Skip unknown files
            esac
            [ "$TAGS" = "all" ] && break
          done

          if [ -z "$TAGS" ]; then
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "tags=" >> $GITHUB_OUTPUT
            echo "::notice::No deployable files changed. Skipping."
          else
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "tags=$TAGS" >> $GITHUB_OUTPUT
            echo "::notice::Detected tags: $TAGS"
          fi

  approve:
    needs: detect-changes
    if: needs.detect-changes.outputs.should_deploy == 'true'
    runs-on: self-hosted
    timeout-minutes: 12
    outputs:
      approved: ${{ steps.wait.outputs.approved }}
    steps:
      - name: Check if approval should be skipped
        id: skip_check
        run: |
          if [ "${{ github.event.inputs.skip_approval }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Approval skipped (manual override)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Request Telegram approval
        id: request
        if: steps.skip_check.outputs.skip == 'false'
        run: |
          TAGS="${{ needs.detect-changes.outputs.tags }}"
          COMMIT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_MSG=$(ssh -o StrictHostKeyChecking=no root@localhost \
            "cd /workspace/vscode-projects/vps_setup && \
             git log -1 --pretty=format:'%s' origin/main 2>/dev/null" || echo "unknown")

          CHECK_MODE="${{ github.event.inputs.check_mode }}"
          MODE_LABEL=""
          [ "$CHECK_MODE" = "true" ] && MODE_LABEL=" [DRY RUN]"

          PROMPT="🔔 Deploy Approval Required${MODE_LABEL}\n\nTags: ${TAGS}\nCommit: ${COMMIT_SHA}\nMessage: ${COMMIT_MSG}\n\nApprove this deployment?"

          RESPONSE=$(curl -sf -X POST http://localhost:7555/request_approval \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": 8520366373,
              \"prompt_text\": \"${PROMPT}\",
              \"metadata\": {
                \"tool_name\": \"GitHubDeploy\",
                \"hook_event\": \"deploy\",
                \"session_id\": \"gha-${GITHUB_RUN_ID}\",
                \"tags\": \"${TAGS}\",
                \"commit\": \"${COMMIT_SHA}\"
              }
            }")

          APPROVAL_ID=$(echo "$RESPONSE" | jq -r '.approval_id // empty')

          if [ -z "$APPROVAL_ID" ]; then
            echo "::error::Failed to create approval request"
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "approval_id=$APPROVAL_ID" >> $GITHUB_OUTPUT
          echo "::notice::Approval requested (ID: $APPROVAL_ID). Waiting for Telegram response..."

      - name: Wait for approval decision
        id: wait
        if: steps.skip_check.outputs.skip == 'false'
        run: |
          APPROVAL_ID="${{ steps.request.outputs.approval_id }}"
          MAX_WAIT=600  # 10 minutes
          POLL_INTERVAL=5
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            RESPONSE=$(curl -sf "http://localhost:7555/get_approval_status?approval_id=${APPROVAL_ID}" || echo '{"status":"error"}')
            STATUS=$(echo "$RESPONSE" | jq -r '.status // "error"')

            case "$STATUS" in
              approved)
                echo "::notice::Deployment APPROVED via Telegram"
                echo "approved=true" >> $GITHUB_OUTPUT
                exit 0
                ;;
              denied)
                echo "::warning::Deployment DENIED via Telegram"
                echo "approved=false" >> $GITHUB_OUTPUT
                exit 0
                ;;
              expired)
                echo "::warning::Approval request expired"
                echo "approved=false" >> $GITHUB_OUTPUT
                exit 0
                ;;
              pending)
                sleep $POLL_INTERVAL
                ELAPSED=$((ELAPSED + POLL_INTERVAL))
                ;;
              *)
                echo "::error::Unexpected status: $STATUS"
                sleep $POLL_INTERVAL
                ELAPSED=$((ELAPSED + POLL_INTERVAL))
                ;;
            esac
          done

          echo "::warning::Approval timed out after ${MAX_WAIT}s"
          echo "approved=false" >> $GITHUB_OUTPUT

      - name: Set approved output (skip mode)
        id: skip_approved
        if: steps.skip_check.outputs.skip == 'true'
        run: echo "approved=true" >> $GITHUB_OUTPUT

      - name: Combine approval result
        id: final
        run: |
          if [ "${{ steps.skip_check.outputs.skip }}" = "true" ]; then
            echo "approved=true" >> $GITHUB_OUTPUT
          else
            echo "approved=${{ steps.wait.outputs.approved }}" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: [detect-changes, approve]
    if: needs.approve.outputs.approved == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Notify deploy start (Telegram)
        run: |
          TAGS="${{ needs.detect-changes.outputs.tags }}"
          CHECK_MODE="${{ github.event.inputs.check_mode }}"
          MODE_LABEL=""
          [ "$CHECK_MODE" = "true" ] && MODE_LABEL=" [DRY RUN]"

          COMMIT_SHA="${GITHUB_SHA:0:7}"

          curl -sf -X POST http://localhost:7555/send_message \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": 8520366373,
              \"text\": \"🚀 Deploy starting${MODE_LABEL}\nTags: ${TAGS}\nCommit: ${COMMIT_SHA}\"
            }" || echo "::warning::Telegram notification failed (non-fatal)"
        continue-on-error: true

      - name: Pull latest code on VPS
        run: |
          ssh -o StrictHostKeyChecking=no root@localhost \
            "cd /workspace/vscode-projects/vps_setup && \
             git fetch origin main && \
             git reset --hard origin/main && \
             git-crypt unlock /root/.git-crypt-key 2>/dev/null || true"

      - name: Run Ansible playbook
        id: ansible
        run: |
          TAGS="${{ needs.detect-changes.outputs.tags }}"
          CHECK_MODE="${{ github.event.inputs.check_mode }}"

          EXTRA_ARGS=""
          [ "$CHECK_MODE" = "true" ] && EXTRA_ARGS="--check --diff"

          if [ "$TAGS" = "all" ]; then
            TAG_ARGS=""
          else
            TAG_ARGS="--tags $TAGS"
          fi

          ssh -o StrictHostKeyChecking=no root@localhost \
            "podman exec ansible-deployment \
             ansible-playbook -i /ansible/inventory/hosts /ansible/site.yml \
               $TAG_ARGS $EXTRA_ARGS \
               2>&1" | tee /tmp/ansible-output.log

          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Notify deploy success (Telegram)
        if: success()
        run: |
          TAGS="${{ needs.detect-changes.outputs.tags }}"
          COMMIT_SHA="${GITHUB_SHA:0:7}"

          RECAP=$(tail -20 /tmp/ansible-output.log | grep -A5 "PLAY RECAP" | head -6 || echo "No recap available")

          curl -sf -X POST http://localhost:7555/send_message \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": 8520366373,
              \"text\": \"✅ Deploy succeeded\nTags: ${TAGS}\nCommit: ${COMMIT_SHA}\n\n${RECAP}\"
            }" || true
        continue-on-error: true

      - name: Notify deploy failure (Telegram)
        if: failure()
        run: |
          TAGS="${{ needs.detect-changes.outputs.tags }}"
          COMMIT_SHA="${GITHUB_SHA:0:7}"

          ERROR_CONTEXT=$(tail -30 /tmp/ansible-output.log 2>/dev/null | head -20 || echo "No output captured")

          curl -sf -X POST http://localhost:7555/send_message \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": 8520366373,
              \"text\": \"❌ Deploy FAILED\nTags: ${TAGS}\nCommit: ${COMMIT_SHA}\n\nLast output:\n${ERROR_CONTEXT}\"
            }" || true
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: rm -f /tmp/ansible-output.log

  denied:
    needs: [detect-changes, approve]
    if: needs.approve.outputs.approved == 'false'
    runs-on: self-hosted
    steps:
      - name: Notify deploy denied (Telegram)
        run: |
          TAGS="${{ needs.detect-changes.outputs.tags }}"
          COMMIT_SHA="${GITHUB_SHA:0:7}"

          curl -sf -X POST http://localhost:7555/send_message \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": 8520366373,
              \"text\": \"🚫 Deploy skipped (denied/timed out)\nTags: ${TAGS}\nCommit: ${COMMIT_SHA}\"
            }" || true
        continue-on-error: true

      - name: Fail workflow
        run: |
          echo "::error::Deployment was denied or timed out"
          exit 1
