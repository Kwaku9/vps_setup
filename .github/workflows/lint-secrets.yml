# The secrets lint as CI, not just a local hook.
#
# scripts/install-hooks.sh has existed for a while and wires lint-secrets +
# lint-pods as pre-commit. It had never been run in this clone, so the guard was
# inert: that is how a plaintext tailnet hostname reached this PUBLIC repo
# (audited 2026-10-01). A local hook is opt-in per clone and per machine, so it
# cannot be the only line of defence. This job runs regardless.
#
# Runs on a GitHub-hosted runner (there is no self-hosted runner): this needs no
# estate access, no git-crypt key, and no secrets. `git check-attr` reports the
# git-crypt filter without the key, so encrypted files are correctly skipped even
# though their contents are unreadable here.
name: lint-secrets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is not needed: the lint reads the worktree. A shallow
          # clone keeps this fast.
          fetch-depth: 1
      # --all, not the staged-diff default: CI has nothing staged, and the
      # default would report "OK" by scanning zero files, which reads as a pass
      # and is not one.
      - name: Scan every tracked file in unencrypted paths
        run: bash scripts/lint-secrets.sh --all
