---
- name: Revoke and rotate leaked commerce development credentials
  hosts: alpine_servers
  gather_facts: false
  tasks:
    - name: Rotate database credentials without logging secrets
      ansible.builtin.command:
        argv: [podman, exec, -i, commerce-dev, python, '-']
        stdin: "{{ lookup('file', '../aicortex-commerce/ansible/rotate_credentials.py') }}"
      register: rotated
      no_log: true
    - name: Stop process holding the leaked operator credential
      ansible.builtin.command: podman stop commerce-dev
    - name: Replace operator environment file
      ansible.builtin.copy:
        dest: /opt/aicortex-commerce-dev/secret.env
        content: "ADMIN_TOKEN={{ (rotated.stdout | from_json).operator }}\n"
        owner: root
        group: root
        mode: '0600'
      no_log: true
    - name: Save fresh operator credential privately on workstation
      ansible.builtin.copy:
        dest: '{{ playbook_dir }}/../aicortex-commerce/.access-token'
        content: "{{ (rotated.stdout | from_json).operator }}\n"
        mode: '0600'
      delegate_to: localhost
      no_log: true
    - name: Save fresh acceptance shopper credential privately on workstation
      ansible.builtin.copy:
        dest: '{{ playbook_dir }}/../aicortex-commerce/.shopper-acceptance-token'
        content: "{{ (rotated.stdout | from_json).shopper }}\n"
        mode: '0600'
      delegate_to: localhost
      no_log: true
    - name: Report revocation counts without credentials
      ansible.builtin.debug:
        msg:
          revoked_owner_tokens: '{{ (rotated.stdout | from_json).revoked_owners }}'
          revoked_shopper_tokens: '{{ (rotated.stdout | from_json).revoked_shoppers }}'
          rotated_legacy_keys: '{{ (rotated.stdout | from_json).rotated_legacy }}'
- name: Recreate listeners with fresh credentials
  ansible.builtin.import_playbook: commerce-dev.yml
  vars:
    commerce_force_recreate: true
    commerce_public_mcp_enabled: true
