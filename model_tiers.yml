# Model Tier Assignments
# =====================
# Single source of truth for model visibility in OpenWebUI.
#
# Tier auto-assignment based on input cost per million tokens:
#   free  — $0.30/M and below
#   paid  — $0.31/M to $2.99/M
#   admin — $3.00/M and above
#   none  — hidden from all non-admin users (duplicates, legacy, etc.)
#
# IMPORTANT: is_active / active flag is BROKEN in Open WebUI (known upstream bug).
# To hide models from a tier's dropdown, move them to a higher tier instead.
# Example: change tier from 'free' to 'paid' to hide from free_users group.
#
# Override: set tier_override to force a tier regardless of price.
# Admins always see ALL models regardless of tier assignment.
#
# To change model visibility: edit tier values and redeploy with:
#   ansible-playbook -i inventory/hosts site.yml --tags openwebui-setup
#
# Prices are input cost per million tokens (USD).
# The 'id' must match the model_name in litellm-config.yml.j2 or LiteLLM DB.

