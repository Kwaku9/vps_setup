---
# Setup Podman Socket Service for Container Auto-Discovery
# This enables Traefik and other tools to query Podman via API

- name: Configure Podman Socket Service
  hosts: alpine_servers
  become: true
  gather_facts: true

  tasks:
    - name: Create OpenRC service for Podman socket
      copy:
        dest: /etc/init.d/podman-socket
        mode: '0755'
        content: |
          #!/sbin/openrc-run

          name="Podman API Socket"
          description="Podman API Socket for container management and auto-discovery"

          command="/usr/bin/podman"
          command_args="system service --time=0 unix:///run/podman/podman.sock"
          command_background=true
          pidfile="/run/podman-socket.pid"

          depend() {
              need net
              after podman
          }

          start_pre() {
              # Create socket directory with correct permissions
              mkdir -p /run/podman
              chmod 755 /run/podman

              # Clean up stale socket if exists
              if [ -S /run/podman/podman.sock ]; then
                  einfo "Removing stale socket"
                  rm -f /run/podman/podman.sock
              fi
          }

          start_post() {
              # Wait for socket to be created
              local timeout=10
              local count=0
              while [ ! -S /run/podman/podman.sock ] && [ $count -lt $timeout ]; do
                  sleep 1
                  count=$((count + 1))
              done

              if [ -S /run/podman/podman.sock ]; then
                  # Set socket permissions (world-readable for container access)
                  chmod 666 /run/podman/podman.sock
                  einfo "Podman socket ready at /run/podman/podman.sock"
              else
                  eerror "Podman socket failed to start"
                  return 1
              fi
          }

          stop_post() {
              # Clean up socket file
              rm -f /run/podman/podman.sock
          }

    - name: Enable Podman socket service at boot
      service:
        name: podman-socket
        enabled: yes

    - name: Stop existing Podman socket (if running)
      service:
        name: podman-socket
        state: stopped
      failed_when: false

    - name: Start Podman socket service
      service:
        name: podman-socket
        state: started
      register: socket_started

    - name: Wait for socket to be ready
      wait_for:
        path: /run/podman/podman.sock
        timeout: 10
      when: socket_started.changed

    - name: Verify socket exists and has correct permissions
      stat:
        path: /run/podman/podman.sock
      register: socket_stat

    - name: Display socket status
      debug:
        msg:
          - "============================================"
          - "Podman Socket Service Status"
          - "============================================"
          - "Socket exists: {{ socket_stat.stat.exists }}"
          - "Socket type: {{ 'Unix socket' if socket_stat.stat.issock else 'Not a socket' }}"
          - "Permissions: {{ socket_stat.stat.mode if socket_stat.stat.exists else 'N/A' }}"
          - "Path: /run/podman/podman.sock"
          - "============================================"

    - name: Test Podman API via socket
      shell: |
        podman --remote --url unix:///run/podman/podman.sock version --format json
      register: podman_api_test
      changed_when: false
      failed_when: false

    - name: Display API test result
      debug:
        msg: "✓ Podman API responding via socket"
      when: podman_api_test.rc == 0

    - name: Warn if API test failed
      debug:
        msg: "⚠ Podman API test failed - check socket service status"
      when: podman_api_test.rc != 0

  post_tasks:
    - name: Show next steps
      debug:
        msg:
          - ""
          - "╔════════════════════════════════════════╗"
          - "║  Podman Socket Service Configured     ║"
          - "╚════════════════════════════════════════╝"
          - ""
          - "✓ Service: podman-socket"
          - "✓ Socket: /run/podman/podman.sock"
          - "✓ Enabled at boot: yes"
          - ""
          - "Next: Restart Traefik to use the socket"
          - "  podman restart traefik"
          - ""
          - "Or redeploy Traefik:"
          - "  ansible-playbook -i hosts site.yml --tags traefik"
          - ""
