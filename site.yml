---
# Alpine Linux Podman Enterprise Stack Deployment
# Main playbook for deploying containerized infrastructure
#
# Usage:
#   ansible-playbook -i inventory/hosts site.yml
#   ansible-playbook -i inventory/hosts site.yml --tags "security"
#   ansible-playbook -i inventory/hosts site.yml --skip-tags "monitoring"

- name: Deploy Alpine Linux Podman Enterprise Stack
  hosts: alpine_servers
  become: true
  gather_facts: true

  vars_files:
    - all.yml    # Load global configuration variables
    - vault.yml  # Load encrypted credentials (overrides all.yml)

  pre_tasks:
    # Render local-only config files from vault secrets.
    # delegate_to: localhost runs on the ansible controller (ansible-deployment
    # container), which sees the repo at /ansible and writes into the mounted
    # tools/ directory — same location Claude Code hooks read from.
    - name: Render tools/telegram-approval.json from vault
      template:
        src: "{{ playbook_dir }}/tools/telegram-approval.json.j2"
        dest: "{{ playbook_dir }}/tools/telegram-approval.json"
        mode: '0600'
      delegate_to: localhost
      run_once: true
      tags: ['always', 'telegram-approval']

  roles:
    - role: base
      tags: ['base', 'always']

    - role: container-runtime
      tags: ['container-runtime', 'podman']

    - role: claude-prep
      tags: ['claude-prep', 'claude']
      when: claude.enabled | default(true)

    # gemini-prep removed 2026-05-26 — Gemini CLI no longer used.
    # Role tasks remain under roles/gemini-prep/ for reference but are not invoked.
    # To fully uninstall: ssh root@vps && npm uninstall -g @google/gemini-cli
    # - role: gemini-prep
    #   tags: ['gemini-prep', 'gemini']
    #   when: gemini.enabled | default(true)

    - role: cloudflared
      tags: ['cloudflared', 'tunnel']
      when: cloudflared.enabled | default(true)

    - role: cloudflare
      tags: ['cloudflare', 'tunnel', 'dns', 'acme']
      when: cloudflare.enabled | default(true)

    - role: shared-services
      tags: ['shared-services', 'services']

    - role: mcp-servers
      tags: ['mcp-servers', 'mcp']
      when: claude.enabled | default(true)


    - role: management
      tags: ['management', 'admin']
      when: management.enabled | default(true)

    - role: authentication
      tags: ['authentication', 'sso', 'auth']
      when: authentication.enabled | default(true)

    - role: monitoring
      tags: ['monitoring', 'observability']

    - role: security
      tags: ['security', 'hardening']

    # tailscale must run AFTER security: the security role's configure-firewall.sh
    # flushes the INPUT chain on every run, which would wipe any tailscale ACCEPT
    # rule inserted earlier. Tailscale's role re-adds the rule (and persists it
    # via /etc/local.d/firewall.start for next boot).
    - role: tailscale
      tags: ['tailscale']
      when: tailscale.enabled | default(true)

    - role: ai-stack
      tags: ['ai-stack', 'openwebui', 'searxng']
      when: ai_stack.enabled | default(true)

    - role: trading
      tags: ['trading', 'atlas', 'backtrader']
      when: trading.enabled | default(true)

    - role: journey-tracker
      tags: ['journey-tracker', 'timeline']
      when: journey_tracker.enabled | default(true)

    # WorldView consolidated into frontend role (frontend-pod)

    # squid-proxy merged into security role (host-level service)

    - role: frontend
      tags: ['frontend', 'web']
      when: deploy_frontend | default(true)

    - role: backend
      tags: ['backend', 'api']
      when: deploy_backend | default(true)

    - role: backup
      tags: ['backup', 'backup-setup', 'backup-run', 'restore']
      when: backup.enabled | default(true)

    - role: flyer-generator
      tags: ['flyer-generator']
      when: flyer_generator.enabled | default(true)

    - role: github-runner
      tags: ['github-runner', 'cicd']
      when: deploy_github_runner | default(false)

    - role: hermes
      tags: ['hermes', 'agent']
      when: hermes.enabled | default(true)

    # boot-services MUST be last: it generates OpenRC init scripts that
    # reference the pods/containers other roles created. If it ran earlier,
    # `rc-update add <name>` would fail because the service file is generated
    # but the pod might not exist yet.
    - role: boot-services
      tags: ['boot-services']
      when: boot_services.enabled | default(true)

  post_tasks:
    # Netavark NAT recovery — always runs at end of play.
    # Reloads firewall rules for every running container. Idempotent, ~3s.
    # Fixes the "curl 127.0.0.1:<port> times out" bug that hits every time
    # Ansible recreates a container or pod with host port mappings. See
    # roles/base/handlers/main.yml for the full explanation.
    - name: Recover netavark NAT (reload all container firewall rules)
      command: podman network reload --all
      changed_when: false
      failed_when: false
      tags: ['always', 'network-recover']

    - name: Display deployment summary
      debug:
        msg:
          - "============================================"
          - "Alpine Podman Enterprise Stack Deployed!"
          - "============================================"
          - ""
          - "POD ARCHITECTURE (10 pods + host services):"
          - "  security-infra-pod: Traefik, Cloudflared, CrowdSec"
          - "  metrics-pod: VictoriaMetrics, Grafana, Renderer"
          - "  logs-pod: Alloy, Loki"
          - "  tempo-pod: Tempo"
          - "  ai-stack-pod: OpenWebUI, LiteLLM, PostgreSQL, SearxNG"
          - "  authentication-pod: Authentik Server, Worker, PostgreSQL, Redis"
          - "  management-pod: Portainer, Dockge"
          - "  frontend-pod: Nginx, Atlas Charts, Journey Tracker, WorldView, Ops Dashboard"
          - "  shared-db-pod: PostgreSQL"
          - "  security-pod: Trivy, Wazuh"
          - "  hermes-pod: Hermes Agent"
          - ""
          - "HOST SERVICES:"
          - "  node-exporter: Port 9100 (apk install)"
          - "  podman-metrics: Cron script (every 60s)"
          - ""
          - "NETWORKS:"
          - "  enterprise_network (REDACTED_CIDR) - Cross-pod routing"
          - "  monitoring-net (REDACTED_CIDR) - OTEL/scrape isolation"
          - ""
          - "ACCESS (via Cloudflare Tunnel):"
          - "  Grafana: https://grafana.{{ domain_name | default('REDACTED_DOMAIN') }}"
          - "  OpenWebUI: https://chat.{{ domain_name | default('REDACTED_DOMAIN') }}"
          - "  Portainer: https://portainer.{{ domain_name | default('REDACTED_DOMAIN') }}"
          - "  Authentik: https://auth.{{ domain_name | default('REDACTED_DOMAIN') }}"
          - ""
          - "SECURITY: Only SSH (22) exposed to internet"
          - "All services behind Cloudflare Tunnel -> Traefik -> Authentik OIDC"
          - "============================================"
      tags: ['always']
